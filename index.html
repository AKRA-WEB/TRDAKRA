        // ==========================================
        // 4c. CHECK STOCK ACTION HANDLERS
        // ==========================================
        function getCleanedCheckedLocations() {
            const locs = state.checkStockCheckedLocations || {};
            const cleaned = {};
            let changed = false;
            
            const now = new Date();
            const cutoff = new Date();
            cutoff.setHours(18, 0, 0, 0); // 18:00 วันนี้
            if (now.getTime() < cutoff.getTime()) {
                cutoff.setDate(cutoff.getDate() - 1); // 18:00 เมื่อวาน
            }
            const cutoffTime = cutoff.getTime();

            for (const loc in locs) {
                const checkTime = new Date(locs[loc]).getTime();
                if (checkTime >= cutoffTime) {
                    cleaned[loc] = locs[loc];
                } else {
                    changed = true;
                }
            }
            if (changed) {
                state.checkStockCheckedLocations = cleaned;
                localStorage.setItem('TRDAKRA_CHECKED_LOCATIONS', JSON.stringify(cleaned));
            }
            return cleaned;
        }

        function selectCheckStockLocation(floor, location) {
            state.checkStockLocation = { floor, location };
            state.checkStockEdits = {};
            state.checkStockSearch = '';
            render();
        }

        function toggleCheckStockItem(productName) {
            if (!state.checkStockEdits[productName]) {
                state.checkStockEdits[productName] = { checked: true, currentStock: '', requestQty: '' };
            } else {
                state.checkStockEdits[productName].checked = !state.checkStockEdits[productName].checked;
            }
            render();
        }

        function updateCheckStockStock(productName, val) {
            if (!state.checkStockEdits[productName]) {
                state.checkStockEdits[productName] = { checked: true, currentStock: '', requestQty: '' };
            }
            state.checkStockEdits[productName].currentStock = val;
            
            // Dynamic UI update for the specific row's calculation to avoid full re-render
            const prod = state.products.find(p => p.name === productName);
            const calcEl = document.getElementById(`calc-need-${encodeURIComponent(productName)}`);
            if (calcEl && prod) {
                const cur = parseInt(val);
                const par = prod.parLevel || 0;
                if (!isNaN(cur) && par > 0) {
                    const need = Math.max(0, par - cur);
                    if (need > 0) {
                        calcEl.innerHTML = `<span>ต้องการเติมสต๊อก:</span><span class="text-sm font-bold text-brand-orange">${need} ${esc(prod.unit || 'หน่วย')}</span>`;
                    } else {
                        calcEl.innerHTML = `<span>ต้องการเติมสต๊อก:</span><span class="text-sm font-bold text-emerald-600">0 (พอแล้ว)</span>`;
                    }
                } else if (par === 0) {
                    calcEl.innerHTML = `<span class="text-amber-600 font-semibold">ไม่มี Par Level ในระบบ</span>`;
                } else {
                    calcEl.innerHTML = `<span>ต้องการเติมสต๊อก:</span><span class="text-xs text-slate-400">รอป้อนจำนวน</span>`;
                }
            }
        }

        function updateCheckStockRequestQty(productName, val) {
            if (!state.checkStockEdits[productName]) {
                state.checkStockEdits[productName] = { checked: true, currentStock: '', requestQty: '' };
            }
            state.checkStockEdits[productName].requestQty = val;
        }

        function openParEdit(productName) {
            const prod = state.products.find(p => p.name === productName);
            state.checkStockEditingPar = productName;
            state.checkStockParInput = prod ? String(prod.parLevel || '') : '';
            render();
        }

        async function saveParEdit(productName) {
            const val = parseInt(state.checkStockParInput) || 0;
            const prod = state.products.find(p => p.name === productName);
            if (!prod) { state.checkStockEditingPar = null; render(); return; }
            let ok = false;
            try {
                ok = await pushProductDetails(productName, prod.floor || '', prod.location || '', val);
            } catch(e) { ok = false; }
            if (!ok) { alert('บันทึก Par Level ไม่สำเร็จ ข้อมูลอาจยังไม่ถูกบันทึก กรุณาลองใหม่'); return; }
            const idx = state.products.findIndex(p => p.name === productName);
            if (idx !== -1) state.products[idx].parLevel = val;
            state.checkStockEditingPar = null;
            state.checkStockParInput = '';
            render();
        }

        function updateCheckStockSearch(value) {
            state.checkStockSearch = value;
            const search = value.toLowerCase().trim();
            const locObj = state.checkStockLocation;
            if (!locObj) return;
            const locProducts = state.products
                .filter(p => extractZone(p.location) === locObj.location && p.floor === locObj.floor && p.floor !== 'NOSTK')
                .sort(compareCheckStockProducts);

            const filtered = search
                ? locProducts.filter(p => p.name.toLowerCase().includes(search))
                : locProducts;
                
            const listEl = document.getElementById('check-stock-list');
            if (!listEl) return;
            
            if (filtered.length === 0) {
                listEl.innerHTML = `<p class="text-center text-slate-400 py-12 text-sm">ไม่พบสินค้าตามที่ค้นหา</p>`;
            } else {
                listEl.innerHTML = filtered.map(renderCheckStockRow).join('');
            }
        }

        async function handleCheckStockSubmit() {
            if (await AppVersionGuard.blockIfStale()) return;
            if (state.checkStockSubmitting) return; // Prevent double submission
            
            const locObj = state.checkStockLocation;
            if (!locObj) return;
            const loc = locObj.location; // zone (เลขนำหน้า lock code)
            const floor = locObj.floor;

            const locProducts = state.products
                .filter(p => extractZone(p.location) === loc && p.floor === floor && p.floor !== 'NOSTK')
                .sort(compareCheckStockProducts);
            const checkedProducts = locProducts.filter(p => state.checkStockEdits[p.name]?.checked);

            // Validation: Checked products must have a quantity input
            let isValid = true;
            checkedProducts.forEach(p => {
                const edit = state.checkStockEdits[p.name];
                const cur = edit.currentStock;
                const par = p.parLevel || 0;
                
                if (cur === '') {
                    isValid = false;
                }
                if (par === 0 && (edit.requestQty === '' || parseInt(edit.requestQty) <= 0)) {
                    isValid = false;
                }
            });

            if (!isValid) {
                alert('กรุณากรอกจำนวนเดิมที่เหลืออยู่ (หรือระบุจำนวนสั่งเบิกในตัวที่ไม่มี Par Level) ให้ครบสำหรับรายการที่ติ๊กเลือก');
                return;
            }

            state.checkStockSubmitting = true;
            showLoading('กำลังส่งรายงานและสั่งเบิก...');

            const now = new Date();
            const timestamp = formatDateTime(now.toISOString());
            const newOrders = [];
            const logItems = [];

            // กันเบิกซ้ำ: ข้ามสินค้าที่มีคำขอค้างอยู่แล้ว (ยังบันทึก survey log ตามจริง)
            const activeSet = getActiveRequestNames();
            const seenOrder = new Set();
            const skippedDup = [];

            locProducts.forEach(p => {
                const edit = state.checkStockEdits[p.name];
                if (edit && edit.checked) {
                    const cur = parseInt(edit.currentStock) || 0;
                    const par = p.parLevel || 0;
                    let need = 0;
                    if (par > 0) {
                        need = Math.max(0, par - cur);
                    } else {
                        need = parseInt(edit.requestQty) || 0;
                    }

                    const norm = normItemName(p.name);
                    const isDup = need > 0 && (activeSet.has(norm) || seenOrder.has(norm));
                    if (isDup) skippedDup.push(p.name);

                    if (need > 0 && !isDup) {
                        seenOrder.add(norm);
                        newOrders.push({
                            id: `REQ-${Math.floor(Math.random() * 9000) + 1000}`,
                            rawDate: now,
                            timestamp: timestamp,
                            itemName: p.name,
                            requestQty: need,
                            storageCapacity: par,
                            status: 'สั่งเบิก',
                            oldExpiry: 'ไม่ได้ระบุ',
                            newExpiry: '', receiveQty: null, receiveNote: '', w2Note: '',
                            requestedBy: currentUser || 'ไม่ทราบ'
                        });
                    }

                    logItems.push({
                        name: p.name,
                        currentStock: cur,
                        parLevel: par,
                        needToOrder: need,
                        status: need > 0 ? (cur === 0 || cur / par < 0.3 ? 'critical' : 'low') : 'ok'
                    });
                } else {
                    // Unchecked products are considered "มีของเยอะอยู่" (OK status, 0 to order)
                    logItems.push({
                        name: p.name,
                        currentStock: p.parLevel || 0, // default to par
                        parLevel: p.parLevel || 0,
                        needToOrder: 0,
                        status: 'ok'
                    });
                }
            });

            try {
                // 1. Submit orders if any
                if (newOrders.length > 0) {
                    state.items = [...newOrders, ...state.items];
                    if (!(await syncDataToSheet(true))) { await fetchInitialData(true, true); return; }
                }

                // 2. Submit survey log (non-fatal: รายการสั่งเบิกถูกบันทึกแล้ว)
                showLoading('กำลังบันทึกประวัติการสำรวจ...');
                try {
                    await postMutation({
                        action: 'saveSurveyLog',
                        surveyedBy: currentUser || 'ไม่ทราบ',
                        floor: `${floor} - โซน ${loc}`, // Save as e.g. "2 - โซน 3"
                        items: logItems
                    });
                } catch(e) { console.error('SurveyLog error', e); }

                // Invalidate cache
                localStorage.removeItem('TRDAKRA_DATA');

                // Mark location as checked
                const compoundKey = `${floor}|${loc}`;
                if (!state.checkStockCheckedLocations) state.checkStockCheckedLocations = {};
                state.checkStockCheckedLocations[compoundKey] = new Date().toISOString();
                localStorage.setItem('TRDAKRA_CHECKED_LOCATIONS', JSON.stringify(state.checkStockCheckedLocations));

                // Go back to location selector page immediately so it's ready behind loader
                state.checkStockLocation = null;
                state.checkStockEdits = {};
                render();
                
                // Refresh data with loading screen still visible
                showLoading('กำลังรีเฟรชข้อมูลแผนผัง...');
                await fetchInitialData(true, true); // skipHideLoading = true

                // Show alert while loading is still covering the screen
                const csDupNote = skippedDup.length > 0
                    ? `\n⚠️ ข้ามที่เบิกซ้ำ ${skippedDup.length} รายการ: ${skippedDup.join(', ')}` : '';
                alert(`✅ บันทึกสต๊อกสำเร็จ!\nส่งสั่งเบิก ${newOrders.length} รายการ จาก ชั้น ${floor} โซน ${loc}${csDupNote}`);
                sendAppLog('ตรวจสต๊อกรายโซน', `ชั้น ${floor} โซน ${loc}: ส่งเบิก ${newOrders.length} รายการ`);
            } catch (err) {
                console.error(err);
                alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล กรุณาลองใหม่อีกครั้ง');
            } finally {
                hideLoading();
                state.checkStockSubmitting = false;
                render();
            }
        }

        // ── Render Helpers: Check Stock Row & Page ──
        function renderCheckStockRow(prod) {
            const edit = state.checkStockEdits[prod.name] || {};
            const checked = !!edit.checked;
            const curStock = edit.currentStock !== undefined ? edit.currentStock : '';
            const requestQty = edit.requestQty !== undefined ? edit.requestQty : '';
            const enc = encodeURIComponent(prod.name);
            const par = prod.parLevel || 0;
            
            // คำนวณเบื้องต้น
            let need = 0;
            if (checked && curStock !== '' && par > 0) {
                need = Math.max(0, par - parseInt(curStock));
            }

            const cardBg = checked ? 'bg-indigo-50/50 border-indigo-200 border-2' : 'bg-white border-slate-100 border';

            const boxClass = checked
                ? 'bg-brand-blue text-white'
                : 'border-2 border-slate-200 bg-white';
            const boxContent = checked ? '✓' : '';

            return `
                <div class="rounded-2xl ${cardBg} shadow-sm transition-all duration-200 flex flex-col mb-3 overflow-hidden">
                    <div onclick="toggleCheckStockItem(decodeURIComponent('${enc}'))"
                         class="flex justify-between items-center gap-3 p-4 cursor-pointer active:bg-indigo-50/60 transition-colors select-none">
                        <div class="flex-1 min-w-0">
                            <h4 class="text-sm font-bold ${checked ? 'text-brand-blue' : 'text-slate-800'} leading-snug">${esc(prod.name)}</h4>
                            <div class="flex items-center gap-1.5 mt-1.5 flex-wrap" onclick="event.stopPropagation()">
                                ${prod.location ? `<span class="text-[10px] font-bold bg-brand-blue/10 text-brand-blue px-2 py-0.5 rounded-full">📍 ${esc(prod.location)}</span>` : ''}
                                ${state.checkStockEditingPar === prod.name ? `
                                    <input type="number" min="0" value="${state.checkStockParInput}"
                                        oninput="state.checkStockParInput=this.value"
                                        onkeydown="if(event.key==='Enter') saveParEdit(decodeURIComponent('${enc}'))"
                                        autofocus
                                        class="w-20 px-2 py-0.5 text-[11px] font-bold border border-brand-blue rounded-lg text-center focus:outline-none">
                                    <button onclick="saveParEdit(decodeURIComponent('${enc}'))"
                                        class="text-[9px] font-bold bg-brand-blue text-white px-2 py-0.5 rounded-full active:scale-95">✓</button>
                                    <button onclick="state.checkStockEditingPar=null; render()"
                                        class="text-[9px] font-bold bg-slate-100 text-slate-500 px-2 py-0.5 rounded-full active:scale-95">✕</button>
                                ` : `
                                    <span class="text-[10px] font-bold bg-slate-100 text-slate-500 px-2 py-0.5 rounded-full">
                                        Par: ${par > 0 ? `${par} ${esc(prod.unit)}` : 'ยังไม่ตั้ง ⚠️'}
                                    </span>
                                    <button onclick="openParEdit(decodeURIComponent('${enc}'))"
                                        class="text-[9px] text-slate-400 hover:text-brand-blue transition-colors flex items-center gap-0.5">
                                        <span class="material-icons-round text-[12px]">edit</span>
                                    </button>
                                `}
                            </div>
                        </div>
                        <div class="w-8 h-8 flex-shrink-0 flex items-center justify-center text-sm font-bold rounded-lg ${boxClass}">${boxContent}</div>
                    </div>

                    ${checked ? `
                    <div class="px-4 pb-4 pt-3 border-t border-dashed border-indigo-100 space-y-3 animate-fade-in">
                        ${par > 0 ? `
                        <div>
                            <label class="block text-[10px] font-bold text-indigo-700 uppercase tracking-wider mb-1">
                                👉 จำนวนที่เหลืออยู่บนชั้น (${esc(prod.unit)}) <span class="text-rose-500">*</span>
                            </label>
                            <input type="number" min="0" value="${curStock}" placeholder="กรอกจำนวนคงเหลือ..."
                                oninput="updateCheckStockStock(decodeURIComponent('${enc}'), this.value)"
                                class="w-full p-2.5 bg-white border border-slate-200 rounded-xl text-sm font-bold focus:border-brand-blue text-center transition-all">
                        </div>
                        <div class="text-xs font-semibold text-brand-blue flex justify-between items-center bg-indigo-50 border border-indigo-100 px-3 py-2 rounded-xl" id="calc-need-${enc}">
                            <span>ต้องการเติมสต๊อก:</span>
                            <span class="text-sm font-bold text-brand-orange">
                                ${curStock !== '' ? `${need} ${esc(prod.unit)}` : 'รอป้อนจำนวน'}
                            </span>
                        </div>
                        ` : `
                        <div>
                            <p class="text-[10px] font-medium text-amber-600 bg-amber-50 border border-amber-100 rounded-lg p-2 mb-2 leading-relaxed">
                                ⚠️ สินค้าไม่มี Par Level กรุณากรอกจำนวนเดิมและจำนวนต้องการเบิกเพิ่มโดยตรง
                            </p>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">เหลืออยู่</label>
                                    <input type="number" min="0" value="${curStock}" placeholder="เหลืออยู่..."
                                        oninput="updateCheckStockStock(decodeURIComponent('${enc}'), this.value)"
                                        class="w-full p-2 bg-white border border-slate-200 rounded-lg text-xs font-bold text-center">
                                </div>
                                <div>
                                    <label class="block text-[10px] font-bold text-brand-orange uppercase mb-1">สั่งเบิกเพิ่ม <span class="text-rose-500">*</span></label>
                                    <input type="number" min="1" value="${requestQty}" placeholder="สั่งเบิก..."
                                        oninput="updateCheckStockRequestQty(decodeURIComponent('${enc}'), this.value)"
                                        class="w-full p-2 bg-white border border-slate-200 rounded-lg text-xs font-bold text-center text-brand-orange focus:border-brand-orange">
                                </div>
                            </div>
                        </div>
                        `}
                    </div>
                    ` : `
                    <div class="px-4 pb-3 text-[10px] font-semibold text-slate-400 flex items-center gap-1.5">
                        <span class="w-1.5 h-1.5 rounded-full bg-slate-300"></span>
                        กดเพื่อสั่งเบิก
                    </div>
                    `}
                </div>`;
        }

        function renderCheckStock() {
            if (!state.checkStockLocation) {
                // ─── 1. หน้าเลือกโลเคชั่น (เลือกกล่องตามแมพปิ้ง) ───
                const floorGroups = {};
                state.products.forEach(p => {
                    if (p.floor && p.floor !== 'NOSTK' && p.location) {
                        const f = p.floor;
                        const zone = extractZone(p.location.trim());
                        if (!zone) return;
                        if (!floorGroups[f]) floorGroups[f] = new Set();
                        floorGroups[f].add(zone);
                    }
                });

                const missingCount = state.products.filter(p => !p.floor).length;
                const sortedFloors = Object.keys(floorGroups).sort();
                let floorsHtml = '';

                if (sortedFloors.length === 0) {
                    floorsHtml = `
                        <div class="text-center py-12 px-4 bg-white rounded-2xl border border-slate-100 shadow-sm">
                            <span class="material-icons-round text-slate-300 text-4xl mb-2">place</span>
                            <p class="text-sm font-semibold text-slate-500">ไม่พบข้อมูลโลเคชั่นสินค้าในระบบ</p>
                            <p class="text-[11px] text-slate-400 mt-1">กรุณากำหนดโลเคชั่นสินค้าที่เมนู "จัดโลเคชั่นสินค้า" ก่อน</p>
                            <button onclick="setView('location')" class="mt-4 px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold shadow-sm">
                                📍 ไปจัดโลเคชั่นสินค้า
                            </button>
                        </div>`;
                } else {
                    floorsHtml = sortedFloors.map(f => {
                        const zones = [...floorGroups[f]].sort((a,b) => a.localeCompare(b, undefined, {numeric: true, sensitivity: 'base'}));
                        const cleanedChecked = getCleanedCheckedLocations();
                        return `
                            <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm space-y-3">
                                <h3 class="text-xs font-bold text-brand-blue flex items-center gap-1.5 border-b border-slate-50 pb-2">
                                    <span class="material-icons-round text-[16px]">layers</span> ชั้น ${f}
                                </h3>
                                <div class="grid grid-cols-3 gap-2">
                                    ${zones.map(zone => {
                                        const count = state.products.filter(p => p.floor === f && extractZone(p.location) === zone && p.floor !== 'NOSTK').length;
                                        const isCheckedToday = !!cleanedChecked[`${f}|${zone}`];

                                        const btnBg = isCheckedToday
                                            ? 'bg-emerald-50 border-emerald-200 text-emerald-700 hover:bg-emerald-100/50 hover:border-emerald-300'
                                            : 'bg-slate-50 border-slate-200 hover:border-brand-blue hover:bg-brand-blue/5 text-slate-700 hover:text-brand-blue';

                                        return `
                                            <button onclick="selectCheckStockLocation('${f}', '${zone}')"
                                                class="py-3 px-2 border rounded-xl text-center active:scale-95 transition-all flex flex-col justify-center items-center gap-1 ${btnBg}">
                                                <span class="text-xs font-bold tracking-wide flex items-center gap-1">
                                                    ${isCheckedToday ? '<span class="material-icons-round text-[12px] text-emerald-600">check_circle</span>' : ''}
                                                    โซน ${esc(zone)}
                                                </span>
                                                <span class="text-[9px] ${isCheckedToday ? 'text-emerald-600/70' : 'text-slate-400'} font-medium">${count} รายการ</span>
                                            </button>`;
                                    }).join('')}
                                </div>
                            </div>`;
                    }).join('<div class="my-4"></div>');
                }

                return `
                    <div class="w-full max-w-md bg-[#f8fafc] min-h-screen flex flex-col">
                        <header class="bg-brand-blue text-white p-4 flex justify-between items-center sticky top-0 z-20 shadow-md">
                            <div class="flex items-center gap-2">
                                <button onclick="setView('home')" aria-label="กลับหน้าหลัก" class="p-1.5 rounded-full hover:bg-black/10 transition-colors text-white">
                                    <span class="material-icons-round">arrow_back</span>
                                </button>
                                <h1 class="text-[17px] font-bold tracking-wide flex items-center gap-1.5">
                                    <span class="material-icons-round text-[20px]">fact_check</span> ใบตรวจเช็คสต๊อก (รายโซน)
                                </h1>
                            </div>
                            <button onclick="fetchInitialData(true)" aria-label="รีเฟรชข้อมูล" class="p-1.5 rounded-full hover:bg-black/10 transition-colors text-white">
                                <span class="material-icons-round text-[20px]">refresh</span>
                            </button>
                        </header>
                        <main class="flex-1 overflow-y-auto p-5 pb-24 space-y-4 animate-fade-in">
                            <div class="bg-indigo-50 border border-indigo-100 rounded-2xl p-4 flex items-start gap-3 shadow-sm">
                                <span class="material-icons-round text-indigo-600 mt-0.5">info</span>
                                <div>
                                    <h4 class="text-xs font-bold text-indigo-800">ขั้นตอนการเช็คของหน้างาน</h4>
                                    <p class="text-[10px] text-indigo-600 mt-1 leading-relaxed">
                                        1. จิ้มเลือกโซนที่จะนับสต๊อก<br>
                                        2. ติ๊กเฉพาะสินค้าที่มีสต๊อกเหลือน้อยควรเติม (ตัวที่ไม่ติ๊กจะถูกข้าม/บันทึกว่าสต๊อกพอแล้วอัตโนมัติ)<br>
                                        3. กรอกจำนวนจริงที่เหลืออยู่บนชั้นวาง จากนั้นกดยืนยันเพื่อส่งใบรายงาน
                                    </p>
                                </div>
                            </div>
                            
                            <button onclick="importParLevelsFromHistory()" class="w-full py-2.5 bg-brand-blue/5 hover:bg-brand-blue/10 border border-brand-blue/20 text-brand-blue text-[11px] font-semibold rounded-xl transition-all flex items-center justify-center gap-1.5">
                                <span class="material-icons-round text-[14px]">download</span> นำเข้า Par Level จากประวัติการเบิก
                            </button>
                            
                            <div class="flex justify-between items-center px-1 mt-6">
                                <h2 class="text-sm font-bold text-slate-800">📍 เลือกโซน (จิ้มเพื่อเช็ค)</h2>
                                ${missingCount > 0 ? `
                                    <span onclick="setView('location')" class="text-[9px] font-bold text-rose-500 bg-rose-50 border border-rose-100 rounded-full px-2 py-0.5 cursor-pointer hover:bg-rose-100 transition-colors">
                                        ⚠️ ไม่มีโลเคชั่น ${missingCount} รายการ
                                    </span>` : ''
                                }
                            </div>
                            
                            <div class="space-y-4">${floorsHtml}</div>
                        </main>
                    </div>`;
            } else {
                // ─── 2. หน้าเช็คสินค้าในโลเคชั่นที่เลือก ───
                const locObj = state.checkStockLocation;
                const loc = locObj.location; // ตอนนี้ loc เก็บ "zone" (เลขนำหน้า lock code)
                const floor = locObj.floor;
                const locProducts = state.products
                    .filter(p => extractZone(p.location) === loc && p.floor === floor && p.floor !== 'NOSTK')
                    .sort(compareCheckStockProducts);
                const search = (state.checkStockSearch || '').toLowerCase().trim();
                
                const filteredProducts = search
                    ? locProducts.filter(p => p.name.toLowerCase().includes(search))
                    : locProducts;

                const editCount = Object.keys(state.checkStockEdits).filter(k => state.checkStockEdits[k].checked).length;

                return `
                    <div class="w-full max-w-md bg-[#f8fafc] min-h-screen flex flex-col">
                        <header class="bg-brand-blue text-white p-4 flex items-center gap-2 sticky top-0 z-20 shadow-md">
                            <button onclick="state.checkStockLocation=null; render()" aria-label="ย้อนกลับ" class="p-1.5 rounded-full hover:bg-black/10 transition-colors text-white">
                                <span class="material-icons-round">arrow_back</span>
                            </button>
                            <div class="flex-1 min-w-0">
                                <h1 class="text-[16px] font-bold">📍 ชั้น ${esc(floor)} - โซน ${esc(loc)}</h1>
                                <p class="text-[11px] text-white/70">เช็คสต๊อกทั้งหมด ${locProducts.length} รายการ</p>
                            </div>
                        </header>
                        
                        <div class="bg-white sticky top-[68px] z-10 border-b border-slate-100 shadow-sm px-4 py-3">
                            <input type="text" value="${esc(state.checkStockSearch)}" placeholder="🔍 ค้นหาสินค้าในโซน ${esc(loc)}..."
                                oninput="updateCheckStockSearch(this.value)"
                                class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:border-brand-blue transition-all">
                        </div>

                        <main class="flex-1 overflow-y-auto p-4 pb-36 animate-fade-in" id="check-stock-list">
                            ${filteredProducts.length === 0
                                ? `<p class="text-center text-slate-400 py-12 text-sm">${search ? 'ไม่พบสินค้าตามที่ค้นหา' : 'ไม่มีสินค้าในโซนนี้'}</p>`
                                : filteredProducts.map(renderCheckStockRow).join('')
                            }
                        </main>

                        <div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white border-t border-slate-100 p-4 shadow-2xl flex flex-col gap-2">
                            <div class="flex justify-between items-center text-xs font-semibold px-1 mb-1">
                                <span class="text-slate-500">เลือกเบิกเติมสต๊อก:</span>
                                <span class="text-brand-blue font-bold text-sm bg-indigo-50 border border-indigo-100 px-2.5 py-0.5 rounded-full">
                                    ${editCount} / ${locProducts.length} รายการ
                                </span>
                            </div>
                            <div class="flex gap-3">
                                <button onclick="state.checkStockLocation=null; render()"
                                    class="flex-1 bg-slate-100 border border-slate-200 text-slate-600 py-3.5 rounded-2xl font-bold text-sm transition-all active:scale-[0.98]">
                                    ← กลับ
                                </button>
                                <button onclick="handleCheckStockSubmit()"
                                    class="flex-[2] bg-brand-orange text-white py-3.5 rounded-2xl font-bold text-sm shadow-lg shadow-brand-orange/20 active:scale-[0.98] transition-all flex items-center justify-center gap-1.5">
                                    <span class="material-icons-round text-[18px]">done_all</span> ส่งใบรายงานตรวจเช็ค
                                </button>
                            </div>
                        </div>
                    </div>`;
            }
        }

        // ── Desktop Sidebar ──
        // อัปเดต bin input โดยตรง — ไม่ render() ทั้งหน้า
        function updateSheetBin(val) {
            const bin = val.toUpperCase();
            state.locationSheetZoneInput = bin;
            const floor = state.locationSheetFloor;
            const code = (floor && floor !== 'NOSTK' && bin) ? `W1-${floor}F-${bin}` : null;
            const canSave = !!(floor && (floor === 'NOSTK' || bin));

            // input: uppercase + border color
            const inp = document.getElementById('ls-bin-input');
            if (inp && inp !== document.activeElement) inp.value = bin;
            if (inp) {
                inp.className = `w-full p-3.5 rounded-2xl text-sm font-bold uppercase text-center tracking-widest transition-all ${bin ? 'bg-blue-50 border-2 border-brand-blue' : 'bg-slate-50 border-2 border-slate-200'}`;
            }

            // preview code
            const prev = document.getElementById('ls-code-preview');
            if (prev) {
                prev.textContent = code || 'ยังไม่ได้กำหนด';
                prev.className = `text-base font-bold tracking-wider ${code ? 'text-brand-blue' : 'text-slate-400'}`;
            }

            // preview banner wrapper
            const banner = document.getElementById('ls-banner');
            if (banner) {
                banner.className = `mx-5 mt-4 px-4 py-3 rounded-2xl flex items-center gap-3 ${code ? 'bg-blue-50 border border-brand-blue/25' : 'bg-slate-50 border border-slate-200'}`;
                const icon = banner.querySelector('.ls-banner-icon');
                if (icon) icon.className = `ls-banner-icon material-icons-round text-[22px] ${code ? 'text-brand-blue' : 'text-slate-400'}`;
            }

            // save button
            const btn = document.getElementById('ls-save-btn');
            if (btn) {
                btn.textContent = canSave ? `✓ บันทึก ${code || 'NOSTK'}` : 'เลือกชั้นและระบุ Bin ก่อน';
                btn.onclick = canSave ? confirmLocationSheet : null;
                btn.className = `w-full py-4 rounded-2xl font-bold text-base transition-all active:scale-[0.98] ${canSave ? 'bg-brand-blue text-white shadow-lg shadow-brand-blue/20' : 'bg-slate-100 text-slate-400 cursor-not-allowed'}`;
            }
        }

        function toggleSidebar() {
            state.sidebarCollapsed = !state.sidebarCollapsed;
            const el = document.getElementById('sidebar');
            if (el) el.className = state.sidebarCollapsed ? 'collapsed' : '';
            // re-render sidebar content for icon-only vs full mode
            const sInner = document.getElementById('sidebar');
            if (sInner) sInner.innerHTML = renderSidebar();
            // re-apply class after innerHTML overwrite
            if (sInner) sInner.className = state.sidebarCollapsed ? 'collapsed' : '';
        }

        function goToPortal() {
            window.location.href = SSO_CONFIG.PORTAL_URL;
        }

        function renderSidebar() {
            const user = window.appSession;
            const col  = state.sidebarCollapsed;
            const navItems = [
                { view: 'home',        icon: 'home',           label: 'หน้าหลัก',    sub: 'Dashboard' },
                { view: 'w1',          icon: 'shopping_cart',  label: 'เบิกสินค้า',  sub: 'TRD' },
                { view: 'w2',          icon: 'local_shipping', label: 'จัดส่งสินค้า', sub: 'AKRA' },
                { view: 'dashboard',   icon: 'bar_chart',      label: 'Analytics',   sub: 'รายงาน' },
                { view: 'location',    icon: 'place',          label: 'จัดโลเคชั่น', sub: 'Location' },
                { view: 'check_stock', icon: 'inventory_2',    label: 'ตรวจสต็อก',  sub: 'Check Stock' },
            ];
            return `
                <!-- Header: Logo + Hamburger -->
                <div class="flex items-center ${col ? 'justify-center px-2 pt-4 pb-3' : 'justify-between px-4 pt-5 pb-4'}">
                    ${!col ? `
                    <div class="flex items-center gap-2.5">
                        <div class="w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0" style="background:rgba(227,82,5,0.9)">
                            <span class="material-icons-round text-white text-[20px]">warehouse</span>
                        </div>
                        <div class="sidebar-logo-text">
                            <p class="font-bold text-white text-[14px] leading-tight tracking-wide">TRD · AKRA</p>
                            <p class="text-[10px] text-white/35 font-mono">v${CURRENT_VERSION}</p>
                        </div>
                    </div>` : ''}
                    <button onclick="toggleSidebar()"
                            title="${col ? 'ขยายเมนู' : 'ย่อเมนู'}"
                            class="w-8 h-8 rounded-xl flex items-center justify-center text-white/50 hover:bg-white/12 hover:text-white transition-all active:scale-95 flex-shrink-0">
                        <span class="material-icons-round text-[20px]">${col ? 'menu' : 'menu_open'}</span>
                    </button>
                </div>

                <!-- Nav items -->
                <nav class="flex-1 ${col ? 'px-2' : 'px-3'} space-y-0.5 pt-1">
                    ${navItems.map(item => {
                        const active = state.view === item.view;
                        return `
                        <button onclick="setView('${item.view}')"
                                title="${item.label}"
                                class="sidebar-nav-btn w-full flex items-center gap-3 ${col ? 'px-0 py-3' : 'px-3.5 py-3'} rounded-2xl transition-all text-left group
                                       ${active ? 'bg-white/18' : 'hover:bg-white/8'}">
                            <span class="material-icons-round text-[21px] flex-shrink-0 transition-colors
                                         ${active ? 'text-white' : 'text-white/40 group-hover:text-white/75'}">${item.icon}</span>
                            <div class="min-w-0 sidebar-label">
                                <p class="text-[13px] font-semibold leading-tight truncate ${active ? 'text-white' : 'text-white/60 group-hover:text-white/90'}">${item.label}</p>
                                <p class="sidebar-sublabel text-[10px] ${active ? 'text-white/45' : 'text-white/28'}">${item.sub}</p>
                            </div>
                            <div class="sidebar-active-dot ml-auto w-1.5 h-1.5 rounded-full bg-white/60 flex-shrink-0 ${active ? '' : 'opacity-0'}"></div>
                        </button>`;
                    }).join('')}
                </nav>

                <!-- Bottom: User + Portal button -->
                <div class="${col ? 'px-2 pb-4 pt-3' : 'px-3 pb-4 pt-3'} space-y-2 border-t border-white/8 mt-2">
                    <!-- Back to Main Portal -->
                    <button onclick="goToPortal()"
                            title="กลับหน้าหลัก"
                            class="w-full flex items-center ${col ? 'justify-center gap-0 px-0' : 'gap-3 px-3.5'} py-2.5 rounded-2xl transition-all hover:bg-white/8 group active:scale-[0.97]">
                        <span class="material-icons-round text-[20px] flex-shrink-0 text-white/40 group-hover:text-white/80 transition-colors">logout</span>
                        <span class="sidebar-label text-[12px] font-semibold text-white/45 group-hover:text-white/80 transition-colors">กลับ Main Portal</span>
                    </button>

                    <!-- User chip -->
                    ${user ? `
                    <div class="flex items-center ${col ? 'justify-center' : 'gap-2.5 px-1'} py-1">
                        <div class="w-8 h-8 rounded-xl flex items-center justify-center flex-shrink-0" style="background:rgba(255,255,255,0.1)">
                            <span class="material-icons-round text-white/55 text-[16px]">person</span>
                        </div>
                        <div class="sidebar-user-detail min-w-0">
                            <p class="text-[12px] font-bold text-white/80 truncate">${esc(user.name || user.id || '—')}</p>
                            <p class="text-[10px] text-white/35">${(user.roles || []).slice(0,2).join(' · ')}</p>
                        </div>
                    </div>` : `<p class="text-[10px] text-white/25 text-center py-1">Demo</p>`}
                </div>
            `;
        }

        // Main Render Function
        function render() {
            const sidebar  = document.getElementById('sidebar');
            const mainView = document.getElementById('main-view');

            if (sidebar) {
                sidebar.innerHTML = renderSidebar();
                sidebar.className = state.sidebarCollapsed ? 'collapsed' : '';
            }

            const target = mainView || document.getElementById('app-root');
            if (state.view === 'home')           { target.innerHTML = renderHome(); }
            else if (state.view === 'w1')        { target.innerHTML = renderW1(); }
            else if (state.view === 'w2')        { target.innerHTML = renderW2(); }
            else if (state.view === 'dashboard') { target.innerHTML = renderDashboard(); }
            else if (state.view === 'location')  { target.innerHTML = renderLocationManager(); }
            else if (state.view === 'check_stock') { target.innerHTML = renderCheckStock(); }
        }

        // ==========================================
        // 6. INITIALIZATION
        // ==========================================
        async function checkAppVersion() {
            try {
                const res = await fetch('version.json?t=' + Date.now());
                if (!res.ok) return true;
                const config = await res.json();
                if (config && config.version && config.version !== CURRENT_VERSION) {
                    showLoading('พบเวอร์ชันใหม่ กำลังอัปเดตระบบ...');
                    setTimeout(() => {
                        const url = new URL(window.location.href);
                        url.searchParams.set('update', Date.now());
                        window.location.replace(url.toString());
                    }, 800);
                    return false;
                }
            } catch (e) {
                console.warn('Version check skipped:', e);
            }
            return true;
        }

        /* ===== AKRA Global Version Guard (shared inline, Conductor plan 20260611-003) =====
           Watches version.json after load (interval/focus/visibility/pageshow). On mismatch it
           shows a non-blocking reload banner; a blocking modal + abort only fires before a
           mutation via blockIfStale(). Reads listed in readActions stay allowed. */
        const AppVersionGuard = (function () {
            var cfg = { current: '', readActions: [] };
            var stale = false, started = false;
            var POLL_MS = 5 * 60 * 1000;

            function reload() {
                var url = new URL(window.location.href);
                url.searchParams.set('update', Date.now());
                window.location.replace(url.toString());
            }
            function injectStyles() {
                if (document.getElementById('avg-style')) return;
                var s = document.createElement('style');
                s.id = 'avg-style';
                s.textContent = '#avg-banner{position:fixed;top:0;left:0;right:0;z-index:2147483646;background:#E35205;color:#fff;font:600 14px/1.4 system-ui,sans-serif;padding:10px 14px;display:flex;gap:12px;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.2)}#avg-banner button{cursor:pointer;border:0;border-radius:8px;font-weight:700;padding:8px 16px;background:#fff;color:#E35205}#avg-modal{position:fixed;inset:0;z-index:2147483647;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px}#avg-modal .avg-card{background:#fff;color:#1f2937;max-width:380px;width:100%;border-radius:16px;padding:24px;text-align:center;font:400 15px/1.5 system-ui,sans-serif;box-shadow:0 12px 40px rgba(0,0,0,.3)}#avg-modal .avg-card h2{font-size:18px;font-weight:800;margin:0 0 8px}#avg-modal .avg-card button{cursor:pointer;border:0;margin-top:16px;background:#E35205;color:#fff;width:100%;padding:12px;border-radius:8px;font-weight:700}';
                document.head.appendChild(s);
            }
            function showBanner() {
                injectStyles();
                if (document.getElementById('avg-banner')) return;
                var bar = document.createElement('div');
                bar.id = 'avg-banner';
                bar.setAttribute('role', 'status');
                bar.setAttribute('aria-live', 'polite');
                var msg = document.createElement('span');
                msg.textContent = 'มีเวอร์ชันใหม่ของระบบ กรุณารีโหลดเพื่ออัปเดต';
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = 'รีโหลด';
                btn.addEventListener('click', reload);
                bar.appendChild(msg);
                bar.appendChild(btn);
                document.body.appendChild(bar);
            }
            function showModal() {
                injectStyles();
                var existing = document.getElementById('avg-modal');
                if (existing) { existing.querySelector('button').focus(); return; }
                var m = document.createElement('div');
                m.id = 'avg-modal';
                m.setAttribute('role', 'alertdialog');
                m.setAttribute('aria-modal', 'true');
                m.setAttribute('aria-labelledby', 'avg-modal-title');
                var card = document.createElement('div');
                card.className = 'avg-card';
                var h = document.createElement('h2');
                h.id = 'avg-modal-title';
                h.textContent = 'ต้องอัปเดตระบบ';
                var p = document.createElement('div');
                p.setAttribute('aria-live', 'assertive');
                p.textContent = 'พบเวอร์ชันใหม่ ไม่สามารถบันทึกจากหน้าเดิมได้ กรุณารีโหลดก่อนทำรายการ';
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = 'รีโหลดเดี๋ยวนี้';
                btn.addEventListener('click', reload);
                card.appendChild(h);
                card.appendChild(p);
                card.appendChild(btn);
                m.appendChild(card);
                document.body.appendChild(m);
                btn.focus();
            }
            async function fetchRemote() {
                try {
                    var res = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
                    if (!res.ok) return null;
                    var c = await res.json();
                    return (c && c.version) ? String(c.version) : null;
                } catch (e) { console.warn('Version check skipped:', e); return null; }
            }
            function markStale() {
                if (stale) return;
                stale = true;
                showBanner();
            }
            async function check() {
                if (stale) return false;
                var remote = await fetchRemote();
                if (remote && remote !== cfg.current) { markStale(); return false; }
                return true;
            }
            // Returns true when the caller's mutation should be BLOCKED. Awaits a fresh check
            // right before a save to close the polling race window (see plan Risk note).
            async function blockIfStale(action) {
                if (action && cfg.readActions.indexOf(action) !== -1) return false;
                if (!stale) await check();
                if (!stale) return false;
                showModal();
                return true;
            }
            function start(options) {
                cfg.current = options.current;
                cfg.readActions = options.readActions || [];
                if (started) return;
                started = true;
                setInterval(check, POLL_MS);
                document.addEventListener('visibilitychange', function () {
                    if (document.visibilityState === 'visible') check();
                });
                window.addEventListener('focus', check);
                window.addEventListener('pageshow', function (e) { if (e.persisted) check(); });
            }
            return { start: start, check: check, blockIfStale: blockIfStale, isStale: function () { return stale; }, reloadNow: reload };
        })();

        window.onload = async function() {
            const isVersionOk = await checkAppVersion();
            if (isVersionOk) {
                AppVersionGuard.start({ current: CURRENT_VERSION, readActions: [] });
                ssoInit();
            }
        };

    </script>
</body>
