        // --- Analytics Sub-renders ---
        function renderDashboardSummary(dispatchedItems, allItems, startDate) {
            let totalQty = 0, totalRequestQty = 0;
            const itemStats = {};
            const requesterStats = {};

            dispatchedItems.forEach(item => {
                const qty = getActualReceivedQty(item);
                const reqQty = parseInt(item.requestQty) || 0;
                const capacity = parseInt(item.storageCapacity) || 0;
                totalQty += qty;
                totalRequestQty += reqQty;
                if (!itemStats[item.itemName]) itemStats[item.itemName] = { count: 0, qty: 0, capacity: 0 };
                itemStats[item.itemName].count++;
                itemStats[item.itemName].qty += qty;
                if (capacity > itemStats[item.itemName].capacity) itemStats[item.itemName].capacity = capacity;
                if (item.requestedBy) requesterStats[item.requestedBy] = (requesterStats[item.requestedBy] || 0) + 1;
            });

            const problemCount = allItems.filter(i => {
                const d = i.rawDate ? new Date(i.rawDate) : new Date(0);
                return (i.status === 'สินค้าหมด' || i.status === 'ยกเลิก') && d >= startDate;
            }).length;

            const fulfillmentRate = totalRequestQty > 0 ? Math.round((totalQty / totalRequestQty) * 100) : 100;
            const fulfillBg = fulfillmentRate >= 90 ? 'bg-emerald-500 shadow-emerald-500/20' : fulfillmentRate >= 70 ? 'bg-amber-500 shadow-amber-500/20' : 'bg-rose-500 shadow-rose-500/20';

            const topItems = Object.keys(itemStats).map(k => ({
                name: k, count: itemStats[k].count, qty: itemStats[k].qty, capacity: itemStats[k].capacity
            })).sort((a, b) => b.qty - a.qty).slice(0, 10);

            const topRequesters = Object.entries(requesterStats)
                .sort((a, b) => b[1] - a[1]).slice(0, 3)
                .map(([name, count]) => ({ name, count }));

            return `
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-brand-blue p-4 rounded-[1.5rem] shadow-lg shadow-brand-blue/20 text-white relative overflow-hidden">
                        <span class="material-icons-round absolute -right-2 -bottom-2 text-[60px] opacity-10">inventory</span>
                        <p class="text-[11px] font-semibold text-white/80 uppercase tracking-wider mb-1">ยอดจัดส่งรวม</p>
                        <p class="text-2xl font-bold">${totalQty.toLocaleString()} <span class="text-xs font-medium text-white/80">ชิ้น</span></p>
                    </div>
                    <div class="bg-brand-orange p-4 rounded-[1.5rem] shadow-lg shadow-brand-orange/20 text-white relative overflow-hidden">
                        <span class="material-icons-round absolute -right-2 -bottom-2 text-[60px] opacity-10">receipt_long</span>
                        <p class="text-[11px] font-semibold text-white/80 uppercase tracking-wider mb-1">จำนวนบิลเบิก</p>
                        <p class="text-2xl font-bold">${dispatchedItems.length.toLocaleString()} <span class="text-xs font-medium text-white/80">รายการ</span></p>
                    </div>
                    <div class="${fulfillBg} p-4 rounded-[1.5rem] shadow-lg text-white relative overflow-hidden">
                        <span class="material-icons-round absolute -right-2 -bottom-2 text-[60px] opacity-10">task_alt</span>
                        <p class="text-[11px] font-semibold text-white/80 uppercase tracking-wider mb-1">Fulfillment Rate</p>
                        <p class="text-2xl font-bold">${fulfillmentRate}<span class="text-xs font-medium text-white/80">%</span></p>
                    </div>
                    <div class="bg-rose-500 p-4 rounded-[1.5rem] shadow-lg shadow-rose-500/20 text-white relative overflow-hidden">
                        <span class="material-icons-round absolute -right-2 -bottom-2 text-[60px] opacity-10">error_outline</span>
                        <p class="text-[11px] font-semibold text-white/80 uppercase tracking-wider mb-1">หมด/ยกเลิก</p>
                        <p class="text-2xl font-bold">${problemCount} <span class="text-xs font-medium text-white/80">รายการ</span></p>
                    </div>
                </div>

                ${topRequesters.length > 0 ? `
                <div>
                    <h3 class="text-sm font-bold text-brand-blue mb-3 flex items-center gap-2 px-1">
                        <span class="material-icons-round text-brand-orange text-[18px]">emoji_people</span> ผู้ขอเบิกสูงสุด
                    </h3>
                    <div class="bg-white rounded-[1.5rem] shadow-[0_4px_16px_rgb(0,0,0,0.03)] border border-slate-100 divide-y divide-slate-50">
                        ${topRequesters.map(r => `
                            <div class="flex items-center gap-3 p-3">
                                <div class="w-8 h-8 rounded-full bg-brand-blue/10 text-brand-blue flex items-center justify-center font-bold text-xs flex-shrink-0">
                                    ${esc(r.name.charAt(0).toUpperCase())}
                                </div>
                                <span class="text-sm font-semibold text-slate-700 flex-1 truncate">${esc(r.name)}</span>
                                <span class="text-xs font-bold text-brand-orange bg-brand-orange/10 px-2 py-0.5 rounded-lg">${r.count} บิล</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
                ` : ''}

                <div>
                    <h3 class="text-sm font-bold text-brand-blue mb-3 flex items-center gap-2 px-1">
                        <span class="material-icons-round text-brand-orange text-[18px]">lightbulb</span> วิเคราะห์พฤติกรรมการเบิก (Insights)
                    </h3>
                    ${topItems.length === 0 ? renderEmptyState('ไม่มีข้อมูลในช่วงเวลานี้', 'analytics') : `
                        <div class="space-y-4">
                            ${topItems.map((item, idx) => {
                                const insight = getInsightDetails(item.name, item.qty, item.count, item.capacity);
                                return `
                                    <div class="bg-white p-4 rounded-[1.5rem] shadow-[0_4px_16px_rgb(0,0,0,0.03)] border border-slate-100">
                                        <div class="flex justify-between items-start mb-3">
                                            <div class="flex-1 pr-3">
                                                <span class="text-[10px] font-bold text-slate-400">อันดับ ${idx + 1}</span>
                                                <h4 class="font-bold text-brand-blue text-[15px] leading-tight mt-0.5">${esc(item.name)}</h4>
                                            </div>
                                            <div class="text-right">
                                                <p class="font-bold text-brand-orange text-lg leading-none">${item.qty.toLocaleString()} <span class="text-[10px] font-medium text-brand-orange/80">ชิ้น</span></p>
                                                <p class="text-[10px] text-slate-400 font-medium mt-1">${item.count} บิลสั่งเบิก</p>
                                            </div>
                                        </div>
                                        <div class="${insight.bg} ${insight.border} border p-3 rounded-xl flex gap-3 items-start mt-2">
                                            <span class="material-icons-round ${insight.color} text-[18px] mt-0.5">${insight.icon}</span>
                                            <div>
                                                <p class="text-xs font-bold ${insight.color} mb-0.5">${insight.title}</p>
                                                <p class="text-[10px] text-slate-600 leading-snug">${insight.desc}</p>
                                            </div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    `}
                </div>

                <div>
                    <h3 class="text-sm font-bold text-brand-blue mb-3 flex items-center gap-2 px-1">
                        <span class="material-icons-round text-brand-orange text-[18px]">history</span> รายการบิลเบิกย้ายล่าสุด
                    </h3>
                    ${dispatchedItems.length === 0 ? renderEmptyState('ไม่มีบิลจัดส่ง', 'receipt') : `
                        <div class="bg-white rounded-[1.5rem] shadow-[0_4px_16px_rgb(0,0,0,0.03)] border border-slate-100 overflow-hidden">
                            ${dispatchedItems.slice(0, 20).map(bill => `
                                <div class="p-4 border-b border-slate-50 last:border-0 hover:bg-slate-50 transition-colors">
                                    <div class="flex justify-between items-center mb-1.5 flex-wrap gap-1">
                                        <span class="text-[10px] font-mono font-semibold text-brand-blue bg-brand-blue/10 px-2 py-0.5 rounded">${bill.id}</span>
                                        <div class="text-[9px] text-slate-400 flex items-center gap-2 flex-wrap">
                                            <span class="inline-flex items-center gap-0.5"><span class="material-icons-round text-[11px]">event_note</span>เบิก: ${bill.timestamp.split(' / ')[0]}</span>
                                            ${bill.dispatchTimestamp ? `<span class="inline-flex items-center gap-0.5"><span class="material-icons-round text-[11px] text-emerald-500">local_shipping</span>จัดส่ง: ${bill.dispatchTimestamp.split(' / ')[0]}</span>` : ''}
                                        </div>
                                    </div>
                                    <p class="text-sm font-bold text-slate-800 mb-1 truncate">${esc(bill.itemName)}</p>
                                    <div class="flex justify-between items-end">
                                        <div class="text-[10px] text-slate-500 flex items-center gap-1 mt-1">
                                            <span class="material-icons-round text-[12px] text-slate-400">inventory_2</span>
                                            ความจุ: <span class="font-medium text-slate-700">${bill.storageCapacity || 0} ชิ้น</span>
                                        </div>
                                        <span class="text-xs font-bold text-brand-orange bg-brand-orange/10 px-2 py-1 rounded-lg">รับ ${getActualReceivedQty(bill)} ชิ้น</span>
                                    </div>
                                </div>
                            `).join('')}
                            ${dispatchedItems.length > 20 ? `<div class="p-3 text-center text-[10px] text-slate-400 bg-slate-50 border-t border-slate-100">แสดงข้อมูล 20 รายการล่าสุด</div>` : ''}
                        </div>
                    `}
                </div>
            `;
        }

        function renderDashboardTrend() {
            const filter = state.dashboardFilter;
            const actMap = buildActivityMap();
            const TH_MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

            let navLabel;
            if (filter === 'month') {
                navLabel = `${TH_MONTHS[state.calendarMonth]} ${state.calendarYear + 543}`;
            } else {
                const ws = getDisplayedWeekStart();
                const we = new Date(ws);
                we.setDate(ws.getDate() + 6);
                const fmt = d => `${d.getDate()} ${TH_MONTHS[d.getMonth()]}`;
                navLabel = `${fmt(ws)} – ${fmt(we)}`;
            }

            return `
                <div class="flex items-center justify-between bg-white p-3 rounded-2xl shadow-[0_2px_8px_rgb(0,0,0,0.04)] border border-slate-100">
                    <button onclick="setCalendarNav(-1)" class="p-2 rounded-xl hover:bg-slate-100 active:bg-slate-200 transition-colors">
                        <span class="material-icons-round text-brand-blue text-[20px]">chevron_left</span>
                    </button>
                    <span class="text-sm font-bold text-brand-blue">${navLabel}</span>
                    <button onclick="setCalendarNav(1)" class="p-2 rounded-xl hover:bg-slate-100 active:bg-slate-200 transition-colors">
                        <span class="material-icons-round text-brand-blue text-[20px]">chevron_right</span>
                    </button>
                </div>

                ${filter === 'month' ? renderCalendarMonth(actMap) : renderCalendarWeek(actMap)}

                ${state.calendarSelectedDate ? renderDayDetail(state.calendarSelectedDate) : ''}
            `;
        }

        function renderCalendarMonth(actMap) {
            const year = state.calendarYear;
            const month = state.calendarMonth;
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startDow = firstDay.getDay();
            const startOffset = startDow === 0 ? 6 : startDow - 1;

            const today = new Date();
            const todayKey = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
            const DAY_HEADERS = ['จ','อ','พ','พฤ','ศ','ส','อา'];

            const cells = [];
            for (let i = 0; i < startOffset; i++) cells.push(null);
            for (let d = 1; d <= lastDay.getDate(); d++) cells.push(new Date(year, month, d));
            while (cells.length % 7 !== 0) cells.push(null);

            return `
                <div class="bg-white rounded-[1.5rem] shadow-[0_4px_16px_rgb(0,0,0,0.03)] border border-slate-100 p-3">
                    <div class="grid grid-cols-7 mb-1">
                        ${DAY_HEADERS.map(h => `<div class="text-center text-[10px] font-bold text-slate-400 py-1">${h}</div>`).join('')}
                    </div>
                    <div class="grid grid-cols-7 gap-1">
                        ${cells.map(d => {
                            if (!d) return `<div></div>`;
                            const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
                            const act = actMap[key] || { billCount: 0, hasStockout: false };
                            const isToday = key === todayKey;
                            const isSelected = key === state.calendarSelectedDate;

                            let bg = 'bg-slate-50 text-slate-400';
                            if (act.billCount >= 6) bg = 'bg-brand-blue text-white';
                            else if (act.billCount >= 3) bg = 'bg-blue-300 text-blue-900';
                            else if (act.billCount >= 1) bg = 'bg-blue-100 text-blue-700';

                            return `
                                <div onclick="selectCalendarDate('${key}')"
                                     class="relative rounded-xl p-1.5 text-center cursor-pointer transition-all active:scale-95
                                            ${bg}
                                            ${isToday ? 'ring-2 ring-brand-orange ring-offset-1' : ''}
                                            ${isSelected ? 'ring-2 ring-brand-orange shadow-md' : ''}">
                                    <span class="text-[12px] font-bold leading-none">${d.getDate()}</span>
                                    ${act.billCount > 0 ? `<div class="text-[8px] font-semibold opacity-80 mt-0.5">${act.billCount}บ</div>` : ''}
                                    ${act.hasStockout ? `<div class="absolute top-0.5 right-0.5 w-1.5 h-1.5 bg-rose-500 rounded-full"></div>` : ''}
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function renderCalendarWeek(actMap) {
            const ws = getDisplayedWeekStart();
            const DAYS = ['จ','อ','พ','พฤ','ศ','ส','อา'];
            const days = Array.from({length: 7}, (_, i) => {
                const d = new Date(ws);
                d.setDate(ws.getDate() + i);
                return d;
            });

            const maxBills = Math.max(1, ...days.map(d => {
                const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
                return (actMap[key] || {}).billCount || 0;
            }));

            const today = new Date();

            return `
                <div class="bg-white rounded-[1.5rem] shadow-[0_4px_16px_rgb(0,0,0,0.03)] border border-slate-100 p-4">
                    <div class="grid grid-cols-7 gap-1 items-end" style="height:120px">
                        ${days.map((d, i) => {
                            const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
                            const act = actMap[key] || { billCount: 0, hasStockout: false };
                            const barH = Math.max(4, Math.round((act.billCount / maxBills) * 80));
                            const isToday = d.toDateString() === today.toDateString();
                            const isSelected = key === state.calendarSelectedDate;
                            const barColor = isSelected ? 'bg-brand-orange' : isToday ? 'bg-brand-blue' : 'bg-blue-300';

                            return `
                                <div onclick="selectCalendarDate('${key}')"
                                     class="flex flex-col items-center justify-end h-full cursor-pointer gap-0.5">
                                    <span class="text-[9px] font-bold text-slate-500">${act.billCount > 0 ? act.billCount : ''}</span>
                                    <div class="w-full rounded-t-lg ${barColor} ${isSelected ? 'ring-1 ring-brand-orange ring-offset-1' : ''} transition-all"
                                         style="height:${barH}px"></div>
                                    <span class="text-[9px] font-semibold ${isToday ? 'text-brand-blue' : 'text-slate-400'}">${DAYS[i]}</span>
                                    <span class="text-[10px] font-bold ${isToday ? 'text-brand-blue' : 'text-slate-600'}">${d.getDate()}</span>
                                    ${act.hasStockout ? `<div class="w-1.5 h-1.5 bg-rose-500 rounded-full"></div>` : `<div class="w-1.5 h-1.5"></div>`}
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function renderDayDetail(dateStr) {
            const [year, month, day] = dateStr.split('-').map(Number);
            const dateObj = new Date(year, month - 1, day);
            const TH_MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
            const TH_DAYS = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
            const displayDate = `วัน${TH_DAYS[dateObj.getDay()]}ที่ ${day} ${TH_MONTHS[month-1]} ${year + 543}`;

            const dayItems = state.items.filter(item => {
                const d = item.rawDate ? new Date(item.rawDate) : null;
                if (!d || isNaN(d.getTime())) return false;
                const k = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
                return k === dateStr;
            });

            const dispatched = dayItems.filter(i => i.status === 'จัดส่งแล้ว' || i.status === 'รับสินค้าแล้ว');
            const totalQty = dispatched.reduce((s, i) => s + getActualReceivedQty(i), 0);

        // ── Product deep-dive analytics ───────────────────────────────
        // จัดส่งสำเร็จ (ใช้คำนวณยอดจัดส่งจริง + fulfillment rate)
        const FULFILLED_STATUSES = ['จัดส่งแล้ว', 'รับสินค้าแล้ว', 'จัดส่งไม่ครบ'];

        // วันที่ของแต่ละรายการ: วันที่เบิก (request) และวันที่จัดส่ง (dispatch)
        function productRecordDates(item) {
            const reqDate = item.rawDate ? new Date(item.rawDate) : null;
            const dispDate = item.dispatchTimestamp ? parseFormattedDate(item.dispatchTimestamp) : null;
            return { reqDate, dispDate };
        }

        // สินค้าเคลื่อนไหวเร็วในช่วง N วันล่าสุด (จัดตามยอดจัดส่งจริง)
        function getFastMovingProducts(days) {
            const start = Date.now() - days * 86400000;
            const map = {};
            state.items.forEach(item => {
                if (!FULFILLED_STATUSES.includes(item.status)) return;
                const { reqDate, dispDate } = productRecordDates(item);
                const fd = dispDate || reqDate;
                if (!fd || fd.getTime() < start) return;
                const name = (item.itemName || '').trim();
                if (!name) return;
                if (!map[name]) map[name] = { name, qty: 0, bills: 0 };
                map[name].qty += getActualReceivedQty(item);
                map[name].bills++;
            });
            return Object.values(map).sort((a, b) => b.qty - a.qty);
        }

        // รวมข้อมูลเชิงลึกของสินค้า 1 รายการ (จับคู่ชื่อแบบ exact match)
        function computeProductAnalytics(name) {
            const target = (name || '').trim();
            const records = state.items.filter(i => (i.itemName || '').trim() === target);
            const now = Date.now();
            const DAY = 86400000;

            const agg = {
                name: target,
                unit: getProductUnitClient(target),
                details: getProductDetails(target),
                totalBills: records.length,
                totalRequested: 0,       // ยอดขอเบิกรวมทุกบิล (ทุกสถานะ)
                requestedFulfilled: 0,   // ยอดขอเบิกของบิลที่จัดส่งแล้ว (ตัวหารของ rate)
                totalFulfilled: 0,       // ยอดจัดส่งจริง (ตัวตั้งของ rate)
                fulfilledBills: 0,
                latestRequest: null,
                latestDispatch: null,
                pending: [],
                timeline: [],
                win: {}
            };
            [3, 7].forEach(d => agg.win[d] = { reqQty: 0, fulQty: 0, reqQtyPrev: 0, fulQtyPrev: 0, fulBills: 0 });

            records.forEach(item => {
                const reqQty = parseInt(item.requestQty) || 0;
                const recQty = getActualReceivedQty(item);
                const { reqDate, dispDate } = productRecordDates(item);
                const isFulfilled = FULFILLED_STATUSES.includes(item.status);
                const isPending = ACTIVE_W1_STATUSES.includes(item.status);

                agg.totalRequested += reqQty;
                if (isFulfilled) {
                    agg.requestedFulfilled += reqQty;
                    agg.totalFulfilled += recQty;
                    agg.fulfilledBills++;
                    if (dispDate && (!agg.latestDispatch || dispDate > agg.latestDispatch)) agg.latestDispatch = dispDate;
                }
                if (reqDate && (!agg.latestRequest || reqDate > agg.latestRequest)) agg.latestRequest = reqDate;
                if (isPending) agg.pending.push({ id: item.id, reqQty, requestedBy: item.requestedBy, status: item.status, timestamp: item.timestamp });

                agg.timeline.push({
                    id: item.id, status: item.status, requestedBy: item.requestedBy,
                    reqQty, recQty, reqDate, dispDate,
                    timestamp: item.timestamp, dispatchTimestamp: item.dispatchTimestamp,
                    shortage: isFulfilled ? Math.max(0, reqQty - recQty) : 0
                });

                [3, 7].forEach(d => {
                    const w = agg.win[d];
                    const curStart = now - d * DAY;
                    const prevStart = now - 2 * d * DAY;
                    if (reqDate) {
                        const t = reqDate.getTime();
                        if (t >= curStart) w.reqQty += reqQty;
                        else if (t >= prevStart) w.reqQtyPrev += reqQty;
                    }
                    if (isFulfilled) {
                        const fd = dispDate || reqDate;
                        if (fd) {
                            const t = fd.getTime();
                            if (t >= curStart) { w.fulQty += recQty; w.fulBills++; }
                            else if (t >= prevStart) w.fulQtyPrev += recQty;
                        }
                    }
                });
            });

            agg.timeline.sort((a, b) => (b.reqDate ? b.reqDate.getTime() : 0) - (a.reqDate ? a.reqDate.getTime() : 0));
            agg.fulfillmentRate = agg.requestedFulfilled > 0
                ? Math.round(agg.totalFulfilled / agg.requestedFulfilled * 100)
                : (agg.totalFulfilled > 0 ? 100 : 0);
            agg.avgPerBill = agg.fulfilledBills > 0 ? Math.round(agg.totalFulfilled / agg.fulfilledBills) : 0;
            agg.pendingQty = agg.pending.reduce((s, p) => s + p.reqQty, 0);
            agg.daysSinceDispatch = agg.latestDispatch ? Math.floor((now - agg.latestDispatch.getTime()) / DAY) : null;
            return agg;
        }

        function updateProductSearch(value) {

        function productMovementPerfParam() {

        function productMovementReportIsStale() {
            const report = state.productMovementReport;
            if (!report || !report.generatedAt) return true;
            const generatedAt = new Date(report.generatedAt).getTime();
            if (!Number.isFinite(generatedAt)) return true;
            return Date.now() - generatedAt > Number(report.maxStaleSeconds || 120) * 1000;
        }

        function computeProductMovementReportClient(periodKey = state.productMovementPeriod || '30', weekKey = state.productMovementWeek || '') {
            const now = new Date();
            const DAY_MS = 86400000;
            let curStart, curEnd, priorStart, priorEnd;
            let isCurrentWeek = false;

            if (periodKey === 'week') {
                const nowDay = now.getDay() || 7;
                const thisMonday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - nowDay + 1, 0, 0, 0, 0);
                if (!weekKey || weekKey === productMovementIsoWeekValue(now)) {
                    isCurrentWeek = true;
                    curStart = thisMonday;
                    curEnd = now;
                    const duration = curEnd.getTime() - curStart.getTime();
                    priorStart = new Date(thisMonday.getTime() - 7 * DAY_MS);
                    priorEnd = new Date(priorStart.getTime() + duration);
                } else {
                    const [yStr, wStr] = weekKey.split('-W');
                    const y = parseInt(yStr, 10);
                    const w = parseInt(wStr, 10);
                    const simple = new Date(y, 0, 1 + (w - 1) * 7);
                    const dow = simple.getDay() || 7;
                    const mon = new Date(simple.getFullYear(), simple.getMonth(), simple.getDate() - dow + 1, 0, 0, 0, 0);
                    curStart = mon;
                    curEnd = new Date(mon.getTime() + 7 * DAY_MS - 1);
                    priorStart = new Date(mon.getTime() - 7 * DAY_MS);
                    priorEnd = new Date(mon.getTime() - 1);
                }
            } else {
                const d = parseInt(periodKey, 10) || 30;
                curEnd = now;
                curStart = new Date(now.getTime() - d * DAY_MS);
                priorEnd = new Date(curStart.getTime());
                priorStart = new Date(curStart.getTime() - d * DAY_MS);
            }

            const curStartMs = curStart.getTime();
            const curEndMs = curEnd.getTime();
            const priorStartMs = priorStart.getTime();
            const priorEndMs = priorEnd.getTime();

            const itemMap = {};
            (state.items || []).forEach(item => {
                const name = (item.itemName || '').trim();
                if (!name) return;
                if (!itemMap[name]) itemMap[name] = [];
                itemMap[name].push(item);
            });

            const reqBuckets = [];
            const dispBuckets = [];
            const hours = [6, 8, 10, 12, 14, 16, 18, 20];
            hours.forEach(h => {
                const endH = h + 2;
                const label = `${String(h).padStart(2, '0')}:00 – ${String(endH).padStart(2, '0')}:00`;
                reqBuckets.push({ startHour: h, label, currentRounds: 0, currentQty: 0, priorRounds: 0, priorQty: 0 });
                dispBuckets.push({ startHour: h, label, currentRounds: 0, currentQty: 0, priorRounds: 0, priorQty: 0 });
            });

            function addToBucket(buckets, date, qty, isCurrent) {
                if (!date || isNaN(date.getTime())) return;
                const h = date.getHours();
                let b = buckets.find(x => h >= x.startHour && h < x.startHour + 2);
                if (!b && buckets.length > 0) {
                    b = h < buckets[0].startHour ? buckets[0] : buckets[buckets.length - 1];
                }
                if (b) {
                    if (isCurrent) { b.currentRounds += 1; b.currentQty += qty; }
                    else { b.priorRounds += 1; b.priorQty += qty; }
                }
            }

            let totalRequestedQty = 0, totalPriorRequestedQty = 0;
            let totalRequestedRounds = 0, totalPriorRequestedRounds = 0;
            let totalFulfilledRounds = 0, totalFulfilledQty = 0;
            let movedCount = 0, in30 = 0, in60 = 0, in90 = 0, never = 0;

            const productRows = (state.products || []).map(p => {
                const name = (p.name || '').trim();
                const items = itemMap[name] || [];
                const unit = p.unit || 'ชิ้น';
                const floor = p.floor || '';
                const location = p.location || '';
                const parLevel = parseInt(p.parLevel) || 0;
                const isNostk = floor === 'NOSTK';

                let reqRounds = 0, reqQty = 0, priorReqRounds = 0, priorReqQty = 0;
                let fulRounds = 0, fulQty = 0, priorFulRounds = 0, priorFulQty = 0;
                const fulfilledQtys = [];
                let leadTimeTotal = 0, leadTimeCount = 0;
                let latestMove = null;
                let pendingRounds = 0, partialCount = 0, stockoutCount = 0, cancelledCount = 0;
                let shortageQty = 0;

                items.forEach(item => {
                    const reqDate = item.rawDate ? new Date(item.rawDate) : parseCustomDate(item.timestamp);
                    const dispDate = item.dispatchTimestamp ? parseCustomDate(item.dispatchTimestamp) : null;
                    const qReq = parseInt(item.requestQty) || 0;
                    const qRec = getActualReceivedQty(item);
                    const status = item.status || '';

                    const moveDate = dispDate || reqDate;
                    if (moveDate && (!latestMove || moveDate > latestMove)) {
                        latestMove = moveDate;
                    }

                    if (reqDate && reqDate.getTime() >= curStartMs && reqDate.getTime() <= curEndMs) {
                        reqRounds++;
                        reqQty += qReq;
                        if (['สั่งเบิก', 'เบิก', 'กำลังจัดส่ง', 'รอตรวจสอบ'].includes(status)) pendingRounds++;
                        if (status === 'สินค้าหมด') stockoutCount++;
                        if (status === 'ยกเลิกรายการ' || status === 'ยกเลิก') cancelledCount++;
                        if (status === 'จัดส่งไม่ครบ') {
                            partialCount++;
                            shortageQty += Math.max(0, qReq - qRec);
                        }
                        addToBucket(reqBuckets, reqDate, qReq, true);
                    } else if (reqDate && reqDate.getTime() >= priorStartMs && reqDate.getTime() <= priorEndMs) {
                        priorReqRounds++;
                        priorReqQty += qReq;
                        addToBucket(reqBuckets, reqDate, qReq, false);
                    }

                    if (['จัดส่งแล้ว', 'รับสินค้าแล้ว', 'จัดส่งไม่ครบ'].includes(status)) {
                        const fDate = dispDate || reqDate;
                        if (fDate && fDate.getTime() >= curStartMs && fDate.getTime() <= curEndMs) {
                            fulRounds++;
                            fulQty += qRec;
                            fulfilledQtys.push(qRec);
                            if (dispDate && reqDate) {
                                const diffHours = (dispDate.getTime() - reqDate.getTime()) / 3600000;
                                if (diffHours >= 0 && diffHours < 168) {
                                    leadTimeTotal += diffHours;
                                    leadTimeCount++;
                                }
                            }
                            addToBucket(dispBuckets, fDate, qRec, true);
                        } else if (fDate && fDate.getTime() >= priorStartMs && fDate.getTime() <= priorEndMs) {
                            priorFulRounds++;
                            priorFulQty += qRec;
                            addToBucket(dispBuckets, fDate, qRec, false);
                        }
                    }
                });

                fulfilledQtys.sort((a, b) => a - b);
                const avgFul = fulRounds > 0 ? Math.round(fulQty / fulRounds) : null;
                const medianFul = fulfilledQtys.length > 0 ? fulfilledQtys[Math.floor(fulfilledQtys.length / 2)] : null;
                const maxFul = fulfilledQtys.length > 0 ? fulfilledQtys[fulfilledQtys.length - 1] : null;
                const medianLead = leadTimeCount > 0 ? Math.round((leadTimeTotal / leadTimeCount) * 10) / 10 : null;

                const daysInactive = latestMove ? Math.floor((now.getTime() - latestMove.getTime()) / DAY_MS) : 999;
                let movementState = 'never';
                if (!latestMove) {
                    movementState = 'never';
                    never++;
                } else if (fulRounds > 0) {
                    movementState = 'active';
                    movedCount++;
                } else if (daysInactive >= 90) {
                    movementState = 'inactive90';
                    in90++;
                } else if (daysInactive >= 60) {
                    movementState = 'inactive60';
                    in60++;
                } else if (daysInactive >= 30) {
                    movementState = 'inactive30';
                    in30++;
                } else {
                    movementState = 'recent';
                    movedCount++;
                }

                const qtyTrendPct = priorFulQty > 0
                    ? Math.round(((fulQty - priorFulQty) / priorFulQty) * 100)
                    : (fulQty > 0 ? 100 : (priorFulQty > 0 ? -100 : null));

                const fulfillmentRate = reqQty > 0 ? Math.round((fulQty / reqQty) * 100) : (fulQty > 0 ? 100 : null);

                totalRequestedQty += reqQty;
                totalPriorRequestedQty += priorReqQty;
                totalRequestedRounds += reqRounds;
                totalPriorRequestedRounds += priorReqRounds;
                totalFulfilledRounds += fulRounds;
                totalFulfilledQty += fulQty;

                return {
                    name,
                    floor,
                    location,
                    unit,
                    parLevel,
                    isNostk,
                    inProductMaster: true,
                    movementState,
                    daysInactive: latestMove ? daysInactive : null,
                    latestMovementAt: latestMove ? latestMove.toISOString() : null,
                    requestedRounds: reqRounds,
                    requestedQty: reqQty,
                    priorRequestedQty: priorReqQty,
                    fulfilledRounds: fulRounds,
                    fulfilledQty: fulQty,
                    priorFulfilledQty: priorFulQty,
                    averageFulfilledQty: avgFul,
                    medianFulfilledQty: medianFul,
                    maxFulfilledQty: maxFul,
                    qtyTrendPct,
                    fulfillmentRate,
                    medianLeadTimeHours: medianLead,
                    pendingRounds,
                    partialCount,
                    stockoutCount,
                    cancelledCount,
                    shortageQty
                };
            });

            const requestedQtyTrendPct = totalPriorRequestedQty > 0
                ? Math.round(((totalRequestedQty - totalPriorRequestedQty) / totalPriorRequestedQty) * 100)
                : (totalRequestedQty > 0 ? 100 : 0);

            const requestedRoundsTrendPct = totalPriorRequestedRounds > 0
                ? Math.round(((totalRequestedRounds - totalPriorRequestedRounds) / totalPriorRequestedRounds) * 100)
                : (totalRequestedRounds > 0 ? 100 : 0);

            return {
                status: 'success',
                generatedAt: now.toISOString(),
                period: {
                    key: periodKey,
                    selectedWeek: weekKey || null,
                    isCurrentWeek,
                    start: curStart.toISOString(),
                    end: curEnd.toISOString(),
                    priorStart: priorStart.toISOString(),
                    priorEnd: priorEnd.toISOString()
                },
                summary: {
                    masterProductCount: (state.products || []).length,
                    movedProductCount: movedCount,
                    fulfilledRounds: totalFulfilledRounds,
                    fulfilledQty: totalFulfilledQty,
                    inactive30: in30,
                    inactive60: in60,
                    inactive90: in90,
                    neverMoved: never,
                    requestedQty: totalRequestedQty,
                    priorRequestedQty: totalPriorRequestedQty,
                    requestedQtyTrendPct,
                    requestedRounds: totalRequestedRounds,
                    priorRequestedRounds: totalPriorRequestedRounds,
                    requestedRoundsTrendPct
                },
                timeOfDay: {
                    requestBuckets: reqBuckets,
                    dispatchBuckets: dispBuckets
                },
                products: productRows
            };
        }

        async function fetchProductMovementReport(forceRefresh = false) {
            const requestId = ++state.productMovementRequestId;
            if (state.products && state.products.length > 0) {
                state.productMovementReport = computeProductMovementReportClient();
            }
            state.productMovementLoading = true;
            state.productMovementError = '';
            render();
            try {
                await ensureFullHistoryLoaded();
                state.productMovementReport = computeProductMovementReportClient();
                if (state.productSelected) fetchProductMovementDetail(state.productSelected);
            } catch (error) {
                console.error('Product movement report error:', error);
            } finally {
                if (requestId !== state.productMovementRequestId) return;
                state.productMovementLoading = false;
                render();
            }
        }

        async function fetchProductMovementDetail(productName) {
            const target = String(productName || '').trim();
            if (!target) return;
            const requestId = ++state.productMovementDetailRequestId;
            state.productMovementDetailLoading = true;
            state.productMovementDetailError = '';
            render();
            try {
                await ensureFullHistoryLoaded();
                const matched = (state.items || []).filter(i => (i.itemName || '').trim() === target);
                const records = matched.map(i => {
                    const reqQty = parseInt(i.requestQty) || 0;
                    const recQty = getActualReceivedQty(i);
                    return {
                        id: i.id,
                        status: i.status,
                        requestedBy: i.requestedBy,
                        requestQty: reqQty,
                        actualQty: recQty,
                        shortageQty: Math.max(0, reqQty - recQty),
                        requestAt: i.rawDate ? (new Date(i.rawDate).toISOString()) : (i.timestamp || ''),
                        dispatchAt: i.dispatchTimestamp ? (parseCustomDate(i.dispatchTimestamp).toISOString()) : null
                    };
                });
                state.productMovementDetail = {
                    status: 'success',
                    product: target,
                    records: records,
                    totalCount: records.length
                };
            } catch (error) {
                if (requestId !== state.productMovementDetailRequestId) return;
                console.error('Product movement detail error:', error);
                state.productMovementDetailError = 'โหลดประวัติรายรอบไม่สำเร็จ';
            } finally {
                if (requestId !== state.productMovementDetailRequestId) return;
                state.productMovementDetailLoading = false;
                render();
            }
        }

        function setProductMovementPeriod(period) {
            if (!['week', '7', '30', '60', '90'].includes(period) || period === state.productMovementPeriod) return;
            state.productMovementPeriod = period;
            state.productMovementReport = null;
            state.productSelected = null;
            state.productMovementDetail = null;
            fetchProductMovementReport();
        }

        function setProductMovementWeek(weekValue) {
            const week = String(weekValue || '').trim();
            if (!/^\d{4}-W\d{2}$/.test(week)) return;
            const unchanged = state.productMovementPeriod === 'week' && state.productMovementWeek === week;
            if (unchanged) return;
            state.productMovementWeek = week;
            state.productMovementPeriod = 'week';
            state.productMovementReport = null;
            state.productSelected = null;
            state.productMovementDetail = null;
            fetchProductMovementReport();
        }

        function setProductMovementFilter(field, value) {
            const fields = {
                floor: 'productMovementFloor',
                location: 'productMovementLocation',
                state: 'productMovementState',
                sort: 'productMovementSort'
            };
            if (!fields[field]) return;
            state[fields[field]] = value;
            if (field === 'floor') state.productMovementLocation = '';
            state.productMovementLimit = 50;
            render();
        }

        function toggleProductMovementNostk() {
            state.productMovementIncludeNostk = !state.productMovementIncludeNostk;
            state.productMovementLimit = 50;
            render();
        }

        function loadMoreProductMovements() {
            state.productMovementLimit += 50;
            render();
        }

        function movementDateLabel(value, includeTime = false) {
            if (!value) return '-';
            const date = new Date(value);
            if (isNaN(date.getTime())) return '-';
            const options = { timeZone: 'Asia/Bangkok', day: '2-digit', month: '2-digit', year: 'numeric' };
            if (includeTime) Object.assign(options, { hour: '2-digit', minute: '2-digit', hour12: false });
            return date.toLocaleString('th-TH', options).replace(/\//g, '-');
        }

        function movementMetric(value, suffix = '') {
            return value === null || value === undefined ? 'ข้อมูลไม่พอ' : `${Number(value).toLocaleString()}${suffix}`;
        }

        function movementTrendLabel(value) {
            if (value === null || value === undefined) return '<span class="text-slate-400">ข้อมูลเทียบไม่พอ</span>';
            if (value === 0) return '<span class="text-slate-400">คงที่ 0%</span>';
            const up = value > 0;
            return `<span class="${up ? 'text-emerald-600' : 'text-rose-600'} font-bold inline-flex items-center gap-0.5"><span class="material-icons-round text-[13px]">${up ? 'north_east' : 'south_east'}</span>${Math.abs(value)}%</span>`;
        }

        function movementStateMeta(product) {
            if (!product.inProductMaster) return { label: 'มีเฉพาะในประวัติ', cls: 'bg-violet-50 text-violet-700 border-violet-200' };
            if (product.movementState === 'never') return { label: 'ไม่พบประวัติเคลื่อนไหว', cls: 'bg-slate-100 text-slate-600 border-slate-200' };
            if (product.movementState === 'active') return { label: 'เคลื่อนไหวในช่วงนี้', cls: 'bg-emerald-50 text-emerald-700 border-emerald-200' };
            if (product.daysInactive >= 90) return { label: `ไม่เคลื่อนไหว ${product.daysInactive} วัน`, cls: 'bg-rose-50 text-rose-700 border-rose-200' };
            if (product.daysInactive >= 60) return { label: `ไม่เคลื่อนไหว ${product.daysInactive} วัน`, cls: 'bg-orange-50 text-orange-700 border-orange-200' };
            if (product.daysInactive >= 30) return { label: `ไม่เคลื่อนไหว ${product.daysInactive} วัน`, cls: 'bg-amber-50 text-amber-700 border-amber-200' };
            return { label: `ล่าสุด ${product.daysInactive} วันก่อน`, cls: 'bg-blue-50 text-blue-700 border-blue-200' };
        }

        function productMovementAttention(product) {
            return product.pendingRounds > 0 || product.partialCount > 0 || product.stockoutCount > 0 ||
                product.cancelledCount > 0 || (product.qtyTrendPct !== null && product.qtyTrendPct <= -50);
        }

        function getFilteredProductMovements() {
            const report = state.productMovementReport;
            if (!report) return [];
            const query = state.productMovementSearch.toLowerCase().trim();
            const rows = report.products.filter(product => {
                if (!state.productMovementIncludeNostk && product.isNostk) return false;
                if (state.productMovementFloor && product.floor !== state.productMovementFloor) return false;
                if (state.productMovementLocation && product.location !== state.productMovementLocation) return false;
                if (query && !`${product.name} ${product.floor || ''} ${product.location || ''}`.toLowerCase().includes(query)) return false;
                if (state.productMovementState === 'active' && product.movementState !== 'active') return false;
                if (state.productMovementState === 'inactive30' && !(product.daysInactive >= 30)) return false;
                if (state.productMovementState === 'inactive60' && !(product.daysInactive >= 60)) return false;
                if (state.productMovementState === 'inactive90' && !(product.daysInactive >= 90)) return false;
                if (state.productMovementState === 'never' && product.movementState !== 'never') return false;
                if (state.productMovementState === 'attention' && !productMovementAttention(product)) return false;
                if (state.productMovementState === 'historyOnly' && product.inProductMaster) return false;
                return true;
            });
            return rows.sort((a, b) => {
                if (state.productMovementSort === 'quantity') return b.fulfilledQty - a.fulfilledQty || b.fulfilledRounds - a.fulfilledRounds;
                if (state.productMovementSort === 'inactive') return (b.daysInactive ?? -1) - (a.daysInactive ?? -1);
                if (state.productMovementSort === 'name') return a.name.localeCompare(b.name, 'th');
                return b.fulfilledRounds - a.fulfilledRounds || b.fulfilledQty - a.fulfilledQty;
            });
        }

        function renderDashboardProduct() {
            if (state.productMovementLoading && !state.productMovementReport) {
                return `<div role="status" class="py-20 text-center"><div class="animate-spin rounded-full h-10 w-10 border-[3px] border-brand-blue/20 border-t-brand-orange mx-auto"></div><p class="text-sm text-slate-500 mt-3">กำลังสร้างรายงานการเคลื่อนไหว...</p></div>`;
            }
            if (!state.productMovementReport) {
                const fallback = state.productSelected
                    ? renderLegacyProductDetail(computeProductAnalytics(state.productSelected))
                    : `<div class="bg-white p-3 rounded-2xl border border-slate-100 shadow-sm"><label for="product-search" class="block text-[11px] font-semibold text-slate-500 mb-1">ค้นหาในข้อมูลล่าสุด</label><input id="product-search" type="text" value="${esc(state.productSearch)}" oninput="updateProductSearch(this.value)" class="w-full h-12 px-3 bg-slate-50 border border-slate-200 rounded-xl text-base"></div>${renderLegacyProductLanding()}`;
                return `<div class="bg-rose-50 border border-rose-200 text-rose-700 rounded-2xl p-4 flex items-start gap-3"><span class="material-icons-round">error_outline</span><div class="flex-1"><p class="text-sm font-bold">${esc(state.productMovementError || 'ยังไม่มีข้อมูลรายงาน')}</p><p class="text-xs mt-1">มุมมองด้านล่างใช้เฉพาะข้อมูลล่าสุดในเครื่อง</p><button onclick="fetchProductMovementReport(true)" class="mt-2 h-11 px-4 rounded-xl bg-white border border-rose-200 font-bold text-xs">ลองโหลดรายงานอีกครั้ง</button></div></div>${fallback}`;
            }
            if (state.productSelected) return renderProductMovementDetail();
            return renderProductMovementOverview();
        }

        // Legacy recent-data landing remains as a compatibility fallback until GAS/frontend rollout is complete.
        function renderLegacyProductLanding() {
            return renderProductLanding();
        }

        // landing: ถ้ามีคำค้นหา โชว์ผลค้นหา ไม่งั้นโชว์สินค้าเคลื่อนไหวเร็ว 3 วัน
        function renderProductLanding() {
            const q = (state.productSearch || '').toLowerCase().trim();
            const itemNames = state.items.map(i => (i.itemName || '').trim());
            const productNames = state.products.map(p => ((p && typeof p === 'object') ? (p.name || p.itemName) : p || '').trim());
            const names = [...new Set([...itemNames, ...productNames].filter(Boolean))];

            if (q) {
                const matches = names.filter(n => n.toLowerCase().includes(q)).sort().slice(0, 30);
                if (matches.length === 0) return renderEmptyState('ไม่พบสินค้าที่ตรงกับคำค้นหา', 'search_off');
                return `<div class="bg-white rounded-[1.5rem] shadow-[0_4px_16px_rgb(0,0,0,0.03)] border border-slate-100 divide-y divide-slate-50 mt-4">
                    ${matches.map(n => `
                        <button onclick="selectAnalyticsProduct(${productNameJsArg(n)})"
                            class="w-full text-left p-3 flex items-center gap-3 hover:bg-slate-50 active:bg-slate-100 transition-colors">
                            <span class="material-icons-round text-brand-blue/60 text-[18px]">inventory_2</span>
                            <span class="text-sm font-semibold text-slate-700 flex-1 truncate">${esc(n)}</span>
                            <span class="material-icons-round text-slate-300 text-[18px]">chevron_right</span>
                        </button>
                    `).join('')}
                </div>`;
            }

            const fast = getFastMovingProducts(3).slice(0, 10);
            return `
                <h3 class="text-sm font-bold text-brand-blue mt-5 mb-3 flex items-center gap-2 px-1">
                    <span class="material-icons-round text-brand-orange text-[18px]">local_fire_department</span> เคลื่อนไหวเร็วสุด (3 วันล่าสุด)
                </h3>
                ${fast.length === 0 ? renderEmptyState('ยังไม่มีการจัดส่งใน 3 วันล่าสุด', 'inventory_2') : `
                    <div class="bg-white rounded-[1.5rem] shadow-[0_4px_16px_rgb(0,0,0,0.03)] border border-slate-100 divide-y divide-slate-50">
                        ${fast.map((p, idx) => `
                            <button onclick="selectAnalyticsProduct(${productNameJsArg(p.name)})"
                                class="w-full text-left p-3 flex items-center gap-3 hover:bg-slate-50 active:bg-slate-100 transition-colors">
                                <div class="w-7 h-7 rounded-full bg-brand-blue/10 text-brand-blue flex items-center justify-center font-bold text-xs flex-shrink-0">${idx + 1}</div>
                                <div class="flex-1 min-w-0">
                                    <p class="text-sm font-semibold text-slate-800 truncate">${esc(p.name)}</p>
                                    <p class="text-[10px] text-slate-400">${p.bills} บิลจัดส่ง</p>
                                </div>
                                <span class="text-xs font-bold text-brand-orange bg-brand-orange/10 px-2 py-0.5 rounded-lg">${p.qty.toLocaleString()}</span>
                            </button>
                        `).join('')}
                    </div>
                `}
            `;
        }

        function productMovementPeriodLabel(period) {
            return ({ week: 'รายสัปดาห์', '7': '7 วันล่าสุด', '30': '30 วันล่าสุด', '60': '60 วันล่าสุด', '90': '90 วันล่าสุด' })[period] || period;
        }

        function productMovementIsoWeekValue(dateValue) {
            const source = dateValue instanceof Date ? dateValue : new Date(dateValue);
            const bangkok = new Date(source.getTime() + 7 * 60 * 60 * 1000);
            const date = new Date(Date.UTC(bangkok.getUTCFullYear(), bangkok.getUTCMonth(), bangkok.getUTCDate()));
            const day = date.getUTCDay() || 7;
            date.setUTCDate(date.getUTCDate() + 4 - day);
            const year = date.getUTCFullYear();
            const yearStart = new Date(Date.UTC(year, 0, 1));
            const week = Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
            return `${year}-W${String(week).padStart(2, '0')}`;
        }

        function productMovementSelectedPeriodLabel(data = state.productMovementReport) {
            const period = data && data.period;
            if (!period || period.key !== 'week') return productMovementPeriodLabel(period ? period.key : state.productMovementPeriod);
            return period.isCurrentWeek ? 'สัปดาห์นี้' : `วีค ${period.selectedWeek || state.productMovementWeek}`;
        }

        function renderMovementLeaderboard(title, icon, products, metric, unitLabel) {
            return `<section class="bg-white rounded-2xl border border-slate-100 shadow-sm p-4">
                <h3 class="text-sm font-bold text-brand-blue flex items-center gap-2 mb-3"><span class="material-icons-round text-brand-orange text-[18px]">${icon}</span>${title}</h3>
                ${products.length === 0 ? '<p class="text-xs text-slate-400 py-6 text-center">ไม่มีข้อมูลตามตัวกรอง</p>' : `<div class="space-y-2">${products.map((product, index) => `
                    <button onclick="selectAnalyticsProduct(${productNameJsArg(product.name)})" class="w-full min-h-12 text-left flex items-center gap-3 rounded-xl hover:bg-slate-50 px-2 py-2">
                        <span class="w-7 h-7 rounded-full bg-brand-blue/10 text-brand-blue flex items-center justify-center text-xs font-bold">${index + 1}</span>
                        <span class="flex-1 min-w-0"><span class="block text-xs font-bold text-slate-700 truncate">${esc(product.name)}</span><span class="block text-[10px] text-slate-400">${product.fulfilledRounds} รอบ · ${product.fulfilledQty.toLocaleString()} ${esc(product.unit || 'หน่วย')}</span></span>
                        <span class="text-xs font-black text-brand-orange">${Number(product[metric] || 0).toLocaleString()} ${unitLabel}</span>
                    </button>`).join('')}</div>`}
            </section>`;
        }

        function renderProductMovementCard(product) {
            const status = movementStateMeta(product);
            const attention = [];
            if (product.pendingRounds) attention.push(`ค้าง ${product.pendingRounds} รอบ`);
            if (product.partialCount) attention.push(`ส่งไม่ครบ ${product.partialCount}`);
            if (product.stockoutCount) attention.push(`หมด ${product.stockoutCount}`);
            if (product.cancelledCount) attention.push(`ยกเลิก ${product.cancelledCount}`);
            const location = product.isNostk ? 'NOSTK' : [product.floor ? `ชั้น ${product.floor}` : '', product.location || ''].filter(Boolean).join(' · ');
            return `<button onclick="selectAnalyticsProduct(${productNameJsArg(product.name)})" class="w-full text-left bg-white rounded-2xl border border-slate-100 shadow-sm p-4 hover:border-brand-blue/30 hover:shadow-md transition-all">
                <div class="flex items-start gap-3">
                    <div class="flex-1 min-w-0">
                        <h4 class="text-sm font-black text-brand-blue leading-snug">${esc(product.name)}</h4>
                        <p class="text-[10px] text-slate-400 mt-1">${esc(location || 'ยังไม่ระบุตำแหน่ง')} · Par ${Number(product.parLevel || 0).toLocaleString()} ${esc(product.unit || 'หน่วย')}</p>
                    </div>
                    <span class="text-[9px] font-bold px-2 py-1 rounded-full border ${status.cls}">${esc(status.label)}</span>
                </div>
                ${product.nameVariants && product.nameVariants.length ? `<div class="mt-2 text-[10px] text-violet-700 bg-violet-50 rounded-lg px-2 py-1">ชื่อใกล้เคียงในข้อมูล: ${product.nameVariants.map(esc).join(', ')}</div>` : ''}
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-3">
                    <div class="bg-blue-50 rounded-xl p-2"><p class="text-[9px] text-blue-500">ขอเบิก</p><p class="text-sm font-black text-blue-800">${product.requestedRounds} รอบ · ${product.requestedQty.toLocaleString()}</p></div>
                    <div class="bg-emerald-50 rounded-xl p-2"><p class="text-[9px] text-emerald-600">จัดส่งจริง</p><p class="text-sm font-black text-emerald-800">${product.fulfilledRounds} รอบ · ${product.fulfilledQty.toLocaleString()}</p></div>
                    <div class="bg-slate-50 rounded-xl p-2"><p class="text-[9px] text-slate-500">เฉลี่ย / มัธยฐาน / สูงสุด</p><p class="text-xs font-black text-slate-700">${movementMetric(product.averageFulfilledQty)} / ${movementMetric(product.medianFulfilledQty)} / ${movementMetric(product.maxFulfilledQty)}</p></div>
                    <div class="bg-slate-50 rounded-xl p-2"><p class="text-[9px] text-slate-500">แนวโน้มปริมาณ</p><p class="text-xs mt-0.5">${movementTrendLabel(product.qtyTrendPct)}</p></div>
                </div>
                <div class="flex flex-wrap gap-1.5 mt-3 text-[10px]">
                    <span class="px-2 py-1 bg-slate-100 text-slate-600 rounded-lg">Fulfillment ${movementMetric(product.fulfillmentRate, '%')}</span>
                    <span class="px-2 py-1 bg-slate-100 text-slate-600 rounded-lg">Lead time ${movementMetric(product.medianLeadTimeHours, ' ชม.')}</span>
                    <span class="px-2 py-1 bg-slate-100 text-slate-600 rounded-lg">ล่าสุด ${movementDateLabel(product.latestMovementAt)}</span>
                    ${attention.map(label => `<span class="px-2 py-1 bg-amber-50 text-amber-700 rounded-lg font-bold">${label}</span>`).join('')}
                </div>
            </button>`;
        }

        function movementPeriodComparisonTitle(period) {
            if (period === 'week') return 'เทียบสัปดาห์ต่อสัปดาห์';
            return `เทียบ ${productMovementPeriodLabel(period)} กับช่วงก่อนหน้า`;
        }

        function renderMovementTimeComparison(title, subtitle, icon, buckets) {
            const allActive = (buckets || []).filter(bucket => Number(bucket.currentRounds || 0) > 0 || Number(bucket.priorRounds || 0) > 0);
            const topCurrent = allActive.slice().sort((a, b) => Number(b.currentRounds || 0) - Number(a.currentRounds || 0) || Number(b.currentQty || 0) - Number(a.currentQty || 0)).slice(0, 3);
            const topPrior = allActive.slice().sort((a, b) => Number(b.priorRounds || 0) - Number(a.priorRounds || 0) || Number(b.priorQty || 0) - Number(a.priorQty || 0)).slice(0, 3);
            const maxCurrentRounds = Math.max(0, ...allActive.map(bucket => Number(bucket.currentRounds || 0)));
            const maxPriorRounds = Math.max(0, ...allActive.map(bucket => Number(bucket.priorRounds || 0)));
            const tiedPeaks = allActive.filter(bucket =>
                (maxCurrentRounds > 0 && Number(bucket.currentRounds || 0) === maxCurrentRounds) ||
                (maxPriorRounds > 0 && Number(bucket.priorRounds || 0) === maxPriorRounds)
            );
            const selectedHours = new Set([...topCurrent, ...topPrior, ...tiedPeaks].map(bucket => bucket.startHour));
            const active = allActive.filter(bucket => selectedHours.has(bucket.startHour)).sort((a, b) => a.startHour - b.startHour);
            const maxRounds = Math.max(1, maxCurrentRounds, maxPriorRounds);
            return `<section class="bg-white rounded-2xl border border-slate-100 shadow-sm p-4">
                <div class="flex items-start gap-3">
                    <span class="material-icons-round text-brand-orange bg-orange-50 rounded-xl p-2">${icon}</span>
                    <div><h3 class="text-sm font-black text-brand-blue">${title}</h3><p class="text-[10px] text-slate-500 mt-0.5">${subtitle} · แสดง Top 3 ของแต่ละช่วง</p></div>
                </div>
                ${active.length === 0 ? '<p class="text-xs text-slate-400 py-8 text-center">ยังไม่มีข้อมูลเวลาในช่วงนี้</p>' : `<div class="mt-4 space-y-3">${active.map((bucket, index) => {
                    const currentWidth = Math.round((Number(bucket.currentRounds || 0) / maxRounds) * 100);
                    const priorWidth = Math.round((Number(bucket.priorRounds || 0) / maxRounds) * 100);
                    const isCurrentPeak = maxCurrentRounds > 0 && Number(bucket.currentRounds || 0) === maxCurrentRounds;
                    const isPriorPeak = maxPriorRounds > 0 && Number(bucket.priorRounds || 0) === maxPriorRounds;
                    return `<div class="rounded-xl ${isCurrentPeak ? 'bg-blue-50/70 border border-blue-100' : 'bg-slate-50'} p-3">
                        <div class="flex flex-wrap items-center justify-between gap-2"><span class="text-xs font-black ${isCurrentPeak ? 'text-brand-blue' : 'text-slate-700'}">${esc(bucket.label)}</span><span class="flex flex-wrap gap-1">${isCurrentPeak ? '<span class="text-[9px] font-bold text-brand-orange bg-orange-100 rounded-full px-2 py-0.5">ปัจจุบันบ่อยสุด</span>' : ''}${isPriorPeak ? '<span class="text-[9px] font-bold text-slate-600 bg-slate-200 rounded-full px-2 py-0.5">ก่อนหน้าบ่อยสุด</span>' : ''}</span></div>
                        <div class="mt-2 grid grid-cols-[5rem_1fr_auto] items-center gap-2 text-[10px]"><span class="font-bold text-brand-blue">ช่วงปัจจุบัน</span><span class="h-2 rounded-full bg-blue-100 overflow-hidden"><span class="block h-full rounded-full bg-brand-blue" style="width:${currentWidth}%"></span></span><span class="font-black text-brand-blue whitespace-nowrap">${Number(bucket.currentRounds || 0).toLocaleString()} รายการ · ${Number(bucket.currentQty || 0).toLocaleString()}</span></div>
                        <div class="mt-1.5 grid grid-cols-[5rem_1fr_auto] items-center gap-2 text-[10px]"><span class="font-bold text-slate-500">ช่วงก่อนหน้า</span><span class="h-2 rounded-full bg-slate-200 overflow-hidden"><span class="block h-full rounded-full bg-slate-400" style="width:${priorWidth}%"></span></span><span class="font-black text-slate-500 whitespace-nowrap">${Number(bucket.priorRounds || 0).toLocaleString()} รายการ · ${Number(bucket.priorQty || 0).toLocaleString()}</span></div>
                    </div>`;
                }).join('')}</div>`}
            </section>`;
        }

        function renderMovementPeriodComparison(data) {
            const summary = data.summary || {};

                        ${data.cached ? `<span class="font-bold text-amber-600">· ข้อมูลแคชไม่เกิน ${data.maxStaleSeconds || 120} วินาที</span>` : '<span class="font-bold text-emerald-600">· ข้อมูลคำนวณใหม่</span>'}
                        ${data.diagnostics && data.diagnostics.legacyDateFallbacks ? `<span class="font-bold text-violet-600">· ${data.diagnostics.legacyDateFallbacks} รอบใช้วันที่ขอเบิกแทนวันที่จัดส่งเดิม</span>` : ''}

            if (prev === 0 && cur === 0) return `<span class="text-[10px] text-slate-400">—</span>`;
            if (prev === 0) return `<span class="text-[10px] font-bold text-emerald-600 inline-flex items-center"><span class="material-icons-round text-[12px]">arrow_upward</span>ใหม่</span>`;
            const pct = Math.round((cur - prev) / prev * 100);
            if (pct === 0) return `<span class="text-[10px] text-slate-400 inline-flex items-center"><span class="material-icons-round text-[12px]">remove</span>0%</span>`;
            const up = pct > 0;
            return `<span class="text-[10px] font-bold ${up ? 'text-emerald-600' : 'text-rose-600'} inline-flex items-center"><span class="material-icons-round text-[12px]">${up ? 'arrow_upward' : 'arrow_downward'}</span>${Math.abs(pct)}%</span>`;

        async function confirmBatchDispatch() {
            const edits = state.w2BatchEdits;
            const dispatchCount = Object.values(edits).filter(v => v === 'dispatch').length;
            const partialCount  = Object.values(edits).filter(v => v === 'partial').length;
            const totalAction   = dispatchCount + partialCount;

            if (totalAction === 0) { alert('เลือกสินค้าที่จะจัดส่งก่อน'); return; }

            // ตรวจ partial ที่ยังไม่ได้กรอก qty
            const missingQty = Object.entries(edits)
                .filter(([, v]) => v === 'partial')
                .filter(([id]) => !((state.w2PartialQty || {})[id] > 0));
            if (missingQty.length > 0) {
                const names = missingQty.map(([id]) => state.items.find(i => i.id === id)?.itemName || id).join(', ');
                alert(`กรุณากรอกจำนวนที่ส่งได้จริงก่อน:\n${names}`);
                return;
            }

            const now = formatDateTime(new Date().toISOString());

            const operations = [];
            for (const [id, edit] of Object.entries(edits)) {
                const item = state.items.find(i => i.id === id);
                if (!item) continue;
                let patch = null;
                if (edit === 'dispatch') {
                    patch = { status: 'รอตรวจรับ', receiveQty: item.requestQty, receiveNote: 'ครบ', dispatchTimestamp: now };
                } else if (edit === 'partial') {
                    const actual   = (state.w2PartialQty || {})[item.id] || 0;
                    const shortage = item.requestQty - actual;
                    patch = { status: 'รอตรวจรับ', receiveQty: actual, receiveNote: `ส่ง ${actual}/${item.requestQty} ขาด ${shortage}`, dispatchTimestamp: now };
                } else if (edit === 'outstock') {
                    patch = { status: 'สินค้าหมด', dispatchTimestamp: now };
                }
                if (patch) {
                    operations.push({ op: 'updateById', id: item.id, patch });
                }
            }

            const res = await saveInventoryDelta(operations, { perfName: 'confirmBatchDispatch' });
            if (!res) { await fetchInitialData(true); return; }

            state.items = state.items.map(item => {
                const edit = edits[item.id];
                if (edit === 'dispatch') {
                    return { ...item, status: 'รอตรวจรับ', receiveQty: item.requestQty, receiveNote: 'ครบ', dispatchTimestamp: now };
                }
                if (edit === 'partial') {
                    const actual   = (state.w2PartialQty || {})[item.id] || 0;
                    const shortage = item.requestQty - actual;
                    return { ...item, status: 'รอตรวจรับ', receiveQty: actual, receiveNote: `ส่ง ${actual}/${item.requestQty} ขาด ${shortage}`, dispatchTimestamp: now };
                }
                if (edit === 'outstock') {
                    return { ...item, status: 'สินค้าหมด', dispatchTimestamp: now };
                }
                return item;
            });

            state.w2BatchEdits = {};
            state.w2PartialQty = {};
            render();
            sendAppLog('จัดส่งสินค้า Batch (AKRA)', `ครบ ${dispatchCount} · ไม่ครบ ${partialCount} รายการ`);
        }

                    ${floorF && floorF !== 'NOSTK' ? `
                    <div class="bg-white border-b border-slate-100 px-3 py-2 overflow-x-auto flex gap-2 shadow-sm">

                        <button onclick="setLocationZone('')" class="flex-shrink-0 px-3 py-1.5 rounded-full text-[11px] font-bold transition-all ${!zoneF ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white border border-slate-200 text-slate-500'}">ทั้งหมด</button>

                    ${renderLocationSheet()}

                    ${renderAddZoneModal()}
