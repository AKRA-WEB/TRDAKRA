                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function renderDayDetail(dateStr) {
            const [year, month, day] = dateStr.split('-').map(Number);
            const dateObj = new Date(year, month - 1, day);
            const TH_MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
            const TH_DAYS = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
            const displayDate = `วัน${TH_DAYS[dateObj.getDay()]}ที่ ${day} ${TH_MONTHS[month-1]} ${year + 543}`;

            const dayItems = state.items.filter(item => {
                const d = item.rawDate ? new Date(item.rawDate) : null;
                if (!d || isNaN(d.getTime())) return false;
                const k = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
                return k === dateStr;
            });

            const dispatched = dayItems.filter(i => i.status === 'จัดส่งแล้ว' || i.status === 'รับสินค้าแล้ว');
            const totalQty = dispatched.reduce((s, i) => s + (parseInt(i.receiveQty) || 0), 0);

            return `
                <div class="bg-white rounded-[1.5rem] shadow-[0_4px_16px_rgb(0,0,0,0.03)] border border-slate-100 overflow-hidden animate-fade-in">
                    <div class="bg-brand-blue/5 px-4 py-3 border-b border-slate-100 flex justify-between items-center">
                        <div>
                            <p class="text-[10px] font-semibold text-slate-400">รายละเอียดวัน</p>
                            <p class="text-sm font-bold text-brand-blue">${displayDate}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-xs font-bold text-brand-orange">${dispatched.length} บิล</p>
                            <p class="text-[10px] text-slate-400">${totalQty} ชิ้นรวม</p>
                        </div>
                    </div>
                    ${dayItems.length === 0
                        ? `<div class="p-6 text-center text-sm text-slate-400">ไม่มีการเบิกในวันนี้</div>`
                        : `<div class="divide-y divide-slate-50">
                            ${dayItems.map(item => {
                                const isDispatched = item.status === 'จัดส่งแล้ว' || item.status === 'รับสินค้าแล้ว';
                                const isStockout = item.status === 'สินค้าหมด';
                                const chipCls = isDispatched ? 'bg-emerald-100 text-emerald-700'
                                              : isStockout   ? 'bg-rose-100 text-rose-700'
                                              :                'bg-slate-100 text-slate-600';
                                return `
                                    <div class="p-3 flex items-center gap-3">
                                        <div class="flex-1 min-w-0">
                                            <p class="text-sm font-semibold text-slate-800 truncate">${item.itemName}</p>
                                            ${item.requestedBy ? `<p class="text-[10px] text-slate-400">โดย: ${item.requestedBy}</p>` : ''}
                                        </div>
                                        <div class="flex items-center gap-2 flex-shrink-0">
                                            ${item.receiveQty ? `<span class="text-xs font-bold text-brand-orange">${item.receiveQty} ชิ้น</span>` : ''}
                                            <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full ${chipCls}">${item.status}</span>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>`
                    }
                </div>
            `;
        }

        function renderDashboardProblems(allItems, startDate) {
            const stockoutMap = {};
            allItems.forEach(item => {
                if (item.status !== 'สินค้าหมด') return;
                if (!stockoutMap[item.itemName]) stockoutMap[item.itemName] = { count: 0, lastDate: null };
                stockoutMap[item.itemName].count++;
                const d = item.rawDate ? new Date(item.rawDate) : null;
                if (d && (!stockoutMap[item.itemName].lastDate || d > stockoutMap[item.itemName].lastDate)) {
                    stockoutMap[item.itemName].lastDate = d;
                }
            });

            const stockoutRanked = Object.entries(stockoutMap)
                .map(([name, s]) => ({ name, count: s.count, lastDate: s.lastDate }))
                .sort((a, b) => b.count - a.count)
                .slice(0, 10);

            const cancelledItems = allItems.filter(i => {
                const d = i.rawDate ? new Date(i.rawDate) : new Date(0);
                return i.status === 'ยกเลิก' && d >= startDate;
            }).slice(0, 10);

            const getDaysAgo = d => {
                if (!d) return '-';
                const days = Math.floor((Date.now() - d.getTime()) / 86400000);
                return days === 0 ? 'วันนี้' : `${days} วันที่แล้ว`;
            };

            return `
                <div>
                    <h3 class="text-sm font-bold text-brand-blue mb-3 flex items-center gap-2 px-1">
                        <span class="material-icons-round text-rose-500 text-[18px]">trending_down</span> สินค้าหมดบ่อย (ทั้งหมด)
                    </h3>
                    ${stockoutRanked.length === 0
                        ? renderEmptyState('ยังไม่มีบันทึกสินค้าหมด', 'check_circle')
                        : `<div class="bg-white rounded-[1.5rem] shadow-[0_4px_16px_rgb(0,0,0,0.03)] border border-slate-100 divide-y divide-slate-50">
                            ${stockoutRanked.map((item, idx) => `
                                <div class="p-3 flex items-center gap-3">
                                    <div class="w-7 h-7 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center font-bold text-xs flex-shrink-0">${idx + 1}</div>
                                    <div class="flex-1 min-w-0">
                                        <p class="text-sm font-semibold text-slate-800 truncate">${item.name}</p>
                                        <p class="text-[10px] text-slate-400">ล่าสุด: ${getDaysAgo(item.lastDate)}</p>
                                    </div>
                                    <span class="text-xs font-bold text-rose-600 bg-rose-50 px-2 py-0.5 rounded-lg">${item.count} ครั้ง</span>
                                </div>
                            `).join('')}
                        </div>`
                    }
                </div>

                <div>
                    <h3 class="text-sm font-bold text-brand-blue mb-3 flex items-center gap-2 px-1">
                        <span class="material-icons-round text-slate-400 text-[18px]">cancel</span> รายการยกเลิก (ช่วงนี้)
                    </h3>
                    ${cancelledItems.length === 0
                        ? renderEmptyState('ไม่มีรายการยกเลิก', 'check_circle')
                        : `<div class="bg-white rounded-[1.5rem] shadow-[0_4px_16px_rgb(0,0,0,0.03)] border border-slate-100 divide-y divide-slate-50">
                            ${cancelledItems.map(item => `
                                <div class="p-3">
                                    <div class="flex justify-between items-start mb-1">
                                        <p class="text-sm font-semibold text-slate-800 flex-1 pr-2 truncate">${item.itemName}</p>
                                        <span class="text-[9px] text-slate-400 flex-shrink-0">${item.timestamp ? item.timestamp.split(' / ')[0] : ''}</span>
                                    </div>
                                    ${item.requestedBy ? `<p class="text-[10px] text-slate-400">โดย: ${item.requestedBy}</p>` : ''}
                                    ${item.w2Note ? `<p class="text-[10px] text-slate-500 bg-slate-50 rounded-lg px-2 py-1 mt-1">${item.w2Note}</p>` : ''}
                                </div>
                            `).join('')}
                        </div>`
                    }
                </div>
            `;
        }

        function renderDashboardSurvey() {
            if (state.surveyLogsLoading) {
                return `
                    <div class="flex flex-col items-center justify-center py-16 gap-3">
                        <div class="animate-spin rounded-full h-10 w-10 border-[3px] border-brand-blue/20 border-t-brand-orange"></div>
                        <p class="text-sm text-slate-400 font-medium">กำลังโหลดประวัติสำรวจ...</p>
                    </div>
                `;
            }

            if (!state.surveyLogs || state.surveyLogs.length === 0) {
                return renderEmptyState(
                    state.surveyLogs === null ? 'ไม่สามารถโหลดข้อมูลได้' : 'ยังไม่มีประวัติการสำรวจ',
                    state.surveyLogs === null ? 'error_outline' : 'fact_check'
                ) + `<div class="text-center -mt-2"><button onclick="fetchSurveyLogs()" class="text-sm font-semibold text-brand-blue underline">ลองโหลดใหม่</button></div>`;
            }

            const logs = state.surveyLogs;
            const now = new Date();
            const yearBE = String(now.getFullYear() + 543);
            const monthStr = String(now.getMonth() + 1).padStart(2, '0');

            const thisMonthLogs = logs.filter(l => {
                const s = String(l.surveyDate || '');
                return s.includes('-' + monthStr + '-' + yearBE) || s.includes('/' + monthStr + '/');
            });

            const sessionKeys = new Set(thisMonthLogs.map(l => String(l.surveyDate).split(' / ')[0] + '_' + l.floor + '_' + (l.surveyedBy || '')));
            const thisMonthCount = sessionKeys.size;
            const needOrderCount = thisMonthLogs.filter(l => (parseInt(l.needToOrder) || 0) > 0).length;

            const sessions = {};
            logs.slice(0, 200).forEach(l => {
                const dateKey = String(l.surveyDate).split(' / ')[0];
                const sk = `${dateKey}__${l.floor}__${l.surveyedBy || ''}`;
                if (!sessions[sk]) sessions[sk] = { date: dateKey, floor: l.floor, surveyedBy: l.surveyedBy || '', items: [] };
                sessions[sk].items.push(l);
            });

            const sessionList = Object.values(sessions).slice(0, 30);

            return `
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-emerald-500 p-4 rounded-[1.5rem] text-white relative overflow-hidden shadow-lg shadow-emerald-500/20">
                        <span class="material-icons-round absolute -right-2 -bottom-2 text-[60px] opacity-10">fact_check</span>
                        <p class="text-[11px] font-semibold text-white/80 uppercase tracking-wider mb-1">สำรวจเดือนนี้</p>
                        <p class="text-2xl font-bold">${thisMonthCount} <span class="text-xs font-medium text-white/80">ครั้ง</span></p>
                    </div>
                    <div class="bg-amber-500 p-4 rounded-[1.5rem] text-white relative overflow-hidden shadow-lg shadow-amber-500/20">
                        <span class="material-icons-round absolute -right-2 -bottom-2 text-[60px] opacity-10">add_shopping_cart</span>
                        <p class="text-[11px] font-semibold text-white/80 uppercase tracking-wider mb-1">รายการต้องเติม</p>
                        <p class="text-2xl font-bold">${needOrderCount} <span class="text-xs font-medium text-white/80">รายการ</span></p>
                    </div>
                </div>

                <div>
                    <h3 class="text-sm font-bold text-brand-blue mb-3 flex items-center gap-2 px-1">
                        <span class="material-icons-round text-brand-orange text-[18px]">history</span> ประวัติการสำรวจ
                    </h3>
                    <div class="space-y-3">
                        ${sessionList.map(session => `
                            <div class="bg-white rounded-[1.5rem] shadow-[0_4px_16px_rgb(0,0,0,0.03)] border border-slate-100 overflow-hidden">
                                <div class="bg-brand-blue/5 px-4 py-2.5 border-b border-slate-100 flex items-center gap-2">
                                    <span class="material-icons-round text-brand-blue text-[16px]">assignment</span>
                                    <div class="flex-1">
                                        <span class="text-xs font-bold text-brand-blue">${/^\d+$/.test(session.floor) ? 'ชั้น ' + session.floor : session.floor || '-'}</span>
                                        <span class="text-[10px] text-slate-400 ml-2">${session.date}</span>
                                    </div>
                                    <span class="text-[10px] text-slate-400">โดย: ${session.surveyedBy || '-'}</span>
                                </div>
                                <div class="divide-y divide-slate-50">
                                    ${session.items.map(item => {
                                        const cur = parseInt(item.currentStock) || 0;
                                        const par = parseInt(item.parLevel) || 0;
                                        const need = parseInt(item.needToOrder) || 0;
                                        const s = getStockStatus(cur, par);
                                        return `
                                            <div class="px-4 py-2 flex items-center gap-2">
                                                <p class="text-sm text-slate-700 flex-1 truncate">${item.productName}</p>
                                                <span class="text-[10px] text-slate-400 flex-shrink-0">${cur}/${par}</span>
                                                ${need > 0 ? `<span class="text-[10px] font-bold text-rose-600 bg-rose-50 px-1.5 py-0.5 rounded flex-shrink-0">+${need}</span>` : ''}
                                                <span class="text-[10px] font-semibold ${s.color} ${s.bg} px-1.5 py-0.5 rounded-lg border ${s.border} flex-shrink-0">${s.label}</span>
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="text-center pb-2">
                    <button onclick="fetchSurveyLogs()" class="text-xs text-slate-400 underline">รีเฟรชข้อมูล</button>
                </div>
            `;
        }

                                            <span class="inline-flex items-center gap-0.5 text-brand-blue bg-brand-blue/5 border border-brand-blue/10 px-1.5 py-0.5 rounded-[4px] text-[9px] font-semibold">

                                <div><p class="text-[10px] font-semibold text-brand-blue uppercase tracking-wider mb-0.5">ยอดเบิก / ความจุ</p><p class="font-bold text-brand-blue text-lg">${item.requestQty} <span class="text-xs font-medium text-brand-blue/70">${getProductUnitClient(item.itemName)}</span> / ${item.storageCapacity || 0} <span class="text-xs font-medium text-brand-blue/70">สต๊อคจัดเก็บได้</span></p></div>
                                <div class="text-right"><p class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider mb-0.5">เวลาเบิก</p><p class="text-xs text-slate-700 font-medium">${item.timestamp.split(' / ')[1] || '-'}</p><p class="text-[10px] text-slate-400">${item.timestamp.split(' / ')[0] || '-'}</p></div>
                            </div>
                            ${item.w2Note ? `<p class="text-xs mb-4 text-amber-700 bg-amber-50 p-3 rounded-xl border border-amber-100 flex items-start gap-2"><span class="material-icons-round text-[16px] mt-px">info</span> <span>${item.w2Note}</span></p>` : ''}
                            ${item.status === 'สั่งเบิก' ? `<div class="flex justify-end"><button onclick="if(confirm('ต้องการยกเลิกรายการเบิกนี้ใช่หรือไม่?')) cancelW1Item('${item.id}')" class="text-[11px] font-semibold tracking-wide text-brand-orange hover:bg-brand-orange/10 px-3 py-1.5 rounded-full flex items-center gap-1 transition-colors">ยกเลิกการเบิก</button></div>` : ''}
                        </div>
                    `).join('') + `</div>`;
                }
            } else if (state.w1Tab === 'history') { content = renderHistoryList('w1'); }

            return `
                <div class="w-full max-w-md bg-[#f8fafc] min-h-screen flex flex-col relative">
                    <header class="bg-brand-blue text-white p-4 flex justify-between items-center sticky top-0 z-20 shadow-md">
                        <div class="flex items-center gap-2"><button onclick="setView('home')" class="p-1.5 rounded-full hover:bg-black/10 transition-colors text-white"><span class="material-icons-round">arrow_back</span></button><h1 class="text-[17px] font-bold tracking-wide flex items-center gap-1.5"><span class="material-icons-round text-[20px]">storefront</span> หน้าร้าน (TRD)</h1></div>
                        <div class="flex items-center gap-2">
                            <button onclick="fetchInitialData(true)" class="p-1.5 rounded-full hover:bg-black/10 transition-colors text-white" title="รีเฟรชข้อมูล"><span class="material-icons-round text-[20px]">refresh</span></button>
                            <div class="text-[10px] font-semibold tracking-wide bg-black/20 text-white px-3 py-1.5 rounded-full flex items-center gap-1.5 border border-white/10"><span class="material-icons-round text-[14px]">account_circle</span> ${currentUser || 'Demo'}</div>

                    </header>
                    <div class="flex bg-white shadow-sm sticky top-[60px] z-10 border-b border-slate-100 px-2">
                        <button onclick="setW1Tab('request')" class="flex-1 py-3.5 text-[13px] font-semibold border-b-[2px] transition-all ${state.w1Tab === 'request' ? 'border-brand-blue text-brand-blue' : 'border-transparent text-slate-400 hover:text-slate-600'}">เบิกสินค้า</button>
                        <button onclick="setW1Tab('pending')" class="flex-1 py-3.5 text-[13px] font-semibold border-b-[2px] relative transition-all ${state.w1Tab === 'pending' ? 'border-brand-blue text-brand-blue' : 'border-transparent text-slate-400 hover:text-slate-600'}">รอรับ</button>
                        <button onclick="setW1Tab('history')" class="flex-1 py-3.5 text-[13px] font-semibold border-b-[2px] transition-all ${state.w1Tab === 'history' ? 'border-brand-blue text-brand-blue' : 'border-transparent text-slate-400 hover:text-slate-600'}">ประวัติ</button>
                        <button onclick="setView('check_stock')" class="flex-1 py-3.5 text-[13px] font-semibold border-b-[2px] transition-all border-transparent text-emerald-500 hover:text-emerald-700 flex items-center justify-center gap-0.5">
                            <span class="material-icons-round text-[14px]">fact_check</span>สำรวจ
                        </button>
                    </div>
                    <main class="flex-1 overflow-y-auto p-5 pb-24">${content}</main>
                </div>`;
        }

        function renderW2BatchRow(item) {
            const st    = getEffectiveState(item);
            const unit  = getProductUnitClient(item.itemName);
            const enc   = encodeURIComponent(item.id);

            let boxClass, boxContent, rowBg, nameClass, subExtra = '';
            if (st === 'dispatch') {
                boxClass   = 'bg-emerald-500 text-white';
                boxContent = '✓';
                rowBg      = 'bg-emerald-50 border-emerald-100';
                nameClass  = 'font-bold text-emerald-800';
            } else if (st === 'outstock') {
                boxClass   = 'bg-rose-100 text-rose-500';
                boxContent = '✕';
                rowBg      = 'bg-rose-50 border-rose-100';
                nameClass  = 'font-semibold text-rose-400 line-through';
                if (item.dispatchTimestamp && item.dispatchTimestamp !== '-') {
                    subExtra = ` <span class="text-rose-300">· หมด ${item.dispatchTimestamp}</span>`;
                }
            } else {
                boxClass   = 'border-2 border-slate-200 bg-white';
                boxContent = '';
                rowBg      = 'bg-white border-slate-100';
                nameClass  = 'font-semibold text-brand-blue';
            }

            return `
                <div onclick="toggleW2BatchItem(decodeURIComponent('${enc}'))"
                     class="flex items-center gap-3 p-3.5 rounded-2xl border shadow-sm cursor-pointer active:scale-[0.99] transition-all ${rowBg}">
                    <div class="w-8 h-8 flex-shrink-0 flex items-center justify-center text-sm font-bold rounded-lg ${boxClass}">${boxContent}</div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm leading-snug truncate ${nameClass}">${item.itemName}</p>
                        <p class="text-[10px] text-slate-400 mt-0.5 flex items-center gap-1 flex-wrap">
                            ${item.requestedBy ? `<span class="font-medium text-slate-500">${item.requestedBy}</span><span>·</span>` : ''}
                            <span class="font-medium text-slate-400">${item.timestamp || ''}</span>
                            ${subExtra}
                        </p>
                    </div>
                    <div class="flex-shrink-0 text-right">
                        <p class="text-base font-black ${st === 'dispatch' ? 'text-emerald-600' : st === 'outstock' ? 'text-rose-400 line-through' : 'text-brand-blue'}">${item.requestQty}</p>
                        <p class="text-[9px] font-semibold text-slate-400 uppercase">${unit}</p>
                    </div>
                </div>`;
        }

        async function confirmBatchDispatch() {
            const toDispatch = Object.entries(state.w2BatchEdits).filter(([, v]) => v === 'dispatch');
            if (toDispatch.length === 0) { alert('เลือกสินค้าที่จะจัดส่งก่อน'); return; }

            const now = formatDateTime(new Date().toISOString());

            state.items = state.items.map(item => {
                const edit = state.w2BatchEdits[item.id];
                if (edit === 'dispatch') {
                    return { ...item, status: 'จัดส่งแล้ว', receiveQty: item.requestQty, receiveNote: 'ครบ', dispatchTimestamp: now };
                }
                if (edit === 'outstock') {
                    return { ...item, status: 'สินค้าหมด', dispatchTimestamp: now };
                }
                return item;
            });

            state.w2BatchEdits = {};
            render();
            await syncDataToSheet();
            sendAppLog('จัดส่งสินค้า Batch (AKRA)', `จัดส่ง ${toDispatch.length} รายการ`);
        }

        function renderW2() {
            const ACTIVE_STATUSES = ['สั่งเบิก', 'กำลังจัดสินค้า', 'สินค้าหมด'];
            const hasTasks = state.items.some(i => ACTIVE_STATUSES.includes(i.status));
            let content = '';
            if (state.w2Tab === 'tasks') {
                const activeTasks = state.items.filter(i => ACTIVE_STATUSES.includes(i.status));
                if (activeTasks.length === 0) {
                    content = renderEmptyState('ไม่มีงานจัดสินค้า', 'inventory_2');
                } else {
                    const dispatchCount = activeTasks.filter(i => getEffectiveState(i) === 'dispatch').length;
                    const outstockCount = activeTasks.filter(i => getEffectiveState(i) === 'outstock').length;
                    const pendingCount  = activeTasks.filter(i => getEffectiveState(i) === 'pending').length;
                    content = `
                        <div class="animate-fade-in">
                            <div class="grid grid-cols-3 border border-slate-100 rounded-2xl overflow-hidden mb-4 bg-white shadow-sm">
                                <div class="p-3 text-center ${dispatchCount > 0 ? 'bg-emerald-50' : ''}">
                                    <p class="text-xl font-black ${dispatchCount > 0 ? 'text-emerald-600' : 'text-slate-300'}">${dispatchCount}</p>
                                    <p class="text-[9px] font-bold uppercase tracking-wider text-slate-400 mt-0.5">เลือกจัด</p>
                                </div>
                                <div class="p-3 text-center border-x border-slate-100 ${outstockCount > 0 ? 'bg-rose-50' : ''}">
                                    <p class="text-xl font-black ${outstockCount > 0 ? 'text-rose-500' : 'text-slate-300'}">${outstockCount}</p>
                                    <p class="text-[9px] font-bold uppercase tracking-wider text-slate-400 mt-0.5">สินค้าหมด</p>
                                </div>
                                <div class="p-3 text-center">
                                    <p class="text-xl font-black ${pendingCount > 0 ? 'text-brand-blue' : 'text-slate-300'}">${pendingCount}</p>
                                    <p class="text-[9px] font-bold uppercase tracking-wider text-slate-400 mt-0.5">รอจัด</p>
                                </div>
                            </div>
                            <div class="space-y-2">${activeTasks.map(renderW2BatchRow).join('')}</div>
                            <div class="h-24"></div>
                        </div>
                        <div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white border-t border-slate-100 p-4 shadow-2xl z-10">
                            <p class="text-[10px] text-center text-slate-400 mb-2">✓ จัดส่ง ${dispatchCount} · ✕ หมด ${outstockCount} · รอ ${pendingCount}</p>
                            <button onclick="confirmBatchDispatch()"
                                    class="w-full py-4 rounded-2xl font-bold text-sm transition-all active:scale-[0.98]
                                           ${dispatchCount > 0 ? 'bg-brand-blue text-white shadow-lg shadow-brand-blue/20' : 'bg-slate-100 text-slate-400 cursor-not-allowed'}">
                                🚚 ยืนยันจัดส่ง ${dispatchCount} รายการ
                            </button>
                        </div>`;
                }
            } else if (state.w2Tab === 'history') { content = renderHistoryList('w2'); }

            return `
                <div class="w-full max-w-md bg-[#f8fafc] min-h-screen flex flex-col relative">
                    <header class="bg-brand-blue text-white p-4 flex justify-between items-center sticky top-0 z-20 shadow-md">
                        <div class="flex items-center gap-2"><button onclick="setView('home')" class="p-1.5 rounded-full hover:bg-black/10 transition-colors text-white"><span class="material-icons-round">arrow_back</span></button><h1 class="text-[17px] font-bold tracking-wide flex items-center gap-1.5"><span class="material-icons-round text-[20px]">warehouse</span> คลังสินค้า (AKRA)</h1></div>
                        <div class="flex items-center gap-2">
                            <button onclick="fetchInitialData(true)" class="p-1.5 rounded-full hover:bg-black/10 transition-colors text-white" title="รีเฟรชข้อมูล"><span class="material-icons-round text-[20px]">refresh</span></button>
                            <div class="text-[10px] font-semibold tracking-wide bg-black/20 text-white px-3 py-1.5 rounded-full flex items-center gap-1.5 border border-white/10"><span class="material-icons-round text-[14px]">account_circle</span> ${currentUser || 'Demo'}</div>
                        </div>
                    </header>
                    <div class="flex bg-white shadow-sm sticky top-[60px] z-10 border-b border-slate-100 px-2">
                        <button onclick="setW2Tab('tasks')" class="flex-1 py-3.5 text-[13px] font-semibold border-b-[2px] relative transition-all ${state.w2Tab === 'tasks' ? 'border-brand-blue text-brand-blue' : 'border-transparent text-slate-400 hover:text-slate-600'}">งานจัด ${hasTasks ? `<span class="absolute top-3.5 right-4 w-1.5 h-1.5 rounded-full bg-brand-orange ring-2 ring-white"></span>` : ''}</button>
                        <button onclick="setW2Tab('history')" class="flex-1 py-3.5 text-[13px] font-semibold border-b-[2px] transition-all ${state.w2Tab === 'history' ? 'border-brand-blue text-brand-blue' : 'border-transparent text-slate-400 hover:text-slate-600'}">ประวัติ</button>
                    </div>
                    <main class="flex-1 overflow-y-auto p-5 pb-24">${content}</main>
                </div>`;
        }

        // ── Render: Location Manager ──
        function renderLocationSheet() {
            if (!state.locationSheet) return '';
            const { name } = state.locationSheet;
            const floor = state.locationSheetFloor;
            const zone  = state.locationSheetZoneInput || '';
            const par   = state.locationSheetParLevel  || '';
            const FLOORS = ['1','2','3','4','5'];

            let existingZones = [];
            if (floor && floor !== 'NOSTK') {
                const zSet = new Set();
                state.products.filter(p => p.floor === floor && p.location)
                    .forEach(p => { const z = extractZone(p.location); if (z) zSet.add(z); });
                existingZones = [...zSet].sort();
            }

            const canSave = !!(floor && (floor === 'NOSTK' || zone.trim()));
            const saveLbl = floor
                ? (floor === 'NOSTK' ? ' (NOSTK)' : (zone ? ` ชั้น ${floor} › ${zone}` : ''))
                : '';

            return `
                <div onclick="closeLocationSheet()" class="fixed inset-0 bg-black/40 z-40"></div>
                <div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white rounded-t-[2rem] z-50 shadow-2xl" style="max-height:90vh;overflow-y:auto">
                    <div class="flex items-center justify-between p-4 border-b border-slate-100">
                        <div>
                            <p class="text-[11px] font-semibold text-slate-400">กำหนดโลเคชั่น</p>
                            <p class="text-sm font-bold text-brand-blue truncate" style="max-width:260px">${name}</p>
                        </div>
                        <button onclick="closeLocationSheet()" class="p-2 rounded-full hover:bg-slate-100 transition-colors">
                            <span class="material-icons-round text-slate-400">close</span>
                        </button>
                    </div>

                    <div class="p-4 space-y-5 pb-8">
                        <div>
                            <p class="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-2">เลือกชั้น</p>
                            <div class="grid grid-cols-3 gap-2">
                                ${FLOORS.map(f => `
                                    <button onclick="setSheetFloor('${f}')"
                                            class="py-3 rounded-2xl text-sm font-bold transition-all active:scale-95
                                                   ${floor === f ? 'bg-brand-blue text-white shadow-md shadow-brand-blue/30' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                                        ชั้น ${f}
                                    </button>
                                `).join('')}
                                <button onclick="setSheetFloor('NOSTK')"
                                        class="py-3 rounded-2xl text-sm font-bold transition-all active:scale-95
                                               ${floor === 'NOSTK' ? 'bg-slate-600 text-white shadow-md' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                                    ❌ NOSTK
                                </button>
                            </div>
                        </div>

                        ${floor && floor !== 'NOSTK' ? `
                        <div>
                            <p class="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-2">เลือกโซน</p>
                            ${existingZones.length > 0 ? `
                            <div class="flex flex-wrap gap-2 mb-3">
                                ${existingZones.map(z => `
                                    <button onclick="state.locationSheetZoneInput='${z}'; render()"
                                            class="px-3 py-1.5 rounded-full text-xs font-bold transition-all active:scale-95
                                                   ${zone === z ? 'bg-indigo-600 text-white' : 'bg-indigo-50 text-indigo-700 border border-indigo-200 hover:bg-indigo-100'}">
                                        ${z}
                                    </button>
                                `).join('')}
                            </div>` : ''}
                            <input type="text" value="${zone}"
                                placeholder="พิมพ์ชื่อโซน เช่น 1B, 2A-03..."
                                oninput="state.locationSheetZoneInput=this.value.toUpperCase(); render()"
                                class="w-full p-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-bold uppercase focus:border-indigo-500 focus:bg-white transition-all"
                                autocomplete="off">
                        </div>` : ''}

                        <div>
                            <p class="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-2">Par Level <span class="font-normal normal-case text-slate-400">(ไม่บังคับ)</span></p>
                            <input type="number" min="0" value="${par}"
                                placeholder="ยอดสต๊อกเต็ม"
                                oninput="state.locationSheetParLevel=this.value"
                                class="w-full p-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-bold text-center focus:border-brand-orange focus:bg-white transition-all">
                        </div>

                        <button onclick="${canSave ? 'confirmLocationSheet()' : ''}"
                                class="w-full py-4 rounded-2xl font-bold text-base transition-all active:scale-[0.98]
                                       ${canSave ? 'bg-brand-blue text-white shadow-lg shadow-brand-blue/20' : 'bg-slate-100 text-slate-400 cursor-not-allowed'}">
                            ✓ บันทึก${saveLbl}
                        </button>
                    </div>
                </div>
            `;
        }

        function renderLocationRow(prod) {
            const isMissing = !prod.floor;
            const enc = encodeURIComponent(prod.name);
            const borderClass = isMissing ? 'border-rose-200' : 'border-slate-100';

            let locationChip = '';
            if (prod.floor === 'NOSTK') {
                locationChip = `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-500 border border-slate-200">❌ NOSTK</span>`;
            } else if (prod.floor && prod.location) {
                locationChip = `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200">📍 ชั้น ${prod.floor} › ${prod.location}</span>`;
            } else if (prod.floor) {
                locationChip = `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-blue-50 text-blue-600 border border-blue-200">📍 ชั้น ${prod.floor}</span>`;
            } else {
                locationChip = `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-rose-50 text-rose-500 border border-rose-200">🔴 ยังไม่มีโลเคชั่น</span>`;
            }

            const parBadge = prod.parLevel
                ? `<span class="text-[10px] font-medium text-slate-400 ml-1">Par: <span class="font-bold text-slate-600">${prod.parLevel}</span></span>`
                : '';

            const btnLabel = isMissing ? '📍 กำหนด' : '✏️ แก้ไข';
            const btnClass = isMissing
                ? 'bg-indigo-600 text-white'
                : 'bg-slate-100 text-slate-600 hover:bg-slate-200';

            return `
                <div class="bg-white p-3.5 rounded-2xl ${borderClass} border shadow-sm mb-2.5 flex items-center justify-between gap-3">
                    <div class="flex-1 min-w-0">
                        <p class="font-bold text-brand-blue text-sm leading-snug truncate mb-1">${prod.name}</p>
                        <div class="flex items-center flex-wrap gap-1">
                            ${locationChip}
                            ${parBadge}
                        </div>
                    </div>
                    <button onclick="openLocationSheet(decodeURIComponent('${enc}'))"
                            class="flex-shrink-0 px-3 py-2 rounded-xl text-xs font-bold transition-all active:scale-95 ${btnClass}">
                        ${btnLabel}
                    </button>
                </div>`;
        }

        function updateLocationSearch(value) {
            state.locationSearch = value;
            const search = value.toLowerCase().trim();
            // When searching: scan non-NOSTK products. When empty: show missing only (up to 20).
            const filtered = search
                ? state.products.filter(p => p.floor !== 'NOSTK' && p.name.toLowerCase().includes(search))
                : state.products.filter(p => !p.floor);
            const listEl = document.getElementById('location-list');
            if (!listEl) return;
            if (filtered.length === 0) {
                listEl.innerHTML = `<div class="flex flex-col items-center justify-center py-16 text-slate-400">

        // ==========================================
        // 4c. CHECK STOCK ACTION HANDLERS
        // ==========================================
        function getCleanedCheckedLocations() {
            const locs = state.checkStockCheckedLocations || {};
            const cleaned = {};
            let changed = false;
            
            const now = new Date();
            const cutoff = new Date();
            cutoff.setHours(18, 0, 0, 0); // 18:00 วันนี้
            if (now.getTime() < cutoff.getTime()) {
                cutoff.setDate(cutoff.getDate() - 1); // 18:00 เมื่อวาน
            }
            const cutoffTime = cutoff.getTime();

            for (const loc in locs) {
                const checkTime = new Date(locs[loc]).getTime();
                if (checkTime >= cutoffTime) {
                    cleaned[loc] = locs[loc];
                } else {
                    changed = true;
                }
            }
            if (changed) {
                state.checkStockCheckedLocations = cleaned;
                localStorage.setItem('TRDAKRA_CHECKED_LOCATIONS', JSON.stringify(cleaned));
            }
            return cleaned;
        }

        function selectCheckStockLocation(floor, location) {
            state.checkStockLocation = { floor, location };
            state.checkStockEdits = {};
            state.checkStockSearch = '';
            render();
        }

        function toggleCheckStockItem(productName) {
            if (!state.checkStockEdits[productName]) {
                state.checkStockEdits[productName] = { checked: true, currentStock: '', requestQty: '' };
            } else {
                state.checkStockEdits[productName].checked = !state.checkStockEdits[productName].checked;
            }
            render();
        }

        function updateCheckStockStock(productName, val) {
            if (!state.checkStockEdits[productName]) {
                state.checkStockEdits[productName] = { checked: true, currentStock: '', requestQty: '' };
            }
            state.checkStockEdits[productName].currentStock = val;
            
            // Dynamic UI update for the specific row's calculation to avoid full re-render
            const prod = state.products.find(p => p.name === productName);
            const calcEl = document.getElementById(`calc-need-${encodeURIComponent(productName)}`);
            if (calcEl && prod) {
                const cur = parseInt(val);
                const par = prod.parLevel || 0;
                if (!isNaN(cur) && par > 0) {
                    const need = Math.max(0, par - cur);
                    if (need > 0) {
                        calcEl.innerHTML = `<span>ต้องการเติมสต๊อก:</span><span class="text-sm font-bold text-brand-orange">${need} ${prod.unit || 'หน่วย'}</span>`;
                    } else {
                        calcEl.innerHTML = `<span>ต้องการเติมสต๊อก:</span><span class="text-sm font-bold text-emerald-600">0 (พอแล้ว)</span>`;
                    }
                } else if (par === 0) {
                    calcEl.innerHTML = `<span class="text-amber-600 font-semibold">ไม่มี Par Level ในระบบ</span>`;
                } else {
                    calcEl.innerHTML = `<span>ต้องการเติมสต๊อก:</span><span class="text-xs text-slate-400">รอป้อนจำนวน</span>`;
                }
            }
        }

        function updateCheckStockRequestQty(productName, val) {
            if (!state.checkStockEdits[productName]) {
                state.checkStockEdits[productName] = { checked: true, currentStock: '', requestQty: '' };
            }
            state.checkStockEdits[productName].requestQty = val;
        }

        function openParEdit(productName) {
            const prod = state.products.find(p => p.name === productName);
            state.checkStockEditingPar = productName;
            state.checkStockParInput = prod ? String(prod.parLevel || '') : '';
            render();
        }

        async function saveParEdit(productName) {
            const val = parseInt(state.checkStockParInput) || 0;
            const prod = state.products.find(p => p.name === productName);
            if (!prod) { state.checkStockEditingPar = null; render(); return; }
            try {
                await pushProductDetails(productName, prod.floor || '', prod.location || '', val);
                const idx = state.products.findIndex(p => p.name === productName);
                if (idx !== -1) state.products[idx].parLevel = val;
            } catch(e) { alert('บันทึกไม่สำเร็จ'); }
            state.checkStockEditingPar = null;
            state.checkStockParInput = '';
            render();
        }

        function updateCheckStockSearch(value) {
            state.checkStockSearch = value;
            const search = value.toLowerCase().trim();
            const locObj = state.checkStockLocation;
            if (!locObj) return;
            const locProducts = state.products.filter(p => p.location === locObj.location && p.floor === locObj.floor && p.floor !== 'NOSTK');
            
            const filtered = search
                ? locProducts.filter(p => p.name.toLowerCase().includes(search))
                : locProducts;
                
            const listEl = document.getElementById('check-stock-list');
            if (!listEl) return;
            
            if (filtered.length === 0) {
                listEl.innerHTML = `<p class="text-center text-slate-400 py-12 text-sm">ไม่พบสินค้าตามที่ค้นหา</p>`;
            } else {
                listEl.innerHTML = filtered.map(renderCheckStockRow).join('');
            }
        }

        async function handleCheckStockSubmit() {
            if (state.checkStockSubmitting) return; // Prevent double submission
            
            const locObj = state.checkStockLocation;
            if (!locObj) return;
            const loc = locObj.location;
            const floor = locObj.floor;

            const locProducts = state.products.filter(p => p.location === loc && p.floor === floor && p.floor !== 'NOSTK');
            const checkedProducts = locProducts.filter(p => state.checkStockEdits[p.name]?.checked);

            // Validation: Checked products must have a quantity input
            let isValid = true;
            checkedProducts.forEach(p => {
                const edit = state.checkStockEdits[p.name];
                const cur = edit.currentStock;
                const par = p.parLevel || 0;
                
                if (cur === '') {
                    isValid = false;
                }
                if (par === 0 && (edit.requestQty === '' || parseInt(edit.requestQty) <= 0)) {
                    isValid = false;
                }
            });

            if (!isValid) {
                alert('กรุณากรอกจำนวนเดิมที่เหลืออยู่ (หรือระบุจำนวนสั่งเบิกในตัวที่ไม่มี Par Level) ให้ครบสำหรับรายการที่ติ๊กเลือก');
                return;
            }

            state.checkStockSubmitting = true;
            showLoading('กำลังส่งรายงานและสั่งเบิก...');

            const now = new Date();
            const timestamp = formatDateTime(now.toISOString());
            const newOrders = [];
            const logItems = [];

            locProducts.forEach(p => {
                const edit = state.checkStockEdits[p.name];
                if (edit && edit.checked) {
                    const cur = parseInt(edit.currentStock) || 0;
                    const par = p.parLevel || 0;
                    let need = 0;
                    if (par > 0) {
                        need = Math.max(0, par - cur);
                    } else {
                        need = parseInt(edit.requestQty) || 0;
                    }

                    if (need > 0) {
                        newOrders.push({
                            id: `REQ-${Math.floor(Math.random() * 9000) + 1000}`,
                            rawDate: now,
                            timestamp: timestamp,
                            itemName: p.name,
                            requestQty: need,
                            storageCapacity: par,
                            status: 'สั่งเบิก',
                            oldExpiry: 'ไม่ได้ระบุ',
                            newExpiry: '', receiveQty: null, receiveNote: '', w2Note: '',
                            requestedBy: currentUser || 'ไม่ทราบ'
                        });
                    }

                    logItems.push({
                        name: p.name,
                        currentStock: cur,
                        parLevel: par,
                        needToOrder: need,
                        status: need > 0 ? (cur === 0 || cur / par < 0.3 ? 'critical' : 'low') : 'ok'
                    });
                } else {
                    // Unchecked products are considered "มีของเยอะอยู่" (OK status, 0 to order)
                    logItems.push({
                        name: p.name,
                        currentStock: p.parLevel || 0, // default to par
                        parLevel: p.parLevel || 0,
                        needToOrder: 0,
                        status: 'ok'
                    });
                }
            });

            try {
                // 1. Submit orders if any
                if (newOrders.length > 0) {
                    state.items = [...newOrders, ...state.items];
                    await syncDataToSheet(true); // skipHideLoading = true
                }

                // 2. Submit survey log
                showLoading('กำลังบันทึกประวัติการสำรวจ...');
                await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        action: 'saveSurveyLog',
                        surveyedBy: currentUser || 'ไม่ทราบ',
                        floor: `${floor} - ${loc}`, // Save as e.g. "2 - 3B"
                        items: logItems
                    })
                });

                // Invalidate cache
                localStorage.removeItem('TRDAKRA_DATA');

                // Mark location as checked
                const compoundKey = `${floor}|${loc}`;
                if (!state.checkStockCheckedLocations) state.checkStockCheckedLocations = {};
                state.checkStockCheckedLocations[compoundKey] = new Date().toISOString();
                localStorage.setItem('TRDAKRA_CHECKED_LOCATIONS', JSON.stringify(state.checkStockCheckedLocations));

                // Go back to location selector page immediately so it's ready behind loader
                state.checkStockLocation = null;
                state.checkStockEdits = {};
                render();
                
                // Refresh data with loading screen still visible
                showLoading('กำลังรีเฟรชข้อมูลแผนผัง...');
                await fetchInitialData(true, true); // skipHideLoading = true

                // Show alert while loading is still covering the screen
                alert(`✅ บันทึกสต๊อกสำเร็จ!\nส่งสั่งเบิก ${newOrders.length} รายการ จากโลเคชั่น ชั้น ${floor} - ${loc}`);
                sendAppLog('ตรวจสต๊อกรายโลเคชั่น', `โลเคชั่น ชั้น ${floor} - ${loc}: ส่งเบิก ${newOrders.length} รายการ`);
            } catch (err) {
                console.error(err);
                alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล กรุณาลองใหม่อีกครั้ง');
            } finally {
                hideLoading();
                state.checkStockSubmitting = false;
                render();
            }
        }

                // ─── 1. หน้าเลือกโลเคชั่น (เลือกกล่องตามแมพปิ้ง) ───
                const floorGroups = {};
                state.products.forEach(p => {
                    if (p.floor && p.floor !== 'NOSTK' && p.location) {
                        const f = p.floor;
                        if (!floorGroups[f]) floorGroups[f] = new Set();
                        floorGroups[f].add(p.location.trim());
                    }
                });

                const missingCount = state.products.filter(p => !p.floor).length;
                const sortedFloors = Object.keys(floorGroups).sort();
                let floorsHtml = '';

                if (sortedFloors.length === 0) {
                    floorsHtml = `
                        <div class="text-center py-12 px-4 bg-white rounded-2xl border border-slate-100 shadow-sm">
                            <span class="material-icons-round text-slate-300 text-4xl mb-2">place</span>
                            <p class="text-sm font-semibold text-slate-500">ไม่พบข้อมูลโลเคชั่นสินค้าในระบบ</p>
                            <p class="text-[11px] text-slate-400 mt-1">กรุณากำหนดโลเคชั่นสินค้าที่เมนู "จัดโลเคชั่นสินค้า" ก่อน</p>
                            <button onclick="setView('location')" class="mt-4 px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold shadow-sm">
                                📍 ไปจัดโลเคชั่นสินค้า
                            </button>
                        </div>`;
                } else {
                    floorsHtml = sortedFloors.map(f => {
                        const locs = [...floorGroups[f]].sort((a,b) => a.localeCompare(b, undefined, {numeric: true, sensitivity: 'base'}));
                        const cleanedChecked = getCleanedCheckedLocations();
                        return `
                            <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm space-y-3">
                                <h3 class="text-xs font-bold text-brand-blue flex items-center gap-1.5 border-b border-slate-50 pb-2">
                                    <span class="material-icons-round text-[16px]">layers</span> ชั้น ${f}
                                </h3>
                                <div class="grid grid-cols-3 gap-2">
                                    ${locs.map(loc => {
                                        const count = state.products.filter(p => p.floor === f && p.location === loc && p.floor !== 'NOSTK').length;
                                        const isCheckedToday = !!cleanedChecked[`${f}|${loc}`];
                                        
                                        const btnBg = isCheckedToday 
                                            ? 'bg-emerald-50 border-emerald-200 text-emerald-700 hover:bg-emerald-100/50 hover:border-emerald-300' 
                                            : 'bg-slate-50 border-slate-200 hover:border-brand-blue hover:bg-brand-blue/5 text-slate-700 hover:text-brand-blue';
                                            
                                        return `
                                            <button onclick="selectCheckStockLocation('${f}', '${loc}')"
                                                class="py-3 px-2 border rounded-xl text-center active:scale-95 transition-all flex flex-col justify-center items-center gap-1 ${btnBg}">
                                                <span class="text-xs font-bold tracking-wide flex items-center gap-1">
                                                    ${isCheckedToday ? '<span class="material-icons-round text-[12px] text-emerald-600">check_circle</span>' : ''}
                                                    ${loc}
                                                </span>
                                                <span class="text-[9px] ${isCheckedToday ? 'text-emerald-600/70' : 'text-slate-400'} font-medium">${count} รายการ</span>
                                            </button>`;
                                    }).join('')}
                                </div>
                            </div>`;
                    }).join('<div class="my-4"></div>');
                }

                return `
                    <div class="w-full max-w-md bg-[#f8fafc] min-h-screen flex flex-col">
                        <header class="bg-brand-blue text-white p-4 flex justify-between items-center sticky top-0 z-20 shadow-md">
                            <div class="flex items-center gap-2">
                                <button onclick="setView('home')" class="p-1.5 rounded-full hover:bg-black/10 transition-colors text-white">
                                    <span class="material-icons-round">arrow_back</span>
                                </button>
                                <h1 class="text-[17px] font-bold tracking-wide flex items-center gap-1.5">
                                    <span class="material-icons-round text-[20px]">fact_check</span> ใบตรวจเช็คสต๊อก (รายโลเคชั่น)
                                </h1>
                            </div>
                            <button onclick="fetchInitialData(true)" class="p-1.5 rounded-full hover:bg-black/10 transition-colors text-white">
                                <span class="material-icons-round text-[20px]">refresh</span>
                            </button>
                        </header>
                        <main class="flex-1 overflow-y-auto p-5 pb-24 space-y-4 animate-fade-in">
                            <div class="bg-indigo-50 border border-indigo-100 rounded-2xl p-4 flex items-start gap-3 shadow-sm">
                                <span class="material-icons-round text-indigo-600 mt-0.5">info</span>
                                <div>
                                    <h4 class="text-xs font-bold text-indigo-800">ขั้นตอนการเช็คของหน้างาน</h4>
                                    <p class="text-[10px] text-indigo-600 mt-1 leading-relaxed">
                                        1. จิ้มเลือกโลเคชั่นที่จะนับสต๊อก<br>
                                        2. ติ๊กเฉพาะสินค้าที่มีสต๊อกเหลือน้อยควรเติม (ตัวที่ไม่ติ๊กจะถูกข้าม/บันทึกว่าสต๊อกพอแล้วอัตโนมัติ)<br>
                                        3. กรอกจำนวนจริงที่เหลืออยู่บนชั้นวาง จากนั้นกดยืนยันเพื่อส่งใบรายงาน
                                    </p>
                                </div>
                            </div>
                            
                            <button onclick="importParLevelsFromHistory()" class="w-full py-2.5 bg-brand-blue/5 hover:bg-brand-blue/10 border border-brand-blue/20 text-brand-blue text-[11px] font-semibold rounded-xl transition-all flex items-center justify-center gap-1.5">
                                <span class="material-icons-round text-[14px]">download</span> นำเข้า Par Level จากประวัติการเบิก
                            </button>
                            
                            <div class="flex justify-between items-center px-1 mt-6">
                                <h2 class="text-sm font-bold text-slate-800">📍 แผนผังโลเคชั่น (จิ้มเพื่อเช็ค)</h2>
                                ${missingCount > 0 ? `
                                    <span onclick="setView('location')" class="text-[9px] font-bold text-rose-500 bg-rose-50 border border-rose-100 rounded-full px-2 py-0.5 cursor-pointer hover:bg-rose-100 transition-colors">
                                        ⚠️ ไม่มีโลเคชั่น ${missingCount} รายการ
                                    </span>` : ''
                                }
                            </div>
                            
                            <div class="space-y-4">${floorsHtml}</div>
                        </main>
                    </div>`;
            } else {
                // ─── 2. หน้าเช็คสินค้าในโลเคชั่นที่เลือก ───
                const locObj = state.checkStockLocation;
                const loc = locObj.location;
                const floor = locObj.floor;
                const locProducts = state.products.filter(p => p.location === loc && p.floor === floor && p.floor !== 'NOSTK');
                const search = (state.checkStockSearch || '').toLowerCase().trim();
                
                const filteredProducts = search
                    ? locProducts.filter(p => p.name.toLowerCase().includes(search))
                    : locProducts;

                const editCount = Object.keys(state.checkStockEdits).filter(k => state.checkStockEdits[k].checked).length;

                return `
                    <div class="w-full max-w-md bg-[#f8fafc] min-h-screen flex flex-col">
                        <header class="bg-brand-blue text-white p-4 flex items-center gap-2 sticky top-0 z-20 shadow-md">
                            <button onclick="state.checkStockLocation=null; render()" class="p-1.5 rounded-full hover:bg-black/10 transition-colors text-white">
                                <span class="material-icons-round">arrow_back</span>
                            </button>
                            <div class="flex-1 min-w-0">
                                <h1 class="text-[16px] font-bold">📍 ชั้น ${floor} - โลเคชั่น: ${loc}</h1>
                                <p class="text-[11px] text-white/70">เช็คสต๊อกทั้งหมด ${locProducts.length} รายการ</p>
                            </div>
                        </header>
                        
                        <div class="bg-white sticky top-[68px] z-10 border-b border-slate-100 shadow-sm px-4 py-3">
                            <input type="text" value="${state.checkStockSearch}" placeholder="🔍 ค้นหาสินค้าในโลเคชั่น ${loc}..."
                                oninput="updateCheckStockSearch(this.value)"
                                class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:border-brand-blue transition-all">
                        </div>

                        <main class="flex-1 overflow-y-auto p-4 pb-36 animate-fade-in" id="check-stock-list">
                            ${filteredProducts.length === 0
                                ? `<p class="text-center text-slate-400 py-12 text-sm">${search ? 'ไม่พบสินค้าตามที่ค้นหา' : 'ไม่มีสินค้าในโลเคชั่นนี้'}</p>`
                                : filteredProducts.map(renderCheckStockRow).join('')
                            }
                        </main>

                        <div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white border-t border-slate-100 p-4 shadow-2xl flex flex-col gap-2">
                            <div class="flex justify-between items-center text-xs font-semibold px-1 mb-1">
                                <span class="text-slate-500">เลือกเบิกเติมสต๊อก:</span>
                                <span class="text-brand-blue font-bold text-sm bg-indigo-50 border border-indigo-100 px-2.5 py-0.5 rounded-full">
                                    ${editCount} / ${locProducts.length} รายการ
                                </span>
                            </div>
                            <div class="flex gap-3">
                                <button onclick="state.checkStockLocation=null; render()"
                                    class="flex-1 bg-slate-100 border border-slate-200 text-slate-600 py-3.5 rounded-2xl font-bold text-sm transition-all active:scale-[0.98]">
                                    ← กลับ
                                </button>
                                <button onclick="handleCheckStockSubmit()"
                                    class="flex-[2] bg-brand-orange text-white py-3.5 rounded-2xl font-bold text-sm shadow-lg shadow-brand-orange/20 active:scale-[0.98] transition-all flex items-center justify-center gap-1.5">
                                    <span class="material-icons-round text-[18px]">done_all</span> ส่งใบรายงานตรวจเช็ค
                                </button>
                            </div>
                        </div>
                    </div>`;
            }
        }

        // Main Render Function
        function render() {
            const root = document.getElementById('app-root');
            if (state.view === 'home')      { root.innerHTML = renderHome(); }
            else if (state.view === 'w1')   { root.innerHTML = renderW1(); }
            else if (state.view === 'w2')   { root.innerHTML = renderW2(); }
            else if (state.view === 'dashboard') { root.innerHTML = renderDashboard(); }
            else if (state.view === 'location')  { root.innerHTML = renderLocationManager(); }
            else if (state.view === 'check_stock') { root.innerHTML = renderCheckStock(); }
        }

        // ==========================================
        // 6. INITIALIZATION
        // ==========================================
        async function checkAppVersion() {
            try {
                const res = await fetch('version.json?t=' + Date.now());
                if (!res.ok) return true;
                const config = await res.json();
                if (config && config.version && config.version !== CURRENT_VERSION) {
                    showLoading('พบเวอร์ชันใหม่ กำลังอัปเดตระบบ...');
                    setTimeout(() => {
                        const url = new URL(window.location.href);
                        url.searchParams.set('update', Date.now());
                        window.location.replace(url.toString());
                    }, 800);
                    return false;
                }
            } catch (e) {
                console.warn('Version check skipped:', e);
            }
            return true;
        }

        window.onload = async function() {
            const isVersionOk = await checkAppVersion();
            if (isVersionOk) {
                ssoInit();
            }
        };

    </script>
</body>
</html>
