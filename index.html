                                                    item.status === 'จัดส่งแล้ว'   ? 'local_shipping' :
                                                    item.status === 'จัดส่งไม่ครบ' ? 'local_shipping' :
                                                    item.status === 'สินค้าหมด'    ? 'error_outline' : 'cancel'
                                                }
                                            </span>
                                            <span class="font-semibold ${
                                                item.status === 'จัดส่งแล้ว'   ? 'text-emerald-600' :
                                                item.status === 'จัดส่งไม่ครบ' ? 'text-amber-600' :
                                                item.status === 'สินค้าหมด'    ? 'text-rose-600' : 'text-slate-500'
                                            }">
                                                ${
                                                    item.status === 'จัดส่งแล้ว'   ? 'จัดส่ง:' :
                                                    item.status === 'จัดส่งไม่ครบ' ? 'จัดส่ง:' :
                                                    item.status === 'สินค้าหมด'    ? 'แจ้งหมดเมื่อ:' : 'ยกเลิกเมื่อ:'
                                                }
                                            </span> ${item.dispatchTimestamp}
                                        </span>
                                    ` : ''}
                                </div>
                                ${item.status === 'จัดส่งแล้ว' ? `
                                    <p class="mt-1 text-slate-600">เบิก <span class="font-semibold text-slate-700">${item.requestQty} ${esc(getProductUnitClient(item.itemName))}</span> (ความจุ ${item.storageCapacity || 0}) • ส่งจริง <span class="font-semibold text-emerald-600">${item.receiveQty} ${esc(getProductUnitClient(item.itemName))}</span></p>
                                    ${role === 'w1' ? `<p class="text-[11px] text-brand-blue font-medium flex items-center gap-1"><span class="material-icons-round text-[12px]">hourglass_empty</span> EXP ใหม่: ${esc(item.newExpiry)}</p>` : ''}
                                ` : ''}
                                ${item.status === 'จัดส่งไม่ครบ' ? (() => {
                                    const shortage = item.requestQty - (item.receiveQty || 0);
                                    return `
                                    <div class="mt-2 bg-amber-50 border border-amber-200 rounded-xl px-3 py-2">
                                        <div class="flex items-center justify-between text-sm">
                                            <span class="text-slate-500">สั่ง</span>
                                            <span class="font-bold text-slate-700">${item.requestQty} ${esc(getProductUnitClient(item.itemName))}</span>
                                        </div>
                                        <div class="flex items-center justify-between text-sm mt-0.5">
                                            <span class="text-slate-500">ได้รับ</span>
                                            <span class="font-bold text-amber-700">${item.receiveQty || 0} ${esc(getProductUnitClient(item.itemName))}</span>
                                        </div>
                                        <div class="flex items-center justify-between text-sm mt-0.5 pt-1.5 border-t border-amber-200">
                                            <span class="font-bold text-rose-600">ขาด</span>
                                            <span class="font-black text-rose-600">${shortage} ${esc(getProductUnitClient(item.itemName))}</span>
                                        </div>
                                    </div>`;
                                })() : ''}
                            </div>
                            ${item.status === 'จัดส่งแล้ว' && item.receiveNote && item.receiveNote !== 'ครบ' ? `<div class="text-[10px] font-medium text-brand-orange bg-brand-orange/5 px-2 py-0.5 rounded-md border border-brand-orange/20 mt-1">จัดส่ง${esc(item.receiveNote)}</div>` : ''}
                        </div>
                        ${item.w2Note ? `<p class="text-[11px] mt-3 text-amber-700 bg-amber-50 px-3 py-2 rounded-xl border border-amber-100/50"><span class="font-bold">โน้ต:</span> ${esc(item.w2Note)}</p>` : ''}
                    </div>
                `).join('');
        }

        // --- Render Dashboard (สถิติวิเคราะห์เชิงลึก AI) ---
        function getInsightDetails(itemName, qty, count, capacity) {
            const avgQty = Math.round(qty / count);
            const maxCapacity = capacity || 30;

            if (count >= 3 && qty >= maxCapacity * 1.5) {
                return { 
                    icon: 'local_fire_department', 
                    title: 'ขายไว / ควรขยายพื้นที่', 
                    desc: `ความจุหน้าร้านเก็บได้ ${maxCapacity} ชิ้น แต่เบิกรวมไปถึง ${qty} ชิ้น (ออกบ่อย ${count} รอบ) สินค้าหมดเชลฟ์ไวมาก แนะนำขยายพื้นที่จัดเก็บ`,
                    color: 'text-brand-orange', bg: 'bg-brand-orange/5', border: 'border-brand-orange/20'
                };
            }

            if (avgQty > maxCapacity) {
                return {
                    icon: 'shopping_cart', 
                    title: 'เบิกเกินความจุ (Overstock)', 
                    desc: `เบิกเฉลี่ย ${avgQty} ชิ้น/บิล ซึ่งล้นความจุหน้าร้าน (${maxCapacity} ชิ้น) อาจมีโปรโมชั่นหรือจัดพื้นที่สต๊อคนอกเชลฟ์`,
                    color: 'text-brand-blue', bg: 'bg-brand-blue/5', border: 'border-brand-blue/20'
                };
            }

            if (count >= 3 && avgQty <= maxCapacity / 2) {
                return { 
                    icon: 'inventory_2', 
                    title: 'ทยอยเติม (ตามพื้นที่)', 
                    desc: `เบิกบ่อย ${count} บิล ทีละ ${avgQty} ชิ้น (เต็มความจุ ${maxCapacity} ชิ้น) พนักงานต้องคอยเติมเรื่อยๆ เป็นการเบิกตามพื้นที่วางโชว์`,
                    color: 'text-amber-600', bg: 'bg-amber-50', border: 'border-amber-100'
                };
            }

            if (qty >= maxCapacity * 0.5 && qty <= maxCapacity * 1.2) {
                return {
                    icon: 'store', 
                    title: 'เบิกเติมเต็ม (Restock)', 
                    desc: `เบิกรวม ${qty} ชิ้น ใกล้เคียงกับความจุหน้าร้าน (${maxCapacity} ชิ้น) เป็นการทยอยเติมและจัดการสต๊อคที่สมดุลดีมาก`,
                    color: 'text-emerald-600', bg: 'bg-emerald-50', border: 'border-emerald-100'
                };
            }

            return { 
                icon: 'check_circle', 
                title: 'การเคลื่อนไหวปกติ', 
                desc: `ยอดเบิกเฉลี่ย ${avgQty} ชิ้น ความจุหน้าร้าน ${maxCapacity} ชิ้น อยู่ในระดับมาตรฐานการจัดการทั่วไป`,
                color: 'text-slate-600', bg: 'bg-slate-50', border: 'border-slate-200'
            };
        }

        function renderDashboard() {
            const filter = state.dashboardFilter;

            let startDate;
            if (filter === 'week') {
                startDate = getDisplayedWeekStart();
            } else {
                startDate = new Date(state.calendarYear, state.calendarMonth, 1);
            }

            const dispatchedItems = state.items.filter(i => {
                const d = i.rawDate ? new Date(i.rawDate) : new Date(0);
                return (i.status === 'จัดส่งแล้ว' || i.status === 'รับสินค้าแล้ว') && d >= startDate;
            });

            const TABS = [
                { id: 'summary',  label: 'สรุป',       icon: 'bar_chart' },
                { id: 'trend',    label: 'Trend',       icon: 'calendar_month' },
                { id: 'problems', label: 'หมด/ยกเลิก', icon: 'warning_amber' },
                { id: 'survey',   label: 'Survey',      icon: 'fact_check' }
            ];

            return `
                <div class="w-full max-w-md bg-[#f8fafc] min-h-screen flex flex-col relative animate-fade-in">
                    <header class="bg-brand-blue text-white p-4 flex justify-between items-center sticky top-0 z-20 shadow-md">
                        <div class="flex items-center gap-2">
                            <button onclick="setView('home')" aria-label="กลับหน้าหลัก" class="p-1.5 rounded-full hover:bg-black/10 transition-colors text-white">
                                <span class="material-icons-round">arrow_back</span>
                            </button>
                            <h1 class="text-[17px] font-bold tracking-wide flex items-center gap-1.5">
                                <span class="material-icons-round text-[20px] text-white">insights</span> ข้อมูลเชิงลึก (Analytics)
                            </h1>
                        </div>
                        <button onclick="fetchInitialData(true)" class="p-1.5 rounded-full hover:bg-black/10 transition-colors text-white" title="รีเฟรชข้อมูล">
                            <span class="material-icons-round text-[20px]">refresh</span>
                        </button>
                    </header>

                    <div class="bg-white px-4 py-3 shadow-sm sticky top-[60px] z-10 border-b border-slate-100 flex justify-center">
                        <div class="bg-slate-100 p-1 rounded-xl flex w-full max-w-[250px]">
                            <button onclick="setDashboardFilter('week')" class="flex-1 py-1.5 text-xs font-semibold rounded-lg transition-all ${filter === 'week' ? 'bg-white text-brand-blue shadow-sm' : 'text-slate-400 hover:text-slate-600'}">สัปดาห์นี้</button>
                            <button onclick="setDashboardFilter('month')" class="flex-1 py-1.5 text-xs font-semibold rounded-lg transition-all ${filter === 'month' ? 'bg-white text-brand-blue shadow-sm' : 'text-slate-400 hover:text-slate-600'}">เดือนนี้</button>
                        </div>
                    </div>

                    <div class="bg-white sticky top-[108px] z-10 border-b border-slate-100 flex">
                        ${TABS.map(t => `
                            <button onclick="setDashboardTab('${t.id}')"
                                    class="flex-1 py-2.5 flex flex-col items-center gap-0.5 transition-colors ${state.dashboardTab === t.id ? 'text-brand-blue border-b-2 border-brand-blue bg-blue-50/50' : 'text-slate-400 hover:text-slate-500'}">
                                <span class="material-icons-round text-[18px]">${t.icon}</span>
                                <span class="text-[9px] font-semibold">${t.label}</span>
                            </button>
                        `).join('')}
                    </div>

                    <main class="flex-1 overflow-y-auto p-5 pb-24 space-y-6">
                        ${state.dashboardTab === 'summary'  ? renderDashboardSummary(dispatchedItems, state.items, startDate) :
                          state.dashboardTab === 'trend'    ? renderDashboardTrend() :
                          state.dashboardTab === 'problems' ? renderDashboardProblems(state.items, startDate) :
                          renderDashboardSurvey()}
                    </main>
                </div>
            `;
        }


        // --- Analytics Sub-renders ---
        function renderDashboardSummary(dispatchedItems, allItems, startDate) {
            let totalQty = 0, totalRequestQty = 0;
            const itemStats = {};
            const requesterStats = {};

            dispatchedItems.forEach(item => {
                const qty = parseInt(item.receiveQty) || 0;
                const reqQty = parseInt(item.requestQty) || 0;
                const capacity = parseInt(item.storageCapacity) || 0;
                totalQty += qty;
                totalRequestQty += reqQty;
                if (!itemStats[item.itemName]) itemStats[item.itemName] = { count: 0, qty: 0, capacity: 0 };
                itemStats[item.itemName].count++;
                itemStats[item.itemName].qty += qty;
                if (capacity > itemStats[item.itemName].capacity) itemStats[item.itemName].capacity = capacity;
                if (item.requestedBy) requesterStats[item.requestedBy] = (requesterStats[item.requestedBy] || 0) + 1;
            });

            const problemCount = allItems.filter(i => {
                const d = i.rawDate ? new Date(i.rawDate) : new Date(0);
                return (i.status === 'สินค้าหมด' || i.status === 'ยกเลิก') && d >= startDate;
            }).length;

            const fulfillmentRate = totalRequestQty > 0 ? Math.round((totalQty / totalRequestQty) * 100) : 100;
            const fulfillBg = fulfillmentRate >= 90 ? 'bg-emerald-500 shadow-emerald-500/20' : fulfillmentRate >= 70 ? 'bg-amber-500 shadow-amber-500/20' : 'bg-rose-500 shadow-rose-500/20';

            const topItems = Object.keys(itemStats).map(k => ({
                name: k, count: itemStats[k].count, qty: itemStats[k].qty, capacity: itemStats[k].capacity
            })).sort((a, b) => b.qty - a.qty).slice(0, 10);

            const topRequesters = Object.entries(requesterStats)
                .sort((a, b) => b[1] - a[1]).slice(0, 3)
                .map(([name, count]) => ({ name, count }));

            return `
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-brand-blue p-4 rounded-[1.5rem] shadow-lg shadow-brand-blue/20 text-white relative overflow-hidden">
                        <span class="material-icons-round absolute -right-2 -bottom-2 text-[60px] opacity-10">inventory</span>
                        <p class="text-[11px] font-semibold text-white/80 uppercase tracking-wider mb-1">ยอดจัดส่งรวม</p>
                        <p class="text-2xl font-bold">${totalQty.toLocaleString()} <span class="text-xs font-medium text-white/80">ชิ้น</span></p>
                    </div>
                    <div class="bg-brand-orange p-4 rounded-[1.5rem] shadow-lg shadow-brand-orange/20 text-white relative overflow-hidden">
                        <span class="material-icons-round absolute -right-2 -bottom-2 text-[60px] opacity-10">receipt_long</span>
                        <p class="text-[11px] font-semibold text-white/80 uppercase tracking-wider mb-1">จำนวนบิลเบิก</p>
                        <p class="text-2xl font-bold">${dispatchedItems.length.toLocaleString()} <span class="text-xs font-medium text-white/80">รายการ</span></p>
                    </div>
                    <div class="${fulfillBg} p-4 rounded-[1.5rem] shadow-lg text-white relative overflow-hidden">
                        <span class="material-icons-round absolute -right-2 -bottom-2 text-[60px] opacity-10">task_alt</span>
                        <p class="text-[11px] font-semibold text-white/80 uppercase tracking-wider mb-1">Fulfillment Rate</p>
                        <p class="text-2xl font-bold">${fulfillmentRate}<span class="text-xs font-medium text-white/80">%</span></p>
                    </div>
                    <div class="bg-rose-500 p-4 rounded-[1.5rem] shadow-lg shadow-rose-500/20 text-white relative overflow-hidden">
                        <span class="material-icons-round absolute -right-2 -bottom-2 text-[60px] opacity-10">error_outline</span>
                        <p class="text-[11px] font-semibold text-white/80 uppercase tracking-wider mb-1">หมด/ยกเลิก</p>
                        <p class="text-2xl font-bold">${problemCount} <span class="text-xs font-medium text-white/80">รายการ</span></p>
                    </div>
                </div>

                ${topRequesters.length > 0 ? `
                <div>
                    <h3 class="text-sm font-bold text-brand-blue mb-3 flex items-center gap-2 px-1">
                        <span class="material-icons-round text-brand-orange text-[18px]">emoji_people</span> ผู้ขอเบิกสูงสุด
                    </h3>
                    <div class="bg-white rounded-[1.5rem] shadow-[0_4px_16px_rgb(0,0,0,0.03)] border border-slate-100 divide-y divide-slate-50">
                        ${topRequesters.map(r => `
                            <div class="flex items-center gap-3 p-3">
                                <div class="w-8 h-8 rounded-full bg-brand-blue/10 text-brand-blue flex items-center justify-center font-bold text-xs flex-shrink-0">
                                    ${esc(r.name.charAt(0).toUpperCase())}
                                </div>
                                <span class="text-sm font-semibold text-slate-700 flex-1 truncate">${esc(r.name)}</span>
                                <span class="text-xs font-bold text-brand-orange bg-brand-orange/10 px-2 py-0.5 rounded-lg">${r.count} บิล</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
                ` : ''}

                <div>
                    <h3 class="text-sm font-bold text-brand-blue mb-3 flex items-center gap-2 px-1">
                        <span class="material-icons-round text-brand-orange text-[18px]">lightbulb</span> วิเคราะห์พฤติกรรมการเบิก (Insights)
                    </h3>
                    ${topItems.length === 0 ? renderEmptyState('ไม่มีข้อมูลในช่วงเวลานี้', 'analytics') : `
                        <div class="space-y-4">
                            ${topItems.map((item, idx) => {
                                const insight = getInsightDetails(item.name, item.qty, item.count, item.capacity);
                                return `
                                    <div class="bg-white p-4 rounded-[1.5rem] shadow-[0_4px_16px_rgb(0,0,0,0.03)] border border-slate-100">
                                        <div class="flex justify-between items-start mb-3">
                                            <div class="flex-1 pr-3">
                                                <span class="text-[10px] font-bold text-slate-400">อันดับ ${idx + 1}</span>
                                                <h4 class="font-bold text-brand-blue text-[15px] leading-tight mt-0.5">${esc(item.name)}</h4>
                                            </div>
                                            <div class="text-right">
                                                <p class="font-bold text-brand-orange text-lg leading-none">${item.qty.toLocaleString()} <span class="text-[10px] font-medium text-brand-orange/80">ชิ้น</span></p>
                                                <p class="text-[10px] text-slate-400 font-medium mt-1">${item.count} บิลสั่งเบิก</p>
                                            </div>
                                        </div>
                                        <div class="${insight.bg} ${insight.border} border p-3 rounded-xl flex gap-3 items-start mt-2">
                                            <span class="material-icons-round ${insight.color} text-[18px] mt-0.5">${insight.icon}</span>
                                            <div>
                                                <p class="text-xs font-bold ${insight.color} mb-0.5">${insight.title}</p>
                                                <p class="text-[10px] text-slate-600 leading-snug">${insight.desc}</p>
                                            </div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    `}
                </div>

                <div>
                    <h3 class="text-sm font-bold text-brand-blue mb-3 flex items-center gap-2 px-1">
                        <span class="material-icons-round text-brand-orange text-[18px]">history</span> รายการบิลเบิกย้ายล่าสุด
                    </h3>
                    ${dispatchedItems.length === 0 ? renderEmptyState('ไม่มีบิลจัดส่ง', 'receipt') : `
                        <div class="bg-white rounded-[1.5rem] shadow-[0_4px_16px_rgb(0,0,0,0.03)] border border-slate-100 overflow-hidden">
                            ${dispatchedItems.slice(0, 20).map(bill => `
                                <div class="p-4 border-b border-slate-50 last:border-0 hover:bg-slate-50 transition-colors">
                                    <div class="flex justify-between items-center mb-1.5 flex-wrap gap-1">
                                        <span class="text-[10px] font-mono font-semibold text-brand-blue bg-brand-blue/10 px-2 py-0.5 rounded">${bill.id}</span>
                                        <div class="text-[9px] text-slate-400 flex items-center gap-2 flex-wrap">
                                            <span class="inline-flex items-center gap-0.5"><span class="material-icons-round text-[11px]">event_note</span>เบิก: ${bill.timestamp.split(' / ')[0]}</span>
                                            ${bill.dispatchTimestamp ? `<span class="inline-flex items-center gap-0.5"><span class="material-icons-round text-[11px] text-emerald-500">local_shipping</span>จัดส่ง: ${bill.dispatchTimestamp.split(' / ')[0]}</span>` : ''}
                                        </div>
                                    </div>
                                    <p class="text-sm font-bold text-slate-800 mb-1 truncate">${esc(bill.itemName)}</p>
                                    <div class="flex justify-between items-end">
                                        <div class="text-[10px] text-slate-500 flex items-center gap-1 mt-1">
                                            <span class="material-icons-round text-[12px] text-slate-400">inventory_2</span>
                                            ความจุ: <span class="font-medium text-slate-700">${bill.storageCapacity || 0} ชิ้น</span>
                                        </div>
                                        <span class="text-xs font-bold text-brand-orange bg-brand-orange/10 px-2 py-1 rounded-lg">ส่ง ${bill.receiveQty} ชิ้น</span>
                                    </div>
                                </div>
                            `).join('')}
                            ${dispatchedItems.length > 20 ? `<div class="p-3 text-center text-[10px] text-slate-400 bg-slate-50 border-t border-slate-100">แสดงข้อมูล 20 รายการล่าสุด</div>` : ''}
                        </div>
                    `}
                </div>
            `;
        }

        function renderDashboardTrend() {
            const filter = state.dashboardFilter;
            const actMap = buildActivityMap();
            const TH_MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

            let navLabel;
            if (filter === 'month') {
                navLabel = `${TH_MONTHS[state.calendarMonth]} ${state.calendarYear + 543}`;
            } else {
                const ws = getDisplayedWeekStart();
                const we = new Date(ws);
                we.setDate(ws.getDate() + 6);
                const fmt = d => `${d.getDate()} ${TH_MONTHS[d.getMonth()]}`;
                navLabel = `${fmt(ws)} – ${fmt(we)}`;
            }

            return `
                <div class="flex items-center justify-between bg-white p-3 rounded-2xl shadow-[0_2px_8px_rgb(0,0,0,0.04)] border border-slate-100">
                    <button onclick="setCalendarNav(-1)" class="p-2 rounded-xl hover:bg-slate-100 active:bg-slate-200 transition-colors">
                        <span class="material-icons-round text-brand-blue text-[20px]">chevron_left</span>
                    </button>
                    <span class="text-sm font-bold text-brand-blue">${navLabel}</span>
                    <button onclick="setCalendarNav(1)" class="p-2 rounded-xl hover:bg-slate-100 active:bg-slate-200 transition-colors">
                        <span class="material-icons-round text-brand-blue text-[20px]">chevron_right</span>
                    </button>
                </div>

                ${filter === 'month' ? renderCalendarMonth(actMap) : renderCalendarWeek(actMap)}

                ${state.calendarSelectedDate ? renderDayDetail(state.calendarSelectedDate) : ''}
            `;
        }

        function renderCalendarMonth(actMap) {
            const year = state.calendarYear;
            const month = state.calendarMonth;
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startDow = firstDay.getDay();
            const startOffset = startDow === 0 ? 6 : startDow - 1;

            const today = new Date();
            const todayKey = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
            const DAY_HEADERS = ['จ','อ','พ','พฤ','ศ','ส','อา'];

            const cells = [];
            for (let i = 0; i < startOffset; i++) cells.push(null);
            for (let d = 1; d <= lastDay.getDate(); d++) cells.push(new Date(year, month, d));
            while (cells.length % 7 !== 0) cells.push(null);

            return `
                <div class="bg-white rounded-[1.5rem] shadow-[0_4px_16px_rgb(0,0,0,0.03)] border border-slate-100 p-3">
                    <div class="grid grid-cols-7 mb-1">
                        ${DAY_HEADERS.map(h => `<div class="text-center text-[10px] font-bold text-slate-400 py-1">${h}</div>`).join('')}
                    </div>
                    <div class="grid grid-cols-7 gap-1">
                        ${cells.map(d => {
                            if (!d) return `<div></div>`;
                            const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
                            const act = actMap[key] || { billCount: 0, hasStockout: false };
                            const isToday = key === todayKey;
                            const isSelected = key === state.calendarSelectedDate;

                            let bg = 'bg-slate-50 text-slate-400';
                            if (act.billCount >= 6) bg = 'bg-brand-blue text-white';
                            else if (act.billCount >= 3) bg = 'bg-blue-300 text-blue-900';
                            else if (act.billCount >= 1) bg = 'bg-blue-100 text-blue-700';

                            return `
                                <div onclick="selectCalendarDate('${key}')"
                                     class="relative rounded-xl p-1.5 text-center cursor-pointer transition-all active:scale-95
                                            ${bg}
                                            ${isToday ? 'ring-2 ring-brand-orange ring-offset-1' : ''}
                                            ${isSelected ? 'ring-2 ring-brand-orange shadow-md' : ''}">
                                    <span class="text-[12px] font-bold leading-none">${d.getDate()}</span>
                                    ${act.billCount > 0 ? `<div class="text-[8px] font-semibold opacity-80 mt-0.5">${act.billCount}บ</div>` : ''}
                                    ${act.hasStockout ? `<div class="absolute top-0.5 right-0.5 w-1.5 h-1.5 bg-rose-500 rounded-full"></div>` : ''}
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function renderCalendarWeek(actMap) {
            const ws = getDisplayedWeekStart();
            const DAYS = ['จ','อ','พ','พฤ','ศ','ส','อา'];
            const days = Array.from({length: 7}, (_, i) => {
                const d = new Date(ws);
                d.setDate(ws.getDate() + i);
                return d;
            });

            const maxBills = Math.max(1, ...days.map(d => {
                const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
                return (actMap[key] || {}).billCount || 0;
            }));

            const today = new Date();

            return `
                <div class="bg-white rounded-[1.5rem] shadow-[0_4px_16px_rgb(0,0,0,0.03)] border border-slate-100 p-4">
                    <div class="grid grid-cols-7 gap-1 items-end" style="height:120px">
                        ${days.map((d, i) => {
                            const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
                            const act = actMap[key] || { billCount: 0, hasStockout: false };
                            const barH = Math.max(4, Math.round((act.billCount / maxBills) * 80));
                            const isToday = d.toDateString() === today.toDateString();
                            const isSelected = key === state.calendarSelectedDate;
                            const barColor = isSelected ? 'bg-brand-orange' : isToday ? 'bg-brand-blue' : 'bg-blue-300';

                            return `
                                <div onclick="selectCalendarDate('${key}')"
                                     class="flex flex-col items-center justify-end h-full cursor-pointer gap-0.5">
                                    <span class="text-[9px] font-bold text-slate-500">${act.billCount > 0 ? act.billCount : ''}</span>
                                    <div class="w-full rounded-t-lg ${barColor} ${isSelected ? 'ring-1 ring-brand-orange ring-offset-1' : ''} transition-all"
                                         style="height:${barH}px"></div>
                                    <span class="text-[9px] font-semibold ${isToday ? 'text-brand-blue' : 'text-slate-400'}">${DAYS[i]}</span>
                                    <span class="text-[10px] font-bold ${isToday ? 'text-brand-blue' : 'text-slate-600'}">${d.getDate()}</span>
                                    ${act.hasStockout ? `<div class="w-1.5 h-1.5 bg-rose-500 rounded-full"></div>` : `<div class="w-1.5 h-1.5"></div>`}
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function renderDayDetail(dateStr) {
            const [year, month, day] = dateStr.split('-').map(Number);
            const dateObj = new Date(year, month - 1, day);
            const TH_MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
            const TH_DAYS = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
            const displayDate = `วัน${TH_DAYS[dateObj.getDay()]}ที่ ${day} ${TH_MONTHS[month-1]} ${year + 543}`;

            const dayItems = state.items.filter(item => {
                const d = item.rawDate ? new Date(item.rawDate) : null;
                if (!d || isNaN(d.getTime())) return false;
                const k = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
                return k === dateStr;
            });

            const dispatched = dayItems.filter(i => i.status === 'จัดส่งแล้ว' || i.status === 'รับสินค้าแล้ว');
            const totalQty = dispatched.reduce((s, i) => s + (parseInt(i.receiveQty) || 0), 0);

            return `
                <div class="bg-white rounded-[1.5rem] shadow-[0_4px_16px_rgb(0,0,0,0.03)] border border-slate-100 overflow-hidden animate-fade-in">
                    <div class="bg-brand-blue/5 px-4 py-3 border-b border-slate-100 flex justify-between items-center">
                        <div>
                            <p class="text-[10px] font-semibold text-slate-400">รายละเอียดวัน</p>
                            <p class="text-sm font-bold text-brand-blue">${displayDate}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-xs font-bold text-brand-orange">${dispatched.length} บิล</p>
                            <p class="text-[10px] text-slate-400">${totalQty} ชิ้นรวม</p>
                        </div>
                    </div>
                    ${dayItems.length === 0
                        ? `<div class="p-6 text-center text-sm text-slate-400">ไม่มีการเบิกในวันนี้</div>`
                        : `<div class="divide-y divide-slate-50">
                            ${dayItems.map(item => {
                                const isDispatched = item.status === 'จัดส่งแล้ว' || item.status === 'รับสินค้าแล้ว';
                                const isStockout = item.status === 'สินค้าหมด';
                                const chipCls = isDispatched ? 'bg-emerald-100 text-emerald-700'
                                              : isStockout   ? 'bg-rose-100 text-rose-700'
                                              :                'bg-slate-100 text-slate-600';
                                return `
                                    <div class="p-3 flex items-center gap-3">
                                        <div class="flex-1 min-w-0">
                                            <p class="text-sm font-semibold text-slate-800 truncate">${esc(item.itemName)}</p>
                                            ${item.requestedBy ? `<p class="text-[10px] text-slate-400">โดย: ${esc(item.requestedBy)}</p>` : ''}
                                        </div>
                                        <div class="flex items-center gap-2 flex-shrink-0">
                                            ${item.receiveQty ? `<span class="text-xs font-bold text-brand-orange">${item.receiveQty} ชิ้น</span>` : ''}
                                            <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full ${chipCls}">${esc(item.status)}</span>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>`
                    }
                </div>
            `;
        }

        function renderDashboardProblems(allItems, startDate) {
            const stockoutMap = {};
            allItems.forEach(item => {
                if (item.status !== 'สินค้าหมด') return;
                if (!stockoutMap[item.itemName]) stockoutMap[item.itemName] = { count: 0, lastDate: null };
                stockoutMap[item.itemName].count++;
                const d = item.rawDate ? new Date(item.rawDate) : null;
                if (d && (!stockoutMap[item.itemName].lastDate || d > stockoutMap[item.itemName].lastDate)) {
                    stockoutMap[item.itemName].lastDate = d;
                }
            });

            const stockoutRanked = Object.entries(stockoutMap)
                .map(([name, s]) => ({ name, count: s.count, lastDate: s.lastDate }))
                .sort((a, b) => b.count - a.count)
                .slice(0, 10);

            const cancelledItems = allItems.filter(i => {
                const d = i.rawDate ? new Date(i.rawDate) : new Date(0);
                return i.status === 'ยกเลิก' && d >= startDate;
            }).slice(0, 10);

            const getDaysAgo = d => {
                if (!d) return '-';
                const days = Math.floor((Date.now() - d.getTime()) / 86400000);
                return days === 0 ? 'วันนี้' : `${days} วันที่แล้ว`;
            };

            return `
                <div>
                    <h3 class="text-sm font-bold text-brand-blue mb-3 flex items-center gap-2 px-1">
                        <span class="material-icons-round text-rose-500 text-[18px]">trending_down</span> สินค้าหมดบ่อย (ทั้งหมด)
                    </h3>
                    ${stockoutRanked.length === 0
                        ? renderEmptyState('ยังไม่มีบันทึกสินค้าหมด', 'check_circle')
                        : `<div class="bg-white rounded-[1.5rem] shadow-[0_4px_16px_rgb(0,0,0,0.03)] border border-slate-100 divide-y divide-slate-50">
                            ${stockoutRanked.map((item, idx) => `
                                <div class="p-3 flex items-center gap-3">
                                    <div class="w-7 h-7 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center font-bold text-xs flex-shrink-0">${idx + 1}</div>
                                    <div class="flex-1 min-w-0">
                                        <p class="text-sm font-semibold text-slate-800 truncate">${esc(item.name)}</p>
                                        <p class="text-[10px] text-slate-400">ล่าสุด: ${getDaysAgo(item.lastDate)}</p>
                                    </div>
                                    <span class="text-xs font-bold text-rose-600 bg-rose-50 px-2 py-0.5 rounded-lg">${item.count} ครั้ง</span>
                                </div>
                            `).join('')}
                        </div>`
                    }
                </div>

                <div>
                    <h3 class="text-sm font-bold text-brand-blue mb-3 flex items-center gap-2 px-1">
                        <span class="material-icons-round text-slate-400 text-[18px]">cancel</span> รายการยกเลิก (ช่วงนี้)
                    </h3>
                    ${cancelledItems.length === 0
                        ? renderEmptyState('ไม่มีรายการยกเลิก', 'check_circle')
                        : `<div class="bg-white rounded-[1.5rem] shadow-[0_4px_16px_rgb(0,0,0,0.03)] border border-slate-100 divide-y divide-slate-50">
                            ${cancelledItems.map(item => `
                                <div class="p-3">
                                    <div class="flex justify-between items-start mb-1">
                                        <p class="text-sm font-semibold text-slate-800 flex-1 pr-2 truncate">${esc(item.itemName)}</p>
                                        <span class="text-[9px] text-slate-400 flex-shrink-0">${item.timestamp ? item.timestamp.split(' / ')[0] : ''}</span>
                                    </div>
                                    ${item.requestedBy ? `<p class="text-[10px] text-slate-400">โดย: ${esc(item.requestedBy)}</p>` : ''}
                                    ${item.w2Note ? `<p class="text-[10px] text-slate-500 bg-slate-50 rounded-lg px-2 py-1 mt-1">${esc(item.w2Note)}</p>` : ''}
                                </div>
                            `).join('')}
                        </div>`
                    }
                </div>
            `;
        }

        function renderDashboardSurvey() {
            if (state.surveyLogsLoading) {
                return `
                    <div class="flex flex-col items-center justify-center py-16 gap-3">
                        <div class="animate-spin rounded-full h-10 w-10 border-[3px] border-brand-blue/20 border-t-brand-orange"></div>
                        <p class="text-sm text-slate-400 font-medium">กำลังโหลดประวัติสำรวจ...</p>
                    </div>
                `;
            }

            if (!state.surveyLogs || state.surveyLogs.length === 0) {
                return renderEmptyState(
                    state.surveyLogs === null ? 'ไม่สามารถโหลดข้อมูลได้' : 'ยังไม่มีประวัติการสำรวจ',
                    state.surveyLogs === null ? 'error_outline' : 'fact_check'
                ) + `<div class="text-center -mt-2"><button onclick="fetchSurveyLogs()" class="text-sm font-semibold text-brand-blue underline">ลองโหลดใหม่</button></div>`;
            }

            const logs = state.surveyLogs;
            const now = new Date();
            const yearBE = String(now.getFullYear() + 543);
            const monthStr = String(now.getMonth() + 1).padStart(2, '0');

            const thisMonthLogs = logs.filter(l => {
                const s = String(l.surveyDate || '');
                return s.includes('-' + monthStr + '-' + yearBE) || s.includes('/' + monthStr + '/');
            });

            const sessionKeys = new Set(thisMonthLogs.map(l => String(l.surveyDate).split(' / ')[0] + '_' + l.floor + '_' + (l.surveyedBy || '')));
            const thisMonthCount = sessionKeys.size;
            const needOrderCount = thisMonthLogs.filter(l => (parseInt(l.needToOrder) || 0) > 0).length;

            const sessions = {};
            logs.slice(0, 200).forEach(l => {
                const dateKey = String(l.surveyDate).split(' / ')[0];
                const sk = `${dateKey}__${l.floor}__${l.surveyedBy || ''}`;
                if (!sessions[sk]) sessions[sk] = { date: dateKey, floor: l.floor, surveyedBy: l.surveyedBy || '', items: [] };
                sessions[sk].items.push(l);
            });

            const sessionList = Object.values(sessions).slice(0, 30);

            return `
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-emerald-500 p-4 rounded-[1.5rem] text-white relative overflow-hidden shadow-lg shadow-emerald-500/20">
                        <span class="material-icons-round absolute -right-2 -bottom-2 text-[60px] opacity-10">fact_check</span>
                        <p class="text-[11px] font-semibold text-white/80 uppercase tracking-wider mb-1">สำรวจเดือนนี้</p>
                        <p class="text-2xl font-bold">${thisMonthCount} <span class="text-xs font-medium text-white/80">ครั้ง</span></p>
                    </div>
                    <div class="bg-amber-500 p-4 rounded-[1.5rem] text-white relative overflow-hidden shadow-lg shadow-amber-500/20">
                        <span class="material-icons-round absolute -right-2 -bottom-2 text-[60px] opacity-10">add_shopping_cart</span>
                        <p class="text-[11px] font-semibold text-white/80 uppercase tracking-wider mb-1">รายการต้องเติม</p>
                        <p class="text-2xl font-bold">${needOrderCount} <span class="text-xs font-medium text-white/80">รายการ</span></p>
                    </div>
                </div>

                <div>
                    <h3 class="text-sm font-bold text-brand-blue mb-3 flex items-center gap-2 px-1">
                        <span class="material-icons-round text-brand-orange text-[18px]">history</span> ประวัติการสำรวจ
                    </h3>
                    <div class="space-y-3">
                        ${sessionList.map(session => `
                            <div class="bg-white rounded-[1.5rem] shadow-[0_4px_16px_rgb(0,0,0,0.03)] border border-slate-100 overflow-hidden">
                                <div class="bg-brand-blue/5 px-4 py-2.5 border-b border-slate-100 flex items-center gap-2">
                                    <span class="material-icons-round text-brand-blue text-[16px]">assignment</span>
                                    <div class="flex-1">
                                        <span class="text-xs font-bold text-brand-blue">${esc(/^\d+$/.test(session.floor) ? 'ชั้น ' + session.floor : session.floor || '-')}</span>
                                        <span class="text-[10px] text-slate-400 ml-2">${session.date}</span>
                                    </div>
                                    <span class="text-[10px] text-slate-400">โดย: ${esc(session.surveyedBy || '-')}</span>
                                </div>
                                <div class="divide-y divide-slate-50">
                                    ${session.items.map(item => {
                                        const cur = parseInt(item.currentStock) || 0;
                                        const par = parseInt(item.parLevel) || 0;
                                        const need = parseInt(item.needToOrder) || 0;
                                        const s = getStockStatus(cur, par);
                                        return `
                                            <div class="px-4 py-2 flex items-center gap-2">
                                                <p class="text-sm text-slate-700 flex-1 truncate">${item.productName}</p>
                                                <span class="text-[10px] text-slate-400 flex-shrink-0">${cur}/${par}</span>
                                                ${need > 0 ? `<span class="text-[10px] font-bold text-rose-600 bg-rose-50 px-1.5 py-0.5 rounded flex-shrink-0">+${need}</span>` : ''}
                                                <span class="text-[10px] font-semibold ${s.color} ${s.bg} px-1.5 py-0.5 rounded-lg border ${s.border} flex-shrink-0">${s.label}</span>
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="text-center pb-2">
                    <button onclick="fetchSurveyLogs()" class="text-xs text-slate-400 underline">รีเฟรชข้อมูล</button>
                </div>
            `;
        }

        function renderW2BatchRow(item) {
            const st    = getEffectiveState(item);
            const unit  = getProductUnitClient(item.itemName);
            const enc   = encodeURIComponent(item.id);
            const partialQty = (state.w2PartialQty || {})[item.id] || 0;
            const shortage   = partialQty > 0 ? item.requestQty - partialQty : 0;

            let boxClass, boxContent, rowBg, nameClass, subExtra = '';
            if (st === 'dispatch') {
                boxClass   = 'bg-emerald-500 text-white';
                boxContent = '<span class="material-icons-round text-[18px]">check</span>';
                rowBg      = 'bg-emerald-50 border-emerald-200';
                nameClass  = 'font-bold text-emerald-800';
            } else if (st === 'partial') {
                boxClass   = 'bg-amber-400 text-white';
                boxContent = '<span class="material-icons-round text-[18px]">remove</span>';
                rowBg      = 'bg-amber-50 border-amber-200';
                nameClass  = 'font-bold text-amber-800';
            } else if (st === 'outstock') {
                boxClass   = 'bg-rose-500 text-white';
                boxContent = '<span class="material-icons-round text-[18px]">close</span>';
                rowBg      = 'bg-rose-50 border-rose-200';
                nameClass  = 'font-semibold text-rose-400 line-through';
                if (item.dispatchTimestamp && item.dispatchTimestamp !== '-') {
                    subExtra = `<span class="text-rose-300">· หมด ${item.dispatchTimestamp}</span>`;
                }
            } else {
                boxClass   = 'border-2 border-slate-200 bg-white';
                boxContent = '';
                rowBg      = 'bg-white border-slate-100';
                nameClass  = 'font-semibold text-brand-blue';
            }

            const partialInput = st === 'partial' ? `
                <div onclick="event.stopPropagation()" class="px-3.5 pb-3.5 -mt-1">
                    <div class="bg-white border border-amber-300 rounded-2xl p-3 flex items-center gap-2.5 shadow-sm">

                        <div class="flex-1 min-w-0">
                            <p class="text-[10px] font-bold text-amber-700 mb-1">ส่งได้จริง (สั่ง ${item.requestQty} ${unit})</p>
                            <input type="number" min="0" max="${item.requestQty}"
                                   value="${partialQty || ''}"
                                   placeholder="0"
                                   oninput="updatePartialQty(decodeURIComponent('${enc}'), this.value)"
                                   class="w-full text-center text-lg font-black text-amber-800 bg-amber-50 border border-amber-200 rounded-xl py-2 focus:border-amber-400 focus:outline-none transition-all">
                        </div>
                        <span class="text-xs font-bold text-amber-600 flex-shrink-0">${unit}</span>
                    </div>
                    <p id="partial-shortage-${enc}"
                       class="text-[10px] font-bold text-center mt-1.5 ${shortage > 0 && partialQty > 0 ? 'text-amber-600' : 'text-transparent'}">
                        ${shortage > 0 && partialQty > 0 ? `ขาด ${shortage} ${unit}` : '—'}
                    </p>
                </div>` : '';

            return `
                <div class="rounded-2xl border shadow-sm mb-2 overflow-hidden ${rowBg}">
                    <div onclick="toggleW2BatchItem(decodeURIComponent('${enc}'))"
                         class="flex items-center gap-3 p-3.5 cursor-pointer active:scale-[0.99] transition-all select-none">
                        <div class="w-9 h-9 flex-shrink-0 flex items-center justify-center font-bold rounded-xl ${boxClass}">${boxContent}</div>
                        <div class="flex-1 min-w-0">

                                <span>${item.timestamp || ''}</span>
                                ${subExtra}
                            </p>
                        </div>
                        <div class="flex-shrink-0 text-right">
                            <p class="text-base font-black ${st === 'dispatch' ? 'text-emerald-600' : st === 'partial' ? 'text-amber-600' : st === 'outstock' ? 'text-rose-400 line-through' : 'text-brand-blue'}">${item.requestQty}</p>
                            <p class="text-[9px] font-semibold text-slate-400 uppercase">${unit}</p>
                        </div>
                    </div>
                    ${partialInput}
                </div>`;
        }

        async function confirmBatchDispatch() {
            const edits = state.w2BatchEdits;
            const dispatchCount = Object.values(edits).filter(v => v === 'dispatch').length;
            const partialCount  = Object.values(edits).filter(v => v === 'partial').length;
            const totalAction   = dispatchCount + partialCount;

            if (totalAction === 0) { alert('เลือกสินค้าที่จะจัดส่งก่อน'); return; }

            // ตรวจ partial ที่ยังไม่ได้กรอก qty
            const missingQty = Object.entries(edits)
                .filter(([, v]) => v === 'partial')
                .filter(([id]) => !((state.w2PartialQty || {})[id] > 0));
            if (missingQty.length > 0) {
                const names = missingQty.map(([id]) => state.items.find(i => i.id === id)?.itemName || id).join(', ');
                alert(`กรุณากรอกจำนวนที่ส่งได้จริงก่อน:\n${names}`);
                return;
            }

            const now = formatDateTime(new Date().toISOString());

            state.items = state.items.map(item => {
                const edit = edits[item.id];
                if (edit === 'dispatch') {
                    return { ...item, status: 'จัดส่งแล้ว', receiveQty: item.requestQty, receiveNote: 'ครบ', dispatchTimestamp: now };
                }
                if (edit === 'partial') {
                    const actual   = (state.w2PartialQty || {})[item.id] || 0;
                    const shortage = item.requestQty - actual;
                    return { ...item, status: 'จัดส่งไม่ครบ', receiveQty: actual, receiveNote: `ส่ง ${actual}/${item.requestQty} ขาด ${shortage}`, dispatchTimestamp: now };
                }
                if (edit === 'outstock') {
                    return { ...item, status: 'สินค้าหมด', dispatchTimestamp: now };
                }
                return item;
            });

            state.w2BatchEdits = {};
            state.w2PartialQty = {};
            render();
            if (!(await syncDataToSheet())) { await fetchInitialData(true); return; }
            sendAppLog('จัดส่งสินค้า Batch (AKRA)', `ครบ ${dispatchCount} · ไม่ครบ ${partialCount} รายการ`);
        }

        function renderW2() {

            const STOCKOUT_STATUS   = 'สินค้าหมด';

            const pendingTasks  = state.items.filter(i => PENDING_STATUSES.includes(i.status));
            const stockoutItems = state.items.filter(i => i.status === STOCKOUT_STATUS);
            const hasPending    = pendingTasks.length > 0;
            const hasStockout   = stockoutItems.length > 0;

            let content = '';

            // ── Tab: งานจัด (รอจัด เท่านั้น) ──
            if (state.w2Tab === 'tasks') {
                if (pendingTasks.length === 0) {
                    content = renderEmptyState('ไม่มีงานจัดสินค้า', 'inventory_2');
                } else {
                    const dispatchCount = pendingTasks.filter(i => getEffectiveState(i) === 'dispatch').length;
                    const partialCount  = pendingTasks.filter(i => getEffectiveState(i) === 'partial').length;

                    const actionCount   = dispatchCount + partialCount;
                    content = `
                        <div class="animate-fade-in">

                                </div>
                                <div class="p-3 text-center">
                                    <p class="text-xl font-black ${pendingCount > 0 ? 'text-brand-blue' : 'text-slate-300'}">${pendingCount}</p>

                            <p class="text-[10px] text-slate-400 text-center mb-3">แตะ 1 ครั้ง = ✅ ครบ · 2 ครั้ง = ⚠️ ไม่ครบ · 3 ครั้ง = ❌ หมด</p>

                            <div class="h-28"></div>
                        </div>
                        <div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white border-t border-slate-100 p-4 shadow-2xl z-10">
                            <p class="text-[10px] text-center text-slate-400 mb-2">✅ ครบ ${dispatchCount} · ⚠️ ไม่ครบ ${partialCount} · รอ ${pendingCount}</p>
                            <button onclick="confirmBatchDispatch()"
                                    class="w-full py-4 rounded-2xl font-bold text-sm transition-all active:scale-[0.98]
                                           ${actionCount > 0 ? 'bg-brand-blue text-white shadow-lg shadow-brand-blue/20' : 'bg-slate-100 text-slate-400 cursor-not-allowed'}">
                                🚚 ยืนยันจัดส่ง ${actionCount} รายการ
                            </button>
                        </div>`;
                }

            // ── Tab: สินค้าหมด ──
            } else if (state.w2Tab === 'stockout') {
                if (stockoutItems.length === 0) {
                    content = renderEmptyState('ไม่มีรายการสินค้าหมด', 'check_circle');
                } else {
                    // check if any stockout item is being restored (in batch edits)
                    const restoreCount = stockoutItems.filter(i => state.w2BatchEdits[i.id] === 'dispatch').length;
                    content = `
                        <div class="animate-fade-in">
                            <!-- Header info -->
                            <div class="bg-rose-50 border border-rose-200 rounded-2xl p-4 mb-4 flex items-start gap-3">
                                <span class="material-icons-round text-rose-500 text-[22px] flex-shrink-0 mt-0.5">error_outline</span>
                                <div>
                                    <p class="text-sm font-bold text-rose-700">${stockoutItems.length} รายการที่แจ้งสินค้าหมด</p>
                                    <p class="text-xs text-rose-500 mt-0.5">กด "กู้คืน" เพื่อจัดส่งใหม่ หรือ "ล้างทั้งหมด" เพื่อย้ายไปประวัติ</p>
                                </div>
                            </div>
                            <!-- Stockout rows -->
                            <div class="space-y-2">
                                ${stockoutItems.map(item => {
                                    const isRestoring = state.w2BatchEdits[item.id] === 'dispatch';
                                    return `
                                    <div class="bg-white rounded-2xl border ${isRestoring ? 'border-emerald-300 shadow-emerald-100 shadow-md' : 'border-rose-200/60'} p-4 flex items-center gap-3 transition-all">
                                        <div class="flex-1 min-w-0">
                                            <p class="font-bold text-slate-800 text-sm truncate">${esc(item.itemName || '—')}</p>
                                            <div class="flex items-center gap-2 mt-1 flex-wrap">
                                                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${isRestoring ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-600'}">
                                                    ${isRestoring ? '✓ กำลังกู้คืน' : '❌ หมด'}
                                                </span>
                                                <span class="text-[10px] text-slate-400">${item.qty || '—'} ${esc(item.unit || '')}</span>
                                                ${item.dispatchTimestamp ? `<span class="text-[10px] text-slate-400">${item.dispatchTimestamp}</span>` : ''}
                                            </div>
                                        </div>
                                        <button onclick="${isRestoring ? `delete state.w2BatchEdits['${item.id}']; render()` : `restoreStockoutItem('${item.id}')`}"
                                                class="flex-shrink-0 px-3 py-2 rounded-xl text-xs font-bold transition-all active:scale-95
                                                       ${isRestoring ? 'bg-slate-100 text-slate-500' : 'bg-emerald-600 text-white shadow-sm shadow-emerald-200'}">
                                            ${isRestoring ? 'ยกเลิก' : '🔄 กู้คืน'}
                                        </button>
                                    </div>`;
                                }).join('')}
                            </div>
                            <div class="h-32"></div>
                        </div>
                        <!-- Bottom action bar -->
                        <div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white border-t border-slate-100 p-4 shadow-2xl z-10 space-y-2">
                            ${restoreCount > 0 ? `
                            <button onclick="confirmBatchDispatch()"
                                    class="w-full py-3.5 rounded-2xl font-bold text-sm bg-brand-blue text-white shadow-lg shadow-brand-blue/20 active:scale-[0.98] transition-all">
                                🚚 ยืนยันกู้คืน + จัดส่ง ${restoreCount} รายการ
                            </button>` : ''}
                            <button onclick="clearAllStockout()"
                                    class="w-full py-3.5 rounded-2xl font-bold text-sm bg-rose-50 text-rose-600 border border-rose-200 active:scale-[0.98] transition-all">
                                🗑 ล้างรายการหมดทั้งหมด (ย้ายไปประวัติ)
                            </button>
                        </div>`;
                }

            // ── Tab: ประวัติ ──
            } else if (state.w2Tab === 'history') {
                content = renderHistoryList('w2');
            }

            return `
                <div class="w-full max-w-md bg-[#f8fafc] min-h-screen flex flex-col relative">
                    <header class="bg-brand-blue text-white p-4 flex justify-between items-center sticky top-0 z-20 shadow-md">
                        <div class="flex items-center gap-2">
                            <button onclick="setView('home')" aria-label="กลับหน้าหลัก" class="p-1.5 rounded-full hover:bg-black/10 transition-colors text-white"><span class="material-icons-round">arrow_back</span></button>
                            <h1 class="text-[17px] font-bold tracking-wide flex items-center gap-1.5"><span class="material-icons-round text-[20px]">warehouse</span> คลังสินค้า (AKRA)</h1>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="fetchInitialData(true)" class="p-1.5 rounded-full hover:bg-black/10 transition-colors text-white" title="รีเฟรชข้อมูล"><span class="material-icons-round text-[20px]">refresh</span></button>
                            <div class="text-[10px] font-semibold tracking-wide bg-black/20 text-white px-3 py-1.5 rounded-full flex items-center gap-1.5 border border-white/10"><span class="material-icons-round text-[14px]">account_circle</span> ${esc(currentUser || 'Demo')}</div>
                        </div>
                    </header>

                    <!-- 3 tabs -->
                    <div class="flex bg-white shadow-sm sticky top-[60px] z-10 border-b border-slate-100">
                        <button onclick="setW2Tab('tasks')"
                                class="flex-1 py-3 text-[12px] font-semibold border-b-[2.5px] relative transition-all
                                       ${state.w2Tab === 'tasks' ? 'border-brand-blue text-brand-blue' : 'border-transparent text-slate-400 hover:text-slate-600'}">
                            รอจัด
                            ${hasPending ? `<span class="ml-1 bg-brand-blue/10 text-brand-blue text-[10px] font-bold px-1.5 py-0.5 rounded-full">${pendingTasks.length}</span>` : ''}
                        </button>
                        <button onclick="setW2Tab('stockout')"
                                class="flex-1 py-3 text-[12px] font-semibold border-b-[2.5px] relative transition-all
                                       ${state.w2Tab === 'stockout' ? 'border-rose-500 text-rose-600' : 'border-transparent text-slate-400 hover:text-slate-600'}">
                            สินค้าหมด
                            ${hasStockout ? `<span class="ml-1 bg-rose-100 text-rose-600 text-[10px] font-bold px-1.5 py-0.5 rounded-full">${stockoutItems.length}</span>` : ''}
                        </button>
                        <button onclick="setW2Tab('history')"
                                class="flex-1 py-3 text-[12px] font-semibold border-b-[2.5px] transition-all
                                       ${state.w2Tab === 'history' ? 'border-brand-blue text-brand-blue' : 'border-transparent text-slate-400 hover:text-slate-600'}">

                        </button>
                    </div>

                    <main class="flex-1 overflow-y-auto p-5 pb-24">${content}</main>
                </div>`;
        }

        // ── Render: Location Manager ──
        function renderLocationSheet() {
            if (!state.locationSheet) return '';
            const { name } = state.locationSheet;
            const floor = state.locationSheetFloor;
            const bin   = (state.locationSheetZoneInput || '').toUpperCase().trim();
            const par   = state.locationSheetParLevel || '';
            const FLOORS = ['1','2','3','4','5'];

            const isBulk = name === 'BULK_MODE';
            const selectedCount = isBulk ? Object.keys(state.locationSelectedItems).length : 0;
            const displayTitle = isBulk ? `จัดพิกัดแบบกลุ่ม (${selectedCount} รายการ)` : name;

            const locationCode = floor && floor !== 'NOSTK' && bin
                ? `W1-${floor}F-${bin}`
                : (floor === 'NOSTK' ? 'NOSTK' : null);

            let existingBins = [];
            if (floor && floor !== 'NOSTK') {
                const bSet = new Set();
                state.products.filter(p => p.floor === floor && p.location && p.location !== 'NOSTK')
                    .forEach(p => { if (p.location) bSet.add(p.location); });
                existingBins = [...bSet].sort();
            }

            const canSave = !!(floor && (floor === 'NOSTK' || bin));
            const stepNum = (n) => `<span class="w-5 h-5 rounded-full bg-brand-blue text-white text-[10px] font-bold flex items-center justify-center flex-shrink-0">${n}</span>`;

            return `
                <div onclick="closeLocationSheet()" class="fixed inset-0 bg-black/50 z-40 backdrop-blur-sm"></div>
                <div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white rounded-t-[2rem] z-50 shadow-2xl animate-slide-up" style="max-height:92vh;overflow-y:auto">

                    <div class="flex items-center justify-between px-5 pt-5 pb-4 border-b border-slate-100">
                        <div>
                            <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">${isBulk ? 'จัดพิกัดกลุ่ม' : 'กำหนดตำแหน่งสินค้า'}</p>
                            <p class="text-sm font-bold text-brand-blue truncate mt-0.5" style="max-width:240px">${displayTitle}</p>
                        </div>
                        <button onclick="closeLocationSheet()" class="p-2 rounded-full bg-slate-100 hover:bg-slate-200 transition-colors">
                            <span class="material-icons-round text-slate-500 text-[20px]">close</span>
                        </button>
                    </div>

                    <!-- Location code preview -->
                    <div id="ls-banner" class="mx-5 mt-4 px-4 py-3 rounded-2xl flex items-center gap-3 ${locationCode ? 'bg-blue-50 border border-brand-blue/25' : 'bg-slate-50 border border-slate-200'}">
                        <span class="ls-banner-icon material-icons-round text-[22px] ${locationCode ? 'text-brand-blue' : 'text-slate-400'}">place</span>
                        <div>
                            <p class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">ตำแหน่งสินค้า</p>
                            <p id="ls-code-preview" class="text-base font-bold tracking-wider ${locationCode ? 'text-brand-blue' : 'text-slate-400'}">${locationCode || 'ยังไม่ได้กำหนด'}</p>
                        </div>
                    </div>

                    <div class="p-5 space-y-5 pb-8">

                        <!-- Step 1: Floor -->
                        <div>
                            <p class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2.5 flex items-center gap-1.5">
                                ${stepNum(1)} เลือกชั้น
                            </p>
                            <div class="grid grid-cols-3 gap-2">
                                ${FLOORS.map(f => `
                                    <button onclick="setSheetFloor('${f}')"
                                            class="py-3 rounded-2xl text-sm font-bold transition-all active:scale-95
                                                   ${floor === f ? 'bg-brand-blue text-white shadow-md shadow-brand-blue/30' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                                        ชั้น ${f}
                                    </button>
                                `).join('')}
                                <button onclick="setSheetFloor('NOSTK')"
                                        class="py-3 rounded-2xl text-sm font-bold transition-all active:scale-95
                                               ${floor === 'NOSTK' ? 'bg-slate-700 text-white shadow-md' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                                    ❌ NOSTK
                                </button>
                            </div>
                        </div>

                        ${floor && floor !== 'NOSTK' ? `
                        <!-- Step 2: Bin -->
                        <div>
                            <p class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2.5 flex items-center gap-1.5">
                                ${stepNum(2)} ระบุ Zone/Bin
                                <span class="font-normal normal-case text-slate-400">(เช่น 1A, 2B, 3E)</span>

                            </p>
                            <input id="ls-bin-input" type="text" value="${bin}"
                                placeholder="พิมพ์รหัส Bin..."
                                oninput="updateSheetBin(this.value)"
                                class="w-full p-3.5 rounded-2xl text-sm font-bold uppercase text-center tracking-widest transition-all
                                       ${bin ? 'bg-blue-50 border-2 border-brand-blue' : 'bg-slate-50 border-2 border-slate-200'}"
                                autocomplete="off">
                            ${existingBins.length > 0 ? `
                            <div class="mt-3">
                                <p class="text-[10px] font-semibold text-slate-400 mb-2">Bin ที่มีในชั้น ${floor} แล้ว:</p>
                                <div class="flex flex-wrap gap-1.5">
                                    ${existingBins.map(b => `
                                        <button onclick="updateSheetBin('${b}')"
                                                class="px-3 py-1.5 rounded-xl text-xs font-bold transition-all active:scale-95
                                                       ${bin === b ? 'bg-brand-blue text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200 border border-slate-200'}">
                                            ${b}
                                        </button>
                                    `).join('')}
                                </div>
                            </div>` : `<p class="text-[11px] text-slate-400 mt-2 text-center">ยังไม่มี Bin ในชั้น ${floor} — สร้างใหม่ได้เลย</p>`}
                        </div>` : ''}

                        <!-- Step 3: จำนวนที่จัดเก็บได้ -->
                        ${floor ? `
                        <div>
                            <p class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2.5 flex items-center gap-1.5">
                                ${stepNum(floor !== 'NOSTK' ? 3 : 2)} จำนวนที่จัดเก็บได้
                                <span class="font-normal normal-case text-slate-400">${isBulk ? '(ปล่อยว่างเพื่อคงค่าเดิม)' : '(ไม่บังคับ)'}</span>
                            </p>
                            <input type="number" min="0" value="${par}"
                                placeholder="${isBulk ? 'คงค่าจำนวนเดิมของแต่ละสินค้า' : 'ความจุสูงสุดที่เก็บได้ (ลัง)'}"
                                oninput="state.locationSheetParLevel=this.value"
                                class="w-full p-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-bold text-center focus:border-brand-orange focus:bg-white transition-all">
                        </div>` : ''}

                        <button id="ls-save-btn"
                                onclick="${canSave ? 'confirmLocationSheet()' : ''}"
                                class="w-full py-4 rounded-2xl font-bold text-base transition-all active:scale-[0.98]
                                       ${canSave ? 'bg-brand-blue text-white shadow-lg shadow-brand-blue/20' : 'bg-slate-100 text-slate-400 cursor-not-allowed'}">
                            ${canSave ? `✓ บันทึก ${locationCode}` : 'เลือกชั้นและระบุ Bin ก่อน'}
                        </button>
                    </div>
                </div>
            `;
        }

        function renderLocationRow(prod) {
            const isMissing = !prod.floor;
            const enc = encodeURIComponent(prod.name);
            const borderClass = isMissing ? 'border-rose-200' : 'border-slate-100';

            const locCode = displayLocationCode(prod);
            let locationChip = '';
            if (prod.floor === 'NOSTK') {
                locationChip = `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-500 border border-slate-200">❌ NOSTK</span>`;
            } else if (locCode) {
                locationChip = `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-blue-50 text-brand-blue border border-brand-blue/25 tracking-wide">📍 ${locCode}</span>`;
            } else {
                locationChip = `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-rose-50 text-rose-500 border border-rose-200">🔴 ยังไม่มีโลเคชั่น</span>`;
            }

            const parBadge = prod.parLevel
                ? `<span class="text-[10px] font-medium text-slate-400 ml-1">Par: <span class="font-bold text-slate-600">${prod.parLevel}</span></span>`
                : '';

            if (state.locationBulkMode) {
                const isSelected = !!state.locationSelectedItems[prod.name];
                const bgClass = isSelected ? 'bg-indigo-55 bg-indigo-50/50 border-indigo-300 shadow-md shadow-indigo-50/10' : `${borderClass} bg-white`;
                const checkIcon = isSelected ? 'check_box' : 'check_box_outline_blank';
                const checkColor = isSelected ? 'text-indigo-600 font-bold' : 'text-slate-300';
                
                return `
                    <div onclick="toggleBulkItemSelect(decodeURIComponent('${enc}'))"
                         id="bulk-row-${enc}"
                         class="p-3.5 rounded-2xl border shadow-sm mb-2.5 flex items-center justify-between gap-3 cursor-pointer transition-all ${bgClass}">
                        <div class="flex-1 min-w-0">
                            <p class="font-bold text-brand-blue text-sm leading-snug truncate mb-1">${esc(prod.name)}</p>
                            <div class="flex items-center flex-wrap gap-1">
                                ${locationChip}
                                ${parBadge}
                            </div>
                        </div>
                        <span id="bulk-check-${enc}" class="material-icons-round ${checkColor} text-[24px] flex-shrink-0 select-none">
                            ${checkIcon}
                        </span>
                    </div>`;
            }

            const btnLabel = isMissing ? '📍 กำหนด' : '✏️ แก้ไข';
            const btnClass = isMissing
                ? 'bg-indigo-600 text-white'
                : 'bg-slate-100 text-slate-600 hover:bg-slate-200';

            return `
                <div class="bg-white p-3.5 rounded-2xl ${borderClass} border shadow-sm mb-2.5 flex items-center justify-between gap-3">
                    <div class="flex-1 min-w-0">
                        <p class="font-bold text-brand-blue text-sm leading-snug truncate mb-1">${esc(prod.name)}</p>
                        <div class="flex items-center flex-wrap gap-1">
                            ${locationChip}
                            ${parBadge}
                        </div>
                    </div>
                    <button onclick="openLocationSheet(decodeURIComponent('${enc}'))"
                            class="flex-shrink-0 px-3 py-2 rounded-xl text-xs font-bold transition-all active:scale-95 ${btnClass}">
                        ${btnLabel}
                    </button>
                </div>`;
        }

        function updateLocationSearch(value) {
            state.locationSearch = value;
            state.locationLimit = 40; // รีเซ็ต limit เมื่อพิมพ์ค้นหา
            const listEl = document.getElementById('location-list');
            if (listEl) {
                listEl.innerHTML = renderLocationListHTML();
            }
        }

        function renderLocationListHTML() {
            const floorF = state.locationFloorFilter;
            const zoneF  = state.locationZoneFilter;
            const binF   = state.locationBinFilter;
            const search = (state.locationSearch || '').toLowerCase().trim();

            let displayList = [];
            if (floorF === '') {
                displayList = state.products.filter(p => !p.floor);
            } else if (floorF === 'NOSTK') {
                displayList = state.products.filter(p => p.floor === 'NOSTK');
            } else if (floorF && zoneF && binF) {
                displayList = state.products.filter(p => p.floor === floorF && extractZone(p.location) === zoneF && p.location === binF);
            } else if (floorF && zoneF) {
                displayList = state.products.filter(p => p.floor === floorF && extractZone(p.location) === zoneF);
            } else if (floorF) {
                displayList = state.products.filter(p => p.floor === floorF);
            }

            if (search) {
                displayList = displayList.filter(p => (p.name || '').toLowerCase().includes(search));
            }

            const totalCount = displayList.length;
            const sliced = displayList.slice(0, state.locationLimit);

            const emptyMsg = search ? 'ไม่พบสินค้าที่ค้นหา'
                : floorF === 'NOSTK' ? 'ยังไม่มีสินค้ากลุ่มนี้'
                : binF ? `ยังไม่มีสินค้าใน Bin ${binF}`
                : zoneF ? `ยังไม่มีสินค้าในโซน ${zoneF}`
                : floorF ? `ยังไม่มีสินค้าในชั้น ${floorF}`
                : 'สินค้าทุกรายการมีโลเคชั่นแล้ว 🎉';

            if (totalCount === 0) {
                return `
                    <div class="flex flex-col items-center justify-center py-16 text-slate-400 animate-fade-in">

                        ${binsInZone.map(b => {

                            <span class="material-icons-round text-[18px]">add_circle</span>
                            เพิ่มสินค้าเข้าโซน ${zoneF}${binF ? ' › ' + binF : ''}

                    </div>` : ''}

                    <main id="location-list" class="flex-1 overflow-y-auto p-4 pb-16">
                        ${renderLocationListHTML()}
                    </main>

                    <div id="bulk-action-bar">
                        ${state.locationBulkMode ? setTimeout(updateBulkActionBar, 50) && '' : ''}
