                                        <div class="flex gap-3 pt-2">
                                            <button type="button" onclick="openReceiveForm(null)" class="flex-1 bg-white border border-slate-200 text-slate-500 py-3.5 rounded-xl font-medium text-sm transition-colors hover:bg-slate-50">ยกเลิก</button>
                                            <button type="submit" class="flex-[2] bg-brand-orange text-white py-3.5 rounded-xl font-medium text-sm shadow-[0_4px_12px_rgba(227,82,5,0.2)] active:scale-[0.98] transition-all hover:bg-[#c94804]">ยืนยันการส่ง</button>
                                        </div>
                                    </div>
                                </form>
                            `}
                        </div>
                    `).join('') + `</div>`;
                }
            } else if (state.w2Tab === 'history') { content = renderHistoryList('w2'); }

            return `
                <div class="w-full max-w-md bg-[#f8fafc] min-h-screen flex flex-col relative">
                    <header class="bg-brand-blue text-white p-4 flex justify-between items-center sticky top-0 z-20 shadow-md">
                        <div class="flex items-center gap-2"><button onclick="setView('home')" class="p-1.5 rounded-full hover:bg-black/10 transition-colors text-white"><span class="material-icons-round">arrow_back</span></button><h1 class="text-[17px] font-bold tracking-wide flex items-center gap-1.5"><span class="material-icons-round text-[20px]">warehouse</span> คลังสินค้า (AKRA)</h1></div>
                        <div class="flex items-center gap-2">
                            <button onclick="fetchInitialData(true)" class="p-1.5 rounded-full hover:bg-black/10 transition-colors text-white" title="รีเฟรชข้อมูล"><span class="material-icons-round text-[20px]">refresh</span></button>
                            <div class="text-[10px] font-semibold tracking-wide bg-black/20 text-white px-3 py-1.5 rounded-full flex items-center gap-1.5 border border-white/10"><span class="material-icons-round text-[14px]">account_circle</span> ${currentUser || 'Demo'}</div>
                        </div>
                    </header>
                    <div class="flex bg-white shadow-sm sticky top-[60px] z-10 border-b border-slate-100 px-2">
                        <button onclick="setW2Tab('tasks')" class="flex-1 py-3.5 text-[13px] font-semibold border-b-[2px] relative transition-all ${state.w2Tab === 'tasks' ? 'border-brand-blue text-brand-blue' : 'border-transparent text-slate-400 hover:text-slate-600'}">งานจัด ${hasTasks ? `<span class="absolute top-3.5 right-4 w-1.5 h-1.5 rounded-full bg-brand-orange ring-2 ring-white"></span>` : ''}</button>
                        <button onclick="setW2Tab('history')" class="flex-1 py-3.5 text-[13px] font-semibold border-b-[2px] transition-all ${state.w2Tab === 'history' ? 'border-brand-blue text-brand-blue' : 'border-transparent text-slate-400 hover:text-slate-600'}">ประวัติ</button>
                    </div>
                    <main class="flex-1 overflow-y-auto p-5 pb-24">${content}</main>
                </div>`;
        }

        // ── Render: Location Manager ──
        function renderLocationRow(prod) {
            const edit = state.locationEdits[prod.name] || {};
            const currentFloor    = edit.floor    !== undefined ? edit.floor    : (prod.floor    || '');
            const currentLocation = edit.location !== undefined ? edit.location : (prod.location || '');
            const currentParLevel = edit.parLevel !== undefined ? edit.parLevel : (prod.parLevel || '');
            const hasPending = !!state.locationEdits[prod.name];
            const isMissing  = !prod.floor;
            const enc = encodeURIComponent(prod.name);
            const borderClass = hasPending
                ? 'border-brand-blue border-2'
                : isMissing ? 'border-rose-200' : 'border-slate-100';
            return `
                <div class="bg-white p-4 rounded-2xl ${borderClass} border shadow-sm mb-3">
                    <div class="flex items-start justify-between gap-2 mb-3">
                        <h3 class="font-bold text-brand-blue text-sm leading-snug flex-1">${prod.name}</h3>
                        ${isMissing && !hasPending ? '<span class="text-[9px] font-bold px-2 py-0.5 rounded-full bg-rose-50 text-rose-500 border border-rose-200 flex-shrink-0">ไม่มีโลเคชั่น</span>' : ''}
                        ${hasPending ? '<span class="text-[9px] font-bold px-2 py-0.5 rounded-full bg-brand-blue/10 text-brand-blue border border-brand-blue/20 flex-shrink-0">✏️ รอบันทึก</span>' : ''}
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[10px] font-bold text-emerald-700 uppercase tracking-wider mb-1">📍 ชั้น</label>
                            <select onchange="updateLocationEdit(decodeURIComponent('${enc}'), 'floor', this.value)"
                                class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:border-brand-blue transition-all">
                                <option value="" ${!currentFloor ? 'selected' : ''}>-- เลือก --</option>
                                ${['1','2','3','4','5'].map(f => `<option value="${f}" ${currentFloor === f ? 'selected' : ''}>ชั้น ${f}</option>`).join('')}
                                <option value="NOSTK" ${currentFloor === 'NOSTK' ? 'selected' : ''}>❌ ไม่มีพื้นที่จัดหน้าร้าน</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-emerald-700 uppercase tracking-wider mb-1">📍 โลเคชั่น</label>
                            <input type="text" value="${currentLocation}" placeholder="เช่น A-01-1"
                                oninput="updateLocationEdit(decodeURIComponent('${enc}'), 'location', this.value)"
                                class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:border-brand-blue transition-all">
                        </div>
                        <div class="col-span-2">
                            <label class="block text-[10px] font-bold text-brand-orange uppercase tracking-wider mb-1">📦 Par Level (${prod.unit || 'หน่วย'})</label>
                            <input type="number" min="0" value="${currentParLevel}" placeholder="ยอดสต๊อกเต็ม"
                                oninput="updateLocationEdit(decodeURIComponent('${enc}'), 'parLevel', this.value)"
                                class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:border-brand-orange transition-all text-center font-bold">
                        </div>
                    </div>
                </div>`;
        }

        function updateLocationSearch(value) {
            state.locationSearch = value;
            const search = value.toLowerCase().trim();
            // When searching: scan non-NOSTK products. When empty: show missing only (up to 20).
            const filtered = search
                ? state.products.filter(p => p.floor !== 'NOSTK' && p.name.toLowerCase().includes(search))
                : state.products.filter(p => !p.floor).slice(0, 20);
            const listEl = document.getElementById('location-list');
            if (!listEl) return;
            if (filtered.length === 0) {
                listEl.innerHTML = `<div class="flex flex-col items-center justify-center py-16 text-slate-400">
                    <span class="material-icons-round text-[40px] mb-2">check_circle_outline</span>
                    <p class="text-sm font-medium">${search ? 'ไม่พบสินค้าที่ค้นหา' : 'สินค้าทุกรายการมีโลเคชั่นแล้ว 🎉'}</p>
                </div>`;
            } else {
                listEl.innerHTML = filtered.map(renderLocationRow).join('');
            }
        }

        function updateLocationEdit(productName, field, value) {
            if (!state.locationEdits[productName]) {
                const existing = state.products.find(p => p.name === productName) || {};
                state.locationEdits[productName] = {
                    floor:    existing.floor    || '',
                    location: existing.location || '',
                    parLevel: existing.parLevel || ''
                };
            }
            state.locationEdits[productName][field] = value;
            const saveBar = document.getElementById('location-save-bar');
            if (saveBar) {
                const n = Object.keys(state.locationEdits).length;
                saveBar.innerHTML = `
                    <p class="text-[11px] text-center text-slate-400 mb-2">✏️ แก้ไขแล้ว ${n} รายการ รอ Save</p>
                    <button onclick="handleLocationSave()" class="w-full bg-brand-blue text-white font-bold py-4 rounded-2xl shadow-lg shadow-brand-blue/20 active:scale-[0.98] transition-all">
                        💾 บันทึกทั้งหมด (${n} รายการ)
                    </button>`;
                saveBar.classList.remove('hidden');
            } else {
                render();
            }
        }

        async function handleLocationSave() {
            const entries = Object.entries(state.locationEdits);
            if (entries.length === 0) return;

            showLoading(`กำลังบันทึกโลเคชั่น 0/${entries.length}...`);
            let successCount = 0;
            let failCount = 0;

            for (const [productName, edits] of entries) {
                const existing = getProductDetails(productName);
                const floor    = edits.floor    !== undefined ? edits.floor    : (existing.floor    || '');
                const location = edits.location !== undefined ? edits.location : (existing.location || '');
                const parLevel = edits.parLevel !== undefined && edits.parLevel !== '' ? parseInt(edits.parLevel) : (existing.parLevel || 0);
                try {
                    await pushProductDetails(productName, floor, location, parLevel);
                    successCount++;
                } catch (e) {
                    console.error('handleLocationSave failed for', productName, e);
                    failCount++;
                }
                document.getElementById('loading-text').innerText =
                    `กำลังบันทึกโลเคชั่น ${successCount + failCount}/${entries.length}...`;
            }

            state.locationEdits = {};
            localStorage.removeItem('TRDAKRA_DATA');
            hideLoading();

            const msg = failCount > 0
                ? `บันทึกสำเร็จ ${successCount} รายการ ล้มเหลว ${failCount} รายการ`
                : `✅ บันทึกโลเคชั่นสำเร็จ ${successCount} รายการ`;
            alert(msg);

            sendAppLog('จัดโลเคชั่นสินค้า', `บันทึก ${successCount} รายการ`);
            fetchInitialData(true);
        }

        function renderLocationManager() {
            const search = (state.locationSearch || '').toLowerCase().trim();
            const tab = state.locationTab;
            const editCount = Object.keys(state.locationEdits).length;

            const missingList = state.products.filter(p => !p.floor);
            const nostkList   = state.products.filter(p => p.floor === 'NOSTK');
            const missingCount = missingList.length;
            const nostkCount   = nostkList.length;

            // List logic
            let displayList, showAllBtn = '';
            if (search) {
                // Search scans all products except NOSTK for clarity; show all when searching
                displayList = state.products.filter(p => p.floor !== 'NOSTK' && p.name.toLowerCase().includes(search));
            } else if (tab === 'nostk') {
                displayList = nostkList;
            } else {
                // missing tab — default 20, show-all button
                displayList = state.locationShowAll ? missingList : missingList.slice(0, 20);
                if (!state.locationShowAll && missingCount > 20) {
                    showAllBtn = `
                        <button onclick="state.locationShowAll=true; render()" class="w-full mt-2 py-3 border border-slate-200 rounded-2xl text-sm font-semibold text-slate-500 hover:bg-slate-50 transition-all flex items-center justify-center gap-2">
                            <span class="material-icons-round text-[16px]">expand_more</span>
                            แสดงทั้งหมด ${missingCount} รายการ
                        </button>`;
                }
            }

            const rows = displayList.map(renderLocationRow).join('');

            const emptyMsg = search
                ? 'ไม่พบสินค้าที่ค้นหา'
                : tab === 'nostk'
                    ? 'ยังไม่มีสินค้าที่ถูกระบุว่าไม่มีพื้นที่จัด'
                    : 'สินค้าทุกรายการมีโลเคชั่นแล้ว 🎉';

            return `
                <div class="w-full max-w-md bg-[#f8fafc] min-h-screen flex flex-col relative animate-fade-in">
                    <header class="bg-brand-blue text-white p-4 flex justify-between items-center sticky top-0 z-20 shadow-md">
                        <div class="flex items-center gap-2">
                            <button onclick="setView('home')" class="p-1.5 rounded-full hover:bg-black/10 transition-colors text-white">
                                <span class="material-icons-round">arrow_back</span>
                            </button>
                            <h1 class="text-[17px] font-bold tracking-wide flex items-center gap-1.5">
                                <span class="material-icons-round text-[20px]">place</span> จัดโลเคชั่นสินค้า
                            </h1>
                        </div>
                        <button onclick="fetchInitialData(true)" class="p-1.5 rounded-full hover:bg-black/10 transition-colors text-white">
                            <span class="material-icons-round text-[20px]">refresh</span>
                        </button>
                    </header>

                    <!-- Search -->
                    <div class="p-4 bg-white border-b border-slate-100 sticky top-[60px] z-10 shadow-sm">
                        <input type="text" value="${state.locationSearch}" placeholder="🔍 ค้นหาชื่อสินค้า..."
                            oninput="updateLocationSearch(this.value)"
                            class="w-full p-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm focus:border-brand-blue focus:bg-white transition-all">
                    </div>

                    <!-- Tabs (hidden when searching) -->
                    ${!search ? `
                    <div class="flex bg-white border-b border-slate-100 px-2">
                        <button onclick="state.locationTab='missing'; state.locationShowAll=false; render()" class="flex-1 py-3 text-[12px] font-semibold border-b-2 transition-all ${tab === 'missing' ? 'border-brand-blue text-brand-blue' : 'border-transparent text-slate-400'}">
                            ยังไม่มีโลเคชั่น
                            ${missingCount > 0 ? `<span class="ml-1 bg-rose-100 text-rose-600 text-[10px] px-1.5 py-0.5 rounded-full">${missingCount}</span>` : ''}
                        </button>
                        <button onclick="state.locationTab='nostk'; render()" class="flex-1 py-3 text-[12px] font-semibold border-b-2 transition-all ${tab === 'nostk' ? 'border-brand-blue text-brand-blue' : 'border-transparent text-slate-400'}">
                            ไม่มีพื้นที่จัด
                            ${nostkCount > 0 ? `<span class="ml-1 bg-slate-100 text-slate-500 text-[10px] px-1.5 py-0.5 rounded-full">${nostkCount}</span>` : ''}
                        </button>
                    </div>` : ''}

                    <!-- Context label -->
                    ${tab === 'nostk' && !search ? `
                    <div class="px-4 py-2.5 bg-slate-50 border-b border-slate-100">
                        <p class="text-[11px] text-slate-500">สินค้าในกลุ่มนี้ไม่ได้เก็บสต๊อกหน้าร้าน เช่น ของแช่ฟรีซ หรือสินค้าคลังนอก จะไม่ถูกนับในระบบสำรวจ</p>
                    </div>` : ''}

                    <main id="location-list" class="flex-1 overflow-y-auto p-4 ${editCount > 0 ? 'pb-36' : 'pb-6'}">
                        ${search ? `<p class="text-[11px] text-slate-400 font-medium mb-3 px-1">ผลการค้นหา <span class="font-bold text-brand-blue">${displayList.length} รายการ</span> (ไม่รวมกลุ่มไม่มีพื้นที่จัด)</p>` : ''}
                        ${displayList.length === 0
                            ? `<div class="flex flex-col items-center justify-center py-16 text-slate-400">
                                <span class="material-icons-round text-[40px] mb-2">check_circle_outline</span>
                                <p class="text-sm font-medium text-center px-4">${emptyMsg}</p>
                               </div>`
                            : rows + showAllBtn}
                    </main>

                    ${editCount > 0 ? `
                        <div id="location-save-bar" class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white border-t border-slate-100 p-4 shadow-2xl">
                            <p class="text-[11px] text-center text-slate-400 mb-2">✏️ แก้ไขแล้ว ${editCount} รายการ รอ Save</p>
                            <button onclick="handleLocationSave()" class="w-full bg-brand-blue text-white font-bold py-4 rounded-2xl shadow-lg shadow-brand-blue/20 active:scale-[0.98] transition-all">
                                💾 บันทึกทั้งหมด (${editCount} รายการ)
                            </button>
                        </div>` : ''}
                </div>`;
        }

        // Main Render Function
        function render() {
            const root = document.getElementById('app-root');
            if (state.view === 'home')      { root.innerHTML = renderHome(); }
            else if (state.view === 'w1')   { root.innerHTML = renderW1(); }
            else if (state.view === 'w2')   { root.innerHTML = renderW2(); }
            else if (state.view === 'dashboard') { root.innerHTML = renderDashboard(); }
            else if (state.view === 'survey')    { root.innerHTML = renderSurvey(); }
            else if (state.view === 'location')  { root.innerHTML = renderLocationManager(); }
        }

        // ==========================================
        // 6. INITIALIZATION
        // ==========================================
        window.onload = function() {
            ssoInit();
        };

    </script>
</body>
</html>
