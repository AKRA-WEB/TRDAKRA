<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบเบิกจ่ายสินค้า TRD-AKRA</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            blue: '#171C8F',
                            orange: '#E35205',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Custom Styles & Animations */
        body { 
            font-family: 'Sarabun', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            background-color: #f8fafc; /* slate-50 */
            color: #1e293b; /* slate-800 */
        }
        .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Hide scrollbar for cleaner look */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        /* Loading Overlay */
        #loading-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
            z-index: 9999;
            align-items: center; justify-content: center; flex-direction: column;
        }
        
        /* Smooth transitions for inputs */
        input, button { transition: all 0.2s ease-in-out; }
    </style>
</head>
<body class="bg-[#f8fafc]">

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="flex">
        <div class="animate-spin rounded-full h-10 w-10 border-[3px] border-brand-blue/20 border-t-brand-orange mb-4"></div>
        <p class="text-brand-blue font-bold text-sm tracking-wide" id="loading-text">กำลังโหลดข้อมูล...</p>
    </div>

    <div id="app-root" class="min-h-screen flex justify-center">
        <!-- Content will be injected here by JavaScript -->
    </div>

    <script>
        // ==========================================
        // 0. AUTHENTICATION & LOG SYSTEM (AKRA SSO v2)
        // ==========================================
        const CURRENT_APP_NAME = "TRDAKRA";
        const CURRENT_VERSION = "20260602.04";
        const GOOGLE_APP_SCRIPT_URL_LOG = "https://script.google.com/macros/s/AKfycbw5PCJ1OlxCQR6zaNubrmZTgaORB-rJK2Ow5_YC3i5kKv-BrrTgJkTJyNZKrzfodK1m/exec";

        const SSO_CONFIG = {
            PORTAL_URL:     "https://akra-web.github.io/Main/",
            API_URL:        "https://script.google.com/macros/s/AKfycbxMdnPcafzGl-ekKcttDGWwAfQE1AfQ3L8zssLIF8jvP513ajVvAnAaAtocjboiwqvD/exec",
            STORAGE_KEY:    "akra_trdakra_session",
            REQUIRED_ROLES: []  // [] = ทุก Role เข้าได้ | ระบุเช่น ["ADMIN","TRD"] เพื่อจำกัดสิทธิ์
        };

        let currentUser = null;

        // UI helpers สำหรับแสดง error และ redirect
        function ssoShowError(message) {
            document.getElementById('loading-overlay').style.display = 'none';
            alert(message);
            setTimeout(() => { window.location.replace(SSO_CONFIG.PORTAL_URL); }, 500);
        }

        // ฟังก์ชัน verify token + init app — เรียกใน window.onload
        async function ssoInit() {
            // ── DEV BYPASS: localhost หรือ ?demo=1 → ข้าม SSO ──
            const isLocalhost = ['localhost', '127.0.0.1'].includes(location.hostname);
            const isDemoMode  = new URLSearchParams(location.search).get('demo') === '1';
            if (isLocalhost || isDemoMode) {
                currentUser = 'ทดสอบระบบ';
                showLoading('กำลังโหลดข้อมูล (Demo Mode)...');
                fetchInitialData();
                return;
            }
            // ────────────────────────────────────────────────────
            const urlParams = new URLSearchParams(window.location.search);
            const ssoToken  = urlParams.get('sso');

            if (ssoToken) {
                // ===== มี Token จาก Main Menu — verify กับ Server =====
                try { window.history.replaceState({}, document.title, window.location.pathname); } catch(e) {}

                try {
                    const rolesParam = SSO_CONFIG.REQUIRED_ROLES.length
                        ? '&roles=' + SSO_CONFIG.REQUIRED_ROLES.join(',')
                        : '';
                    const res    = await fetch(`${SSO_CONFIG.API_URL}?action=verifyToken&token=${encodeURIComponent(ssoToken)}${rolesParam}`);
                    const result = await res.json();

                    if (!result.valid) {
                        const errorMsg = {
                            token_expired:    'Session หมดอายุ กรุณาเข้าสู่ระบบใหม่',
                            user_not_found:   'ไม่พบข้อมูลผู้ใช้ในระบบ',
                            permission_denied:'คุณไม่มีสิทธิ์เข้าใช้งานระบบนี้',
                            invalid_token:    'ไม่สามารถยืนยันตัวตนได้ กรุณาเข้าสู่ระบบใหม่'
                        };
                        localStorage.removeItem(SSO_CONFIG.STORAGE_KEY);
                        ssoShowError(errorMsg[result.reason] || 'เกิดข้อผิดพลาดในการยืนยันตัวตน');
                        return;
                    }

                    // Token ผ่าน — บันทึก session ไว้ใช้ตอน refresh หน้า
                    localStorage.setItem(SSO_CONFIG.STORAGE_KEY, JSON.stringify({
                        name:  result.user.name,
                        id:    result.user.id,
                        roles: result.user.roles
                    }));
                    currentUser = result.user.name;

                } catch(e) {
                    ssoShowError('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์เพื่อตรวจสอบสิทธิ์ได้');
                    return;
                }

            } else {
                // ===== ไม่มี Token — อ่าน session เดิม (กรณี refresh หน้า) =====
                const cached = localStorage.getItem(SSO_CONFIG.STORAGE_KEY);
                if (!cached) {
                    ssoShowError('กรุณาเข้าสู่ระบบผ่านหน้า Portal ก่อนใช้งาน');
                    return;
                }
                try {
                    const session = JSON.parse(cached);
                    const hasPermission = SSO_CONFIG.REQUIRED_ROLES.length === 0 ||
                        session.roles.some(r => SSO_CONFIG.REQUIRED_ROLES.includes(r));
                    if (!hasPermission) {
                        localStorage.removeItem(SSO_CONFIG.STORAGE_KEY);
                        ssoShowError('คุณไม่มีสิทธิ์เข้าใช้งานระบบนี้');
                        return;
                    }
                    currentUser = session.name;
                } catch(e) {
                    localStorage.removeItem(SSO_CONFIG.STORAGE_KEY);
                    ssoShowError('Session ไม่ถูกต้อง กรุณาเข้าสู่ระบบใหม่');
                    return;
                }
            }

            // Auth ผ่าน — โหลดแอพ
            showLoading('กำลังโหลดข้อมูลเบิกจ่าย...');
            fetchInitialData();
        }

        function sendAppLog(action, details) {
            const payload = { user: currentUser, action: action, app: CURRENT_APP_NAME, details: details };
            fetch(GOOGLE_APP_SCRIPT_URL_LOG, {
                method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
            }).then(() => { console.log(`บันทึก Log สำเร็จ: ${action}`); }).catch(err => console.error(err));
        }

        // ==========================================
        // 1. CONFIGURATION & STATE
        // ==========================================
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwiG8bB8P5c_U_ZQkPpb2tNxFVIRZDiuxLQTzGQtWSJ6VUNQrJpsIlgaADON7D945c/exec';
        let state = {
            view: 'home',
            w1Tab: 'request',
            w2Tab: 'tasks',
            w2BatchEdits: {},
            dashboardFilter: 'week',
            items: [],
            products: [],
            w1Rows: [{ itemName: '', qty: '', storageCapacity: '', floor: '', location: '', parLevel: '', oldExpiry: '', unit: '' }],
            // Location Manager State
            locationSearch: '',
            locationFloorFilter: '',
            locationZoneFilter: '',
            locationSheet: null,
            locationSheetFloor: '',
            locationSheetZoneInput: '',
            locationSheetParLevel: '',
            // Check Stock State
            checkStockLocation: null,
            checkStockEdits: {}, // { productName: { checked: true, currentStock: '', requestQty: '' } }
            checkStockSearch: '',
            checkStockCheckedLocations: JSON.parse(localStorage.getItem('TRDAKRA_CHECKED_LOCATIONS') || '{}'),
            checkStockSubmitting: false,
            checkStockEditingPar: null,
            checkStockParInput: '',
            // Analytics Dashboard
            dashboardTab: 'summary',
            calendarMonth: new Date().getMonth(),
            calendarYear: new Date().getFullYear(),
            calendarWeekOffset: 0,
            calendarSelectedDate: null,
            surveyLogs: null,
            surveyLogsLoading: false
        };

        function showLoading(text = 'กำลังทำงาน...') {
            document.getElementById('loading-text').innerText = text;
            document.getElementById('loading-overlay').style.display = 'flex';
        }

        function hideLoading() { document.getElementById('loading-overlay').style.display = 'none'; }

        // ==========================================
        // 2. API FUNCTIONS (FETCH) & DATE FORMATTERS
        // ==========================================
        function formatDateTime(dateStr) {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr;

            const optionsDate = { timeZone: 'Asia/Bangkok', day: '2-digit', month: '2-digit', year: 'numeric' };
            const optionsTime = { timeZone: 'Asia/Bangkok', hour: '2-digit', minute: '2-digit', hour12: false };
            
            let datePart = d.toLocaleDateString('th-TH', optionsDate).replace(/\//g, '-'); 
            let timePart = d.toLocaleTimeString('th-TH', optionsTime);

            return `${datePart} / ${timePart} น.`;
        }

        function convertToCE(dateStr) {
            if (!dateStr) return dateStr;
            const regex = /^(\d{1,2})[-/](\d{1,2})[-/](\d{4})$/;
            const match = dateStr.trim().match(regex);
            if (match) {
                let day = match[1].padStart(2, '0');
                let month = match[2].padStart(2, '0');
                let year = parseInt(match[3], 10);
                if (year > 2500) year -= 543;
                return `${day}-${month}-${year}`; 
            }
            return dateStr; 
        }

        function formatExpiryDate(val) {
            if (!val || val === 'ไม่ได้ระบุ') return val;
            if (typeof val === 'string' && val.match(/^\d{4}-\d{2}-\d{2}T/)) {
                const d = new Date(val);
                if (!isNaN(d.getTime())) {
                    return `${String(d.getDate()).padStart(2, '0')}-${String(d.getMonth() + 1).padStart(2, '0')}-${d.getFullYear() + 543}`;
                }
            }
            if (typeof val === 'string') {
                const regex = /^(\d{1,2})[-/](\d{1,2})[-/](\d{4})$/;
                const match = val.trim().match(regex);
                if (match) {
                    let year = parseInt(match[3], 10);
                    if (year > 1900 && year < 2500) year += 543;
                    return `${match[1].padStart(2, '0')}-${match[2].padStart(2, '0')}-${year}`;
                }
            }
            return val;
        }

        function parseCustomDate(dateStr) {
            if (!dateStr) return new Date(0);
            const isoTry = new Date(dateStr);
            if (!isNaN(isoTry.getTime()) && String(dateStr).includes('T')) return isoTry;

            try {
                const parts = String(dateStr).split('/');
                if (parts.length >= 1) {
                    const dSplit = parts[0].trim().split('-');
                    if (dSplit.length === 3) {
                        const day = parseInt(dSplit[0], 10);
                        const month = parseInt(dSplit[1], 10) - 1;
                        let year = parseInt(dSplit[2], 10);
                        if (year > 2500) year -= 543; 

                        let hrs = 0, mins = 0;
                        if (parts.length > 1) {
                            const tSplit = parts[1].replace('น.', '').trim().split(':');
                            if (tSplit.length >= 2) { 
                                hrs = parseInt(tSplit[0], 10); 
                                mins = parseInt(tSplit[1], 10); 
                            }
                        }
                        const pDate = new Date(year, month, day, hrs, mins);
                        if (!isNaN(pDate.getTime())) return pDate;
                    }
                }
            } catch(e) {}
            return new Date();
        }

        const TRD_CACHE_TTL = 10 * 60 * 1000;
        function getCache(key, ttlMs) { try { const raw = localStorage.getItem(key); if (!raw) return null; const w = JSON.parse(raw); if (Date.now() - (w._ts||0) > ttlMs) { localStorage.removeItem(key); return null; } return w._d; } catch(e) { localStorage.removeItem(key); return null; } }
        function setCache(key, data) { localStorage.setItem(key, JSON.stringify({ _ts: Date.now(), _d: data })); }
        function mapItemData(item) {
            return {
                ...item,
                rawDate: parseCustomDate(item.timestamp),
                timestamp: String(item.timestamp).includes('/') ? item.timestamp : formatDateTime(item.timestamp),
                dispatchTimestamp: item.dispatchTimestamp ? (String(item.dispatchTimestamp).includes('/') ? item.dispatchTimestamp : formatDateTime(item.dispatchTimestamp)) : '',
                requestedBy: item.requestedBy || '',
                oldExpiry: formatExpiryDate(item.oldExpiry),
                newExpiry: formatExpiryDate(item.newExpiry),
                storageCapacity: parseInt(item.currentStock || item.storageCapacity) || 0
            };
        }

        // ── ดึงข้อมูล floor/location/parLevel ของสินค้าจาก state.products ──
        function getProductDetails(itemName) {
            if (!itemName) return { floor: '', location: '', parLevel: 0 };
            const prod = state.products.find(p => (p.name || '').trim() === itemName.trim());
            if (!prod) return { floor: '', location: '', parLevel: 0 };
            return { floor: prod.floor || '', location: prod.location || '', parLevel: prod.parLevel || 0 };
        }

        // ── บันทึก Floor/Location/ParLevel กลับ Google Sheet ──
        async function pushProductDetails(itemName, floor, location, parLevel) {
            if (!itemName || (!floor && !location && !parLevel)) return;
            try {
                await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'updateProductDetails', name: itemName, floor, location, parLevel: parseInt(parLevel) || 0 })
                });
                // อัปเดต state.products ด้วย ไม่ต้อง reload
                const idx = state.products.findIndex(p => (p.name || '').trim() === itemName.trim());
                if (idx !== -1) {
                    if (floor)    state.products[idx].floor    = floor;
                    if (location) state.products[idx].location = location;
                    if (parLevel) state.products[idx].parLevel = parseInt(parLevel) || 0;
                }
            } catch (err) { console.error('pushProductDetails error', err); }
        }

        // ── Logic คำนวณสถานะสต๊อก ──
        function getStockStatus(currentStock, parLevel) {
            const cur = parseInt(currentStock) || 0;
            const par = parseInt(parLevel) || 0;
            if (par === 0) return { status: 'no-par', label: '❓ ยังไม่ตั้ง Par', color: 'text-slate-400', bg: 'bg-slate-50', border: 'border-slate-200', needOrder: 0, dot: 'bg-slate-300' };
            const ratio = cur / par;
            const need = Math.max(0, par - cur);
            if (cur === 0)    return { status: 'empty',    label: '❌ หมด!',     color: 'text-rose-600',   bg: 'bg-rose-50',   border: 'border-rose-200',   needOrder: need, dot: 'bg-rose-500' };
            if (ratio < 0.3)  return { status: 'critical', label: '🔴 ใกล้หมด', color: 'text-rose-600',   bg: 'bg-rose-50',   border: 'border-rose-200',   needOrder: need, dot: 'bg-rose-500' };
            if (ratio < 1.0)  return { status: 'low',      label: '⚠️ น้อย',    color: 'text-amber-600',  bg: 'bg-amber-50',  border: 'border-amber-200',  needOrder: need, dot: 'bg-amber-400' };
            return              { status: 'ok',       label: '✅ พอแล้ว',  color: 'text-emerald-600', bg: 'bg-emerald-50', border: 'border-emerald-200', needOrder: 0,    dot: 'bg-emerald-400' };
        }
        function extractZone(location) {
            if (!location) return '';
            return location.split('-')[0].trim();
        }

        function setLocationFloor(floor) {
            state.locationFloorFilter = state.locationFloorFilter === floor ? '' : floor;
            state.locationZoneFilter = '';
            state.locationSearch = '';
            render();
        }

        function setLocationZone(zone) {
            state.locationZoneFilter = state.locationZoneFilter === zone ? '' : zone;
            render();
        }

        function openLocationSheet(productName) {
            const prod = state.products.find(p => p.name === productName) || {};
            state.locationSheet = { name: productName };
            state.locationSheetFloor = prod.floor || '';
            state.locationSheetZoneInput = prod.location || '';
            state.locationSheetParLevel = prod.parLevel ? String(prod.parLevel) : '';
            render();
        }

        function closeLocationSheet() {
            state.locationSheet = null;
            state.locationSheetFloor = '';
            state.locationSheetZoneInput = '';
            state.locationSheetParLevel = '';
            render();
        }

        function setSheetFloor(floor) {
            state.locationSheetFloor = floor;
            state.locationSheetZoneInput = '';
            render();
        }

        async function confirmLocationSheet() {
            const name     = state.locationSheet ? state.locationSheet.name : null;
            const floor    = state.locationSheetFloor;
            const zone     = (state.locationSheetZoneInput || '').trim().toUpperCase();
            const parLevel = parseInt(state.locationSheetParLevel) || 0;

            if (!name || !floor) return;
            if (floor !== 'NOSTK' && !zone) return;

            showLoading('กำลังบันทึกโลเคชั่น...');
            try {
                await pushProductDetails(name, floor, floor === 'NOSTK' ? '' : zone, parLevel);
                localStorage.removeItem('TRDAKRA_DATA');
                sendAppLog('จัดโลเคชั่นสินค้า', `${name} → ชั้น ${floor} โซน ${zone}`);
            } catch(e) {
                hideLoading();
                alert('บันทึกไม่สำเร็จ กรุณาลองใหม่');
                return;
            }
            hideLoading();
            closeLocationSheet();
        }

        function parseFormattedDate(str) {
            if (!str) return null;
            const match = str.match(/(\d{2})-(\d{2})-(\d{4})/);
            if (!match) return null;
            let year = parseInt(match[3]);
            if (year > 2500) year -= 543;
            return new Date(year, parseInt(match[2]) - 1, parseInt(match[1]));
        }

        function getLastDispatchInfo(itemName) {
            const dispatched = state.items.filter(i =>
                i.itemName === itemName && i.status === 'จัดส่งแล้ว'
            );
            if (dispatched.length === 0) return null;
            let latestDate = null;
            dispatched.forEach(item => {
                const d = item.dispatchTimestamp ? parseFormattedDate(item.dispatchTimestamp) : item.rawDate;
                if (d && (!latestDate || d > latestDate)) latestDate = d;
            });
            if (!latestDate) return null;
            const daysAgo = Math.floor((Date.now() - latestDate.getTime()) / (1000 * 60 * 60 * 24));
            const label = daysAgo === 0 ? 'วันนี้' : daysAgo + ' วันที่แล้ว';
            if      (daysAgo <= 3)  return { daysAgo, label, color: 'text-emerald-600', bg: 'bg-emerald-50', border: 'border-emerald-200' };
            else if (daysAgo <= 7)  return { daysAgo, label, color: 'text-lime-600',    bg: 'bg-lime-50',    border: 'border-lime-200' };
            else if (daysAgo <= 14) return { daysAgo, label, color: 'text-amber-600',   bg: 'bg-amber-50',   border: 'border-amber-200' };
            else if (daysAgo <= 30) return { daysAgo, label, color: 'text-orange-600',  bg: 'bg-orange-50',  border: 'border-orange-200' };
            else                    return { daysAgo, label, color: 'text-rose-600',    bg: 'bg-rose-50',    border: 'border-rose-200' };
        }

        function getProductUnitClient(itemName) {
            if (!itemName) return 'หน่วย';
            const prod = state.products.find(p => {
                if (typeof p === 'object' && p !== null) {
                    return (p.name || p.itemName || '').trim() === itemName.trim();
                }
                return String(p).trim() === itemName.trim();
            });
            if (prod && typeof prod === 'object') {
                return prod.unit || 'หน่วย';
            }
            return 'หน่วย';
        }

        async function fetchInitialData(isRefresh = false, skipHideLoading = false) {
            if (!APPS_SCRIPT_URL) { hideLoading(); alert('กรุณาใส่ APPS_SCRIPT_URL ก่อนใช้งาน'); return; }
            if (!isRefresh) {
                const cached = getCache('TRDAKRA_DATA', TRD_CACHE_TTL);
                if (cached) {
                    state.items = (cached.rawItems || []).map(mapItemData);
                    state.products = cached.products || [];
                    render();
                } else { showLoading('กำลังโหลดข้อมูล...'); }
            } else { showLoading('กำลังรีเฟรชข้อมูล...'); }

            try {
                const itemsResponse = await fetch(`${APPS_SCRIPT_URL}?action=getItems`);
                const itemsData = await itemsResponse.json();
                state.items = (itemsData || []).map(mapItemData);

                const productsResponse = await fetch(`${APPS_SCRIPT_URL}?action=getProducts`);
                const productsData = await productsResponse.json();
                if (Array.isArray(productsData)) {
                    state.products = productsData.map(p => {
                        if (typeof p === 'object' && p !== null) {
                            return {
                                name: p.name || p.itemName || p[0] || '',
                                unit: p.unit || p[1] || 'หน่วย',
                                floor: p.floor || '',
                                location: p.location || '',
                                parLevel: parseInt(p.parLevel) || 0
                            };
                        }
                        return { name: String(p).trim(), unit: 'หน่วย', floor: '', location: '', parLevel: 0 };
                    }).filter(p => p.name !== '');
                } else { state.products = []; }

                setCache('TRDAKRA_DATA', { rawItems: itemsData, products: state.products });
                render();
            } catch (error) {
                console.error('Error fetching data:', error);
                if (!getCache('TRDAKRA_DATA', TRD_CACHE_TTL)) alert('ไม่สามารถเชื่อมต่อกับฐานข้อมูลได้ กรุณาลองใหม่อีกครั้ง');
            } finally {
                if (!skipHideLoading) {
                    hideLoading();
                }
            }
        }

        async function syncDataToSheet(skipHideLoading = false) {
            if (!APPS_SCRIPT_URL) return;
            showLoading('กำลังบันทึกข้อมูล...');
            try {
                const itemsToSave = state.items.map(({rawDate, ...rest}) => rest);
                await fetch(APPS_SCRIPT_URL, {
                    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(itemsToSave)
                });
            } catch (error) {
                console.error('Error saving data:', error); alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล');
            } finally {
                if (!skipHideLoading) {
                    hideLoading();
                }
            }
        }

        // ==========================================
        // 3. AUTOCOMPLETE SEARCH LOGIC
        // ==========================================
        function filterProducts(query, index) {
            const listDiv = document.getElementById(`autocomplete-list-${index}`);
            if (!listDiv) return;

            const q = query.toLowerCase().trim();
            let filtered = !q ? state.products.slice(0, 50) : state.products.filter(p => p.name.toLowerCase().includes(q)).slice(0, 50);

            if (filtered.length === 0) {
                listDiv.innerHTML = state.products.length === 0 ? 
                    `<div class="p-5 text-center"><span class="material-icons-round text-rose-300 text-3xl mb-2">error_outline</span><p class="text-sm font-semibold text-rose-500">ไม่พบฐานข้อมูลสินค้า</p></div>` : 
                    `<div class="p-4 text-sm text-slate-400 text-center">ไม่พบสินค้าที่ค้นหา</div>`;
            } else {
                listDiv.innerHTML = filtered.map(p => `
                    <div onclick="selectProduct(decodeURIComponent('${encodeURIComponent(p.name)}'), decodeURIComponent('${encodeURIComponent(p.unit)}'), ${index})" 
                         class="px-4 py-3 hover:bg-blue-50 hover:text-blue-700 cursor-pointer border-b border-slate-50 text-sm text-slate-700 last:border-0 truncate flex items-center gap-3 transition-colors">
                        <span class="material-icons-round text-blue-300 text-[18px]">inventory_2</span> ${p.name} <span class="text-xs text-slate-400">(${p.unit})</span>
                    </div>
                `).join('');
            }
            listDiv.classList.remove('hidden');
        }

        function selectProduct(name, unit, index) {
            updateW1RowValue(index, 'itemName', name);
            updateW1RowValue(index, 'unit', unit);
            // Auto-fill floor/location/parLevel จาก Product Sheet
            const details = getProductDetails(name);
            if (details.floor)    updateW1RowValue(index, 'floor', details.floor);
            if (details.location) updateW1RowValue(index, 'location', details.location);
            if (details.parLevel) updateW1RowValue(index, 'parLevel', details.parLevel);
            render();
        }

        // ==========================================
        // 4. ACTION HANDLERS
        // ==========================================
        function setView(viewName) {
            state.view = viewName;
            state.w2BatchEdits = {};
            if (viewName === 'w1') {
                state.w1Rows = [{ itemName: '', qty: '', storageCapacity: '', floor: '', location: '', parLevel: '', oldExpiry: '', unit: '' }];
            }
            if (viewName === 'location') {
                state.locationSearch = '';
                state.locationFloorFilter = '';
                state.locationZoneFilter = '';
                state.locationSheet = null;
                state.locationSheetFloor = '';
                state.locationSheetZoneInput = '';
                state.locationSheetParLevel = '';
            }
            if (viewName === 'check_stock') {
                state.checkStockLocation = null;
                state.checkStockEdits = {};
                state.checkStockSearch = '';
            }
            render();
        }
        function setW1Tab(tabName) { state.w1Tab = tabName; render(); }
        function setW2Tab(tabName) { state.w2Tab = tabName; state.w2BatchEdits = {}; render(); }

        function getEffectiveState(item) {
            const edit = state.w2BatchEdits[item.id];
            if (edit === 'dispatch') return 'dispatch';
            if (edit === 'outstock') return 'outstock';
            return item.status === 'สินค้าหมด' ? 'outstock' : 'pending';
        }

        function toggleW2BatchItem(id) {
            const item = state.items.find(i => i.id === id);
            if (!item) return;
            const cur = getEffectiveState(item);
            if (cur === 'pending') {
                state.w2BatchEdits[id] = 'dispatch';
            } else if (cur === 'dispatch') {
                state.w2BatchEdits[id] = 'outstock';
            } else {
                // outstock → ถ้า item เดิมเป็น สินค้าหมด ให้วนไป dispatch ได้ (สต๊อกเข้าแล้ว)
                // ถ้า item เดิมเป็น pending ให้ delete กลับ pending
                if (item.status === 'สินค้าหมด') state.w2BatchEdits[id] = 'dispatch';
                else delete state.w2BatchEdits[id];
            }
            render();
        }
        function setDashboardFilter(val) {
            state.dashboardFilter = val;
            state.calendarWeekOffset = 0;
            state.calendarMonth = new Date().getMonth();
            state.calendarYear = new Date().getFullYear();
            state.calendarSelectedDate = null;
            render();
        }

        function setDashboardTab(tab) {
            state.dashboardTab = tab;
            if (tab === 'survey' && state.surveyLogs === null && !state.surveyLogsLoading) {
                fetchSurveyLogs();
            } else {
                render();
            }
        }

        function setCalendarNav(dir) {
            if (state.dashboardFilter === 'month') {
                state.calendarMonth += dir;
                if (state.calendarMonth > 11) { state.calendarMonth = 0; state.calendarYear++; }
                if (state.calendarMonth < 0)  { state.calendarMonth = 11; state.calendarYear--; }
            } else {
                state.calendarWeekOffset = (state.calendarWeekOffset || 0) + dir;
            }
            state.calendarSelectedDate = null;
            render();
        }

        function selectCalendarDate(dateStr) {
            state.calendarSelectedDate = state.calendarSelectedDate === dateStr ? null : dateStr;
            render();
        }

        function getDisplayedWeekStart() {
            const now = new Date();
            const day = now.getDay();
            const monday = new Date(now);
            monday.setDate(now.getDate() - day + (day === 0 ? -6 : 1));
            monday.setHours(0, 0, 0, 0);
            monday.setDate(monday.getDate() + (state.calendarWeekOffset || 0) * 7);
            return monday;
        }

        function buildActivityMap() {
            const map = {};
            state.items.forEach(item => {
                const d = item.rawDate ? new Date(item.rawDate) : null;
                if (!d || isNaN(d.getTime())) return;
                const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
                if (!map[key]) map[key] = { billCount: 0, hasStockout: false, qty: 0 };
                if (item.status === 'จัดส่งแล้ว' || item.status === 'รับสินค้าแล้ว') {
                    map[key].billCount++;
                    map[key].qty += parseInt(item.receiveQty) || 0;
                }
                if (item.status === 'สินค้าหมด') map[key].hasStockout = true;
            });
            return map;
        }

        async function fetchSurveyLogs() {
            state.surveyLogsLoading = true;
            render();
            try {
                const res = await fetch(`${APPS_SCRIPT_URL}?action=getSurveyLog`);
                state.surveyLogs = await res.json();
            } catch(e) {
                state.surveyLogs = [];
            }
            state.surveyLogsLoading = false;
            render();
        }

        function addW1Row() {
            state.w1Rows.push({ itemName: '', qty: '', storageCapacity: '', floor: '', location: '', parLevel: '', oldExpiry: '', unit: '' });
            render();
        }

        function removeW1Row(index) {
            if (state.w1Rows.length > 1) {
                state.w1Rows.splice(index, 1);
                render();
            }
        }

        function updateW1RowValue(index, field, value) {
            state.w1Rows[index][field] = value;
            // Don't call render() here to avoid losing focus during typing
        }

        async function handleW1Submit(event) {
            event.preventDefault();
            const itemName = document.getElementById('w1-itemName').value;
            const qty = document.getElementById('w1-qty').value;
            const storageCapacity = document.getElementById('w1-storageCapacity').value; // ความจุหน้าร้าน
            const oldExpiryInput = document.getElementById('w1-oldExpiry').value;

            if (!itemName || !qty) return;

            const now = new Date();
            const newItem = {
                id: `REQ-${Math.floor(Math.random() * 9000) + 1000}`,
                rawDate: now,
                timestamp: formatDateTime(now.toISOString()),
                itemName: itemName,
                requestQty: parseInt(qty),
                storageCapacity: storageCapacity ? parseInt(storageCapacity) : 0, // บันทึกค่าความจุ
                status: 'สั่งเบิก',
                oldExpiry: oldExpiryInput ? convertToCE(oldExpiryInput) : 'ไม่ได้ระบุ',
                newExpiry: '', receiveQty: null, receiveNote: '', w2Note: '',
                requestedBy: currentUser || 'ไม่ทราบ'
            };

            state.items.unshift(newItem); 
            state.w1Tab = 'pending'; 
            render(); 
            
            await syncDataToSheet(); 
            alert('ส่งคำขอเบิกสินค้าเรียบร้อยแล้ว!');
            const unit = getProductUnitClient(itemName);
            sendAppLog("สั่งเบิกสินค้า (TRD)", `เบิก: ${itemName} จำนวน ${qty} ${unit} (ความจุ: ${storageCapacity})`);
        }

        async function handleW1SubmitBulk() {
            const validRows = state.w1Rows.filter(row => row.itemName && row.qty);
            if (validRows.length === 0) {
                alert('กรุณากรอกชื่อสินค้าและจำนวนอย่างน้อย 1 รายการ');
                return;
            }

            showLoading('กำลังส่งรายการเบิก...');
            const now = new Date();
            const timestamp = formatDateTime(now.toISOString());

            const newItems = validRows.map(row => ({
                id: `REQ-${Math.floor(Math.random() * 9000) + 1000}`,
                rawDate: now,
                timestamp: timestamp,
                itemName: row.itemName,
                requestQty: parseInt(row.qty),
                storageCapacity: row.parLevel ? parseInt(row.parLevel) : (row.storageCapacity ? parseInt(row.storageCapacity) : 0),
                status: 'สั่งเบิก',
                oldExpiry: row.oldExpiry ? convertToCE(row.oldExpiry) : 'ไม่ได้ระบุ',
                newExpiry: '', receiveQty: null, receiveNote: '', w2Note: '',
                requestedBy: currentUser || 'ไม่ทราบ'
            }));

            state.items = [...newItems, ...state.items];
            state.w1Rows = [{ itemName: '', qty: '', storageCapacity: '', floor: '', location: '', parLevel: '', oldExpiry: '', unit: '' }];
            state.w1Tab = 'pending';
            render();

            await syncDataToSheet();

            // อัปเดต Floor/Location/ParLevel กลับ Product Sheet
            for (const row of validRows) {
                if (row.itemName && (row.floor || row.location || row.parLevel)) {
                    pushProductDetails(row.itemName, row.floor, row.location, row.parLevel);
                }
            }

            hideLoading();
            alert(`ส่งคำขอเบิกสินค้า ${newItems.length} รายการเรียบร้อยแล้ว!`);
            sendAppLog("สั่งเบิกสินค้า Bulk (TRD)", `เบิกรวม ${newItems.length} รายการ`);
        }

        async function cancelW1Item(id) {
            state.items = state.items.map(item =>
                item.id === id
                    ? { ...item, status: 'ยกเลิกรายการ', dispatchTimestamp: formatDateTime(new Date().toISOString()) }
                    : item
            );
            render();
            await syncDataToSheet();
            sendAppLog('ยกเลิกการเบิก (TRD)', `ID: ${id}`);
        }

        // ==========================================
        // 4b. SURVEY ACTION HANDLERS
        // ==========================================
        async function importParLevelsFromHistory() {
            // Build max storageCapacity per itemName from dispatched history
            const maxCapacity = {};
            state.items.forEach(item => {
                if (item.status === 'จัดส่งแล้ว') {
                    const cap = parseInt(item.storageCapacity) || 0;
                    if (cap > 0) {
                        if (!maxCapacity[item.itemName] || cap > maxCapacity[item.itemName]) {
                            maxCapacity[item.itemName] = cap;
                        }
                    }
                }
            });

            const entries = Object.entries(maxCapacity);
            if (entries.length === 0) { alert('ไม่พบข้อมูล storageCapacity ในประวัติ'); return; }
            if (!confirm(`นำเข้า Par Level จากประวัติ ${entries.length} รายการ\nจะ update Products Sheet ทันที ยืนยัน?`)) return;

            showLoading(`กำลังนำเข้า Par Level 0/${entries.length}...`);
            let count = 0;
            for (const [itemName, parLevel] of entries) {
                const existing = getProductDetails(itemName);
                await pushProductDetails(itemName, existing.floor || '', existing.location || '', parLevel);
                count++;
                document.getElementById('loading-text').innerText = `กำลังนำเข้า Par Level ${count}/${entries.length}...`;
            }
            // Invalidate cache so next load gets fresh parLevel
            localStorage.removeItem('TRDAKRA_DATA');
            hideLoading();
            alert(`✅ นำเข้า Par Level สำเร็จ ${count} รายการ\nกำลังรีเฟรชข้อมูล...`);
            sendAppLog('นำเข้า Par Level จากประวัติ', `อัปเดต ${count} รายการ`);
            fetchInitialData(true);
        }

        function setSurveyZone(zone) {
            state.surveyZone = state.surveyZone === zone ? null : zone;
            render();
        }

        function setSurveyFloor(floor) {
            state.surveyFloor = floor;
            state.surveyZone = null;
            state.surveyView = 'list';
            try { localStorage.setItem('TRDAKRA_SURVEY_SESSION', JSON.stringify({ floor: floor, data: state.surveyData })); } catch(e) {}
            render();
        }

        function updateSurveyData(itemName, field, value) {
            if (!state.surveyData[itemName]) state.surveyData[itemName] = { currentStock: '', parLevel: '' };
            state.surveyData[itemName][field] = value;
            // Persist survey session to survive page refresh
            try {
                localStorage.setItem('TRDAKRA_SURVEY_SESSION', JSON.stringify({
                    floor: state.surveyFloor,
                    data: state.surveyData
                }));
            } catch(e) {}
            // Real-time re-render สรุปท้ายหน้า
            const summaryEl = document.getElementById('survey-summary');
            if (summaryEl) {
                const list = buildSurveyOrderList();
                summaryEl.innerHTML = renderSurveySummaryBar(list);
            }
        }

        function buildSurveyOrderList() {
            const floorProducts = state.products.filter(p => p.floor === state.surveyFloor);
            const orderList = [];
            for (const prod of floorProducts) {
                const data = state.surveyData[prod.name] || {};
                const cur = parseInt(data.currentStock);
                const par = parseInt(data.parLevel) || prod.parLevel || 0;
                if (isNaN(cur) || par === 0) continue;
                const st = getStockStatus(cur, par);
                if (st.needOrder > 0) {
                    orderList.push({ name: prod.name, unit: prod.unit, needOrder: st.needOrder, status: st.status, parLevel: par });
                }
            }
            return orderList;
        }

        function renderSurveySummaryBar(list) {
            if (list.length === 0) {
                return `<div class="text-center text-slate-400 text-xs py-2">✅ ยังไม่พบรายการที่ต้องเบิก</div>`;
            }
            const criticalCount = list.filter(i => i.status === 'critical' || i.status === 'empty').length;
            return `
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-xs font-bold text-brand-blue">ต้องเบิก <span class="text-brand-orange">${list.length} รายการ</span></p>
                        ${criticalCount > 0 ? `<p class="text-[10px] text-rose-500 font-semibold">🔴 ด่วน ${criticalCount} รายการ</p>` : ''}
                    </div>
                    <button onclick="openSurveyConfirm()" class="bg-brand-orange text-white text-xs font-bold px-4 py-2 rounded-xl shadow shadow-brand-orange/30 active:scale-95 transition-all">
                        📤 เบิกทั้งหมด
                    </button>
                </div>`;
        }

        function openSurveyConfirm() {
            const list = buildSurveyOrderList();
            if (list.length === 0) { alert('ยังไม่มีรายการที่ต้องเบิก'); return; }
            state.surveyConfirmList = list;
            state.surveyView = 'confirm';
            render();
        }

        async function handleSurveyBulkOrder() {
            const list = state.surveyConfirmList;
            if (!list || list.length === 0) return;
            showLoading('กำลังส่งรายการเบิก...');

            const now = new Date();
            const timestamp = formatDateTime(now.toISOString());
            const newItems = list.map(item => ({
                id: `REQ-${Math.floor(Math.random() * 9000) + 1000}`,
                rawDate: now,
                timestamp,
                itemName: item.name,
                requestQty: item.needOrder,
                storageCapacity: item.parLevel || 0,
                status: 'สั่งเบิก',
                oldExpiry: 'ไม่ได้ระบุ',
                newExpiry: '', receiveQty: null, receiveNote: '', w2Note: '',
                requestedBy: currentUser || 'ไม่ทราบ'
            }));

            state.items = [...newItems, ...state.items];
            render();
            await syncDataToSheet();

            // บันทึก SurveyLog
            const logItems = list.map(item => {
                const data = state.surveyData[item.name] || {};
                return { name: item.name, currentStock: parseInt(data.currentStock) || 0, parLevel: item.parLevel, needToOrder: item.needOrder, status: item.status };
            });
            try {
                await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'saveSurveyLog', surveyedBy: currentUser || 'ไม่ทราบ', floor: state.surveyFloor, items: logItems })
                });
            } catch(e) { console.error('SurveyLog error', e); }

            // อัปเดต ParLevel กลับ Product Sheet
            for (const prod of state.products.filter(p => p.floor === state.surveyFloor)) {
                const data = state.surveyData[prod.name] || {};
                const par = parseInt(data.parLevel) || 0;
                if (par > 0 && par !== prod.parLevel) {
                    pushProductDetails(prod.name, prod.floor, prod.location, par);
                }
            }

            hideLoading();
            alert(`✅ ส่งเบิกสำเร็จ ${newItems.length} รายการ จากชั้น ${state.surveyFloor}`);
            sendAppLog('สำรวจสต๊อก+เบิก (Survey)', `ชั้น ${state.surveyFloor}: เบิก ${newItems.length} รายการ`);
            localStorage.removeItem('TRDAKRA_SURVEY_SESSION');
            state.surveyView = 'floors';
            state.surveyFloor = null;
            state.surveyData = {};
            state.surveyConfirmList = [];
            render();
        }

        // ==========================================
        // 5. UI RENDERING LOGIC
        // ==========================================

                                </div>
                                ${item.status === 'จัดส่งแล้ว' ? `
                                    <p class="mt-1 text-slate-600">เบิก <span class="font-semibold text-slate-700">${item.requestQty} ${getProductUnitClient(item.itemName)}</span> (ความจุ ${item.storageCapacity || 0}) • ส่งจริง <span class="font-semibold text-emerald-600">${item.receiveQty} ${getProductUnitClient(item.itemName)}</span></p>
                                    ${role === 'w1' ? `<p class="text-[11px] text-brand-blue font-medium flex items-center gap-1"><span class="material-icons-round text-[12px]">hourglass_empty</span> EXP ใหม่: ${item.newExpiry}</p>` : ''}
                                ` : ''}
                            </div>
                            ${item.status === 'จัดส่งแล้ว' && item.receiveNote && item.receiveNote !== 'ครบ' ? `<div class="text-[10px] font-medium text-brand-orange bg-brand-orange/5 px-2 py-0.5 rounded-md border border-brand-orange/20 mt-1">จัดส่ง${item.receiveNote}</div>` : ''}
                        </div>
                        ${item.w2Note ? `<p class="text-[11px] mt-3 text-amber-700 bg-amber-50 px-3 py-2 rounded-xl border border-amber-100/50"><span class="font-bold">โน้ต:</span> ${item.w2Note}</p>` : ''}
                    </div>
                `).join('')}</div>`;
        }

        // --- Render Dashboard (สถิติวิเคราะห์เชิงลึก AI) ---
        function getInsightDetails(itemName, qty, count, capacity) {
            const avgQty = Math.round(qty / count);
            const maxCapacity = capacity || 30;

            if (count >= 3 && qty >= maxCapacity * 1.5) {
                return { 
                    icon: 'local_fire_department', 
                    title: 'ขายไว / ควรขยายพื้นที่', 
                    desc: `ความจุหน้าร้านเก็บได้ ${maxCapacity} ชิ้น แต่เบิกรวมไปถึง ${qty} ชิ้น (ออกบ่อย ${count} รอบ) สินค้าหมดเชลฟ์ไวมาก แนะนำขยายพื้นที่จัดเก็บ`,
                    color: 'text-brand-orange', bg: 'bg-brand-orange/5', border: 'border-brand-orange/20'
                };
            }

            if (avgQty > maxCapacity) {
                return {
                    icon: 'shopping_cart', 
                    title: 'เบิกเกินความจุ (Overstock)', 
                    desc: `เบิกเฉลี่ย ${avgQty} ชิ้น/บิล ซึ่งล้นความจุหน้าร้าน (${maxCapacity} ชิ้น) อาจมีโปรโมชั่นหรือจัดพื้นที่สต๊อคนอกเชลฟ์`,
                    color: 'text-brand-blue', bg: 'bg-brand-blue/5', border: 'border-brand-blue/20'
                };
            }

            if (count >= 3 && avgQty <= maxCapacity / 2) {
                return { 
                    icon: 'inventory_2', 
                    title: 'ทยอยเติม (ตามพื้นที่)', 
                    desc: `เบิกบ่อย ${count} บิล ทีละ ${avgQty} ชิ้น (เต็มความจุ ${maxCapacity} ชิ้น) พนักงานต้องคอยเติมเรื่อยๆ เป็นการเบิกตามพื้นที่วางโชว์`,
                    color: 'text-amber-600', bg: 'bg-amber-50', border: 'border-amber-100'
                };
            }

            if (qty >= maxCapacity * 0.5 && qty <= maxCapacity * 1.2) {
                return {
                    icon: 'store', 
                    title: 'เบิกเติมเต็ม (Restock)', 
                    desc: `เบิกรวม ${qty} ชิ้น ใกล้เคียงกับความจุหน้าร้าน (${maxCapacity} ชิ้น) เป็นการทยอยเติมและจัดการสต๊อคที่สมดุลดีมาก`,
                    color: 'text-emerald-600', bg: 'bg-emerald-50', border: 'border-emerald-100'
                };
            }

            return { 
                icon: 'check_circle', 
                title: 'การเคลื่อนไหวปกติ', 
                desc: `ยอดเบิกเฉลี่ย ${avgQty} ชิ้น ความจุหน้าร้าน ${maxCapacity} ชิ้น อยู่ในระดับมาตรฐานการจัดการทั่วไป`,
                color: 'text-slate-600', bg: 'bg-slate-50', border: 'border-slate-200'
            };
        }

        function renderDashboard() {
            const filter = state.dashboardFilter;

            let startDate;
            if (filter === 'week') {
                startDate = getDisplayedWeekStart();
            } else {
                startDate = new Date(state.calendarYear, state.calendarMonth, 1);
            }

            const dispatchedItems = state.items.filter(i => {
                const d = i.rawDate ? new Date(i.rawDate) : new Date(0);
                return (i.status === 'จัดส่งแล้ว' || i.status === 'รับสินค้าแล้ว') && d >= startDate;
            });

            const TABS = [
                { id: 'summary',  label: 'สรุป',       icon: 'bar_chart' },
                { id: 'trend',    label: 'Trend',       icon: 'calendar_month' },
                { id: 'problems', label: 'หมด/ยกเลิก', icon: 'warning_amber' },
                { id: 'survey',   label: 'Survey',      icon: 'fact_check' }
            ];

            return `
                <div class="w-full max-w-md bg-[#f8fafc] min-h-screen flex flex-col relative animate-fade-in">
                    <header class="bg-brand-blue text-white p-4 flex justify-between items-center sticky top-0 z-20 shadow-md">
                        <div class="flex items-center gap-2">
                            <button onclick="setView('home')" class="p-1.5 rounded-full hover:bg-black/10 transition-colors text-white">
                                <span class="material-icons-round">arrow_back</span>
                            </button>
                            <h1 class="text-[17px] font-bold tracking-wide flex items-center gap-1.5">
                                <span class="material-icons-round text-[20px] text-white">insights</span> ข้อมูลเชิงลึก (Analytics)
                            </h1>
                        </div>
                        <button onclick="fetchInitialData(true)" class="p-1.5 rounded-full hover:bg-black/10 transition-colors text-white" title="รีเฟรชข้อมูล">
                            <span class="material-icons-round text-[20px]">refresh</span>
                        </button>
                    </header>

                    <div class="bg-white px-4 py-3 shadow-sm sticky top-[60px] z-10 border-b border-slate-100 flex justify-center">
                        <div class="bg-slate-100 p-1 rounded-xl flex w-full max-w-[250px]">
                            <button onclick="setDashboardFilter('week')" class="flex-1 py-1.5 text-xs font-semibold rounded-lg transition-all ${filter === 'week' ? 'bg-white text-brand-blue shadow-sm' : 'text-slate-400 hover:text-slate-600'}">สัปดาห์นี้</button>
                            <button onclick="setDashboardFilter('month')" class="flex-1 py-1.5 text-xs font-semibold rounded-lg transition-all ${filter === 'month' ? 'bg-white text-brand-blue shadow-sm' : 'text-slate-400 hover:text-slate-600'}">เดือนนี้</button>
                        </div>
                    </div>

                    <div class="bg-white sticky top-[108px] z-10 border-b border-slate-100 flex">
                        ${TABS.map(t => `
                            <button onclick="setDashboardTab('${t.id}')"
                                    class="flex-1 py-2.5 flex flex-col items-center gap-0.5 transition-colors ${state.dashboardTab === t.id ? 'text-brand-blue border-b-2 border-brand-blue bg-blue-50/50' : 'text-slate-400 hover:text-slate-500'}">
                                <span class="material-icons-round text-[18px]">${t.icon}</span>
                                <span class="text-[9px] font-semibold">${t.label}</span>
                            </button>
                        `).join('')}
                    </div>

                    <main class="flex-1 overflow-y-auto p-5 pb-24 space-y-6">
                        ${state.dashboardTab === 'summary'  ? renderDashboardSummary(dispatchedItems, state.items, startDate) :
                          state.dashboardTab === 'trend'    ? renderDashboardTrend() :
                          state.dashboardTab === 'problems' ? renderDashboardProblems(state.items, startDate) :
                          renderDashboardSurvey()}
                    </main>
                </div>
            `;
        }


        // --- Analytics Sub-renders ---
        function renderDashboardSummary(dispatchedItems, allItems, startDate) {
            let totalQty = 0, totalRequestQty = 0;
            const itemStats = {};
            const requesterStats = {};

            dispatchedItems.forEach(item => {
                const qty = parseInt(item.receiveQty) || 0;
                const reqQty = parseInt(item.requestQty) || 0;
                const capacity = parseInt(item.storageCapacity) || 0;
                totalQty += qty;
                totalRequestQty += reqQty;
                if (!itemStats[item.itemName]) itemStats[item.itemName] = { count: 0, qty: 0, capacity: 0 };
                itemStats[item.itemName].count++;
                itemStats[item.itemName].qty += qty;
                if (capacity > itemStats[item.itemName].capacity) itemStats[item.itemName].capacity = capacity;
                if (item.requestedBy) requesterStats[item.requestedBy] = (requesterStats[item.requestedBy] || 0) + 1;
            });

            const problemCount = allItems.filter(i => {
                const d = i.rawDate ? new Date(i.rawDate) : new Date(0);
                return (i.status === 'สินค้าหมด' || i.status === 'ยกเลิก') && d >= startDate;
            }).length;

            const fulfillmentRate = totalRequestQty > 0 ? Math.round((totalQty / totalRequestQty) * 100) : 100;
            const fulfillBg = fulfillmentRate >= 90 ? 'bg-emerald-500 shadow-emerald-500/20' : fulfillmentRate >= 70 ? 'bg-amber-500 shadow-amber-500/20' : 'bg-rose-500 shadow-rose-500/20';

            const topItems = Object.keys(itemStats).map(k => ({
                name: k, count: itemStats[k].count, qty: itemStats[k].qty, capacity: itemStats[k].capacity
            })).sort((a, b) => b.qty - a.qty).slice(0, 10);

            const topRequesters = Object.entries(requesterStats)
                .sort((a, b) => b[1] - a[1]).slice(0, 3)
                .map(([name, count]) => ({ name, count }));

            return `
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-brand-blue p-4 rounded-[1.5rem] shadow-lg shadow-brand-blue/20 text-white relative overflow-hidden">
                        <span class="material-icons-round absolute -right-2 -bottom-2 text-[60px] opacity-10">inventory</span>
                        <p class="text-[11px] font-semibold text-white/80 uppercase tracking-wider mb-1">ยอดจัดส่งรวม</p>
                        <p class="text-2xl font-bold">${totalQty.toLocaleString()} <span class="text-xs font-medium text-white/80">ชิ้น</span></p>
                    </div>
                    <div class="bg-brand-orange p-4 rounded-[1.5rem] shadow-lg shadow-brand-orange/20 text-white relative overflow-hidden">
                        <span class="material-icons-round absolute -right-2 -bottom-2 text-[60px] opacity-10">receipt_long</span>
                        <p class="text-[11px] font-semibold text-white/80 uppercase tracking-wider mb-1">จำนวนบิลเบิก</p>
                        <p class="text-2xl font-bold">${dispatchedItems.length.toLocaleString()} <span class="text-xs font-medium text-white/80">รายการ</span></p>
                    </div>
                    <div class="${fulfillBg} p-4 rounded-[1.5rem] shadow-lg text-white relative overflow-hidden">
                        <span class="material-icons-round absolute -right-2 -bottom-2 text-[60px] opacity-10">task_alt</span>
                        <p class="text-[11px] font-semibold text-white/80 uppercase tracking-wider mb-1">Fulfillment Rate</p>
                        <p class="text-2xl font-bold">${fulfillmentRate}<span class="text-xs font-medium text-white/80">%</span></p>
                    </div>
                    <div class="bg-rose-500 p-4 rounded-[1.5rem] shadow-lg shadow-rose-500/20 text-white relative overflow-hidden">
                        <span class="material-icons-round absolute -right-2 -bottom-2 text-[60px] opacity-10">error_outline</span>
                        <p class="text-[11px] font-semibold text-white/80 uppercase tracking-wider mb-1">หมด/ยกเลิก</p>
                        <p class="text-2xl font-bold">${problemCount} <span class="text-xs font-medium text-white/80">รายการ</span></p>
                    </div>
                </div>

                ${topRequesters.length > 0 ? `
                <div>
                    <h3 class="text-sm font-bold text-brand-blue mb-3 flex items-center gap-2 px-1">
                        <span class="material-icons-round text-brand-orange text-[18px]">emoji_people</span> ผู้ขอเบิกสูงสุด
                    </h3>
                    <div class="bg-white rounded-[1.5rem] shadow-[0_4px_16px_rgb(0,0,0,0.03)] border border-slate-100 divide-y divide-slate-50">
                        ${topRequesters.map(r => `
                            <div class="flex items-center gap-3 p-3">
                                <div class="w-8 h-8 rounded-full bg-brand-blue/10 text-brand-blue flex items-center justify-center font-bold text-xs flex-shrink-0">
                                    ${r.name.charAt(0).toUpperCase()}
                                </div>
                                <span class="text-sm font-semibold text-slate-700 flex-1 truncate">${r.name}</span>
                                <span class="text-xs font-bold text-brand-orange bg-brand-orange/10 px-2 py-0.5 rounded-lg">${r.count} บิล</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
                ` : ''}

                <div>
                    <h3 class="text-sm font-bold text-brand-blue mb-3 flex items-center gap-2 px-1">
                        <span class="material-icons-round text-brand-orange text-[18px]">lightbulb</span> วิเคราะห์พฤติกรรมการเบิก (Insights)
                    </h3>
                    ${topItems.length === 0 ? renderEmptyState('ไม่มีข้อมูลในช่วงเวลานี้', 'analytics') : `
                        <div class="space-y-4">
                            ${topItems.map((item, idx) => {
                                const insight = getInsightDetails(item.name, item.qty, item.count, item.capacity);
                                return `
                                    <div class="bg-white p-4 rounded-[1.5rem] shadow-[0_4px_16px_rgb(0,0,0,0.03)] border border-slate-100">
                                        <div class="flex justify-between items-start mb-3">
                                            <div class="flex-1 pr-3">
                                                <span class="text-[10px] font-bold text-slate-400">อันดับ ${idx + 1}</span>
                                                <h4 class="font-bold text-brand-blue text-[15px] leading-tight mt-0.5">${item.name}</h4>
                                            </div>
                                            <div class="text-right">
                                                <p class="font-bold text-brand-orange text-lg leading-none">${item.qty.toLocaleString()} <span class="text-[10px] font-medium text-brand-orange/80">ชิ้น</span></p>
                                                <p class="text-[10px] text-slate-400 font-medium mt-1">${item.count} บิลสั่งเบิก</p>
                                            </div>
                                        </div>
                                        <div class="${insight.bg} ${insight.border} border p-3 rounded-xl flex gap-3 items-start mt-2">
                                            <span class="material-icons-round ${insight.color} text-[18px] mt-0.5">${insight.icon}</span>
                                            <div>
                                                <p class="text-xs font-bold ${insight.color} mb-0.5">${insight.title}</p>
                                                <p class="text-[10px] text-slate-600 leading-snug">${insight.desc}</p>
                                            </div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    `}
                </div>

                <div>
                    <h3 class="text-sm font-bold text-brand-blue mb-3 flex items-center gap-2 px-1">
                        <span class="material-icons-round text-brand-orange text-[18px]">history</span> รายการบิลเบิกย้ายล่าสุด
                    </h3>
                    ${dispatchedItems.length === 0 ? renderEmptyState('ไม่มีบิลจัดส่ง', 'receipt') : `
                        <div class="bg-white rounded-[1.5rem] shadow-[0_4px_16px_rgb(0,0,0,0.03)] border border-slate-100 overflow-hidden">
                            ${dispatchedItems.slice(0, 20).map(bill => `
                                <div class="p-4 border-b border-slate-50 last:border-0 hover:bg-slate-50 transition-colors">
                                    <div class="flex justify-between items-center mb-1.5 flex-wrap gap-1">
                                        <span class="text-[10px] font-mono font-semibold text-brand-blue bg-brand-blue/10 px-2 py-0.5 rounded">${bill.id}</span>
                                        <div class="text-[9px] text-slate-400 flex items-center gap-2 flex-wrap">
                                            <span class="inline-flex items-center gap-0.5"><span class="material-icons-round text-[11px]">event_note</span>เบิก: ${bill.timestamp.split(' / ')[0]}</span>
                                            ${bill.dispatchTimestamp ? `<span class="inline-flex items-center gap-0.5"><span class="material-icons-round text-[11px] text-emerald-500">local_shipping</span>จัด: ${bill.dispatchTimestamp.split(' / ')[0]}</span>` : ''}
                                        </div>
                                    </div>
                                    <p class="text-sm font-bold text-slate-800 mb-1 truncate">${bill.itemName}</p>
                                    <div class="flex justify-between items-end">
                                        <div class="text-[10px] text-slate-500 flex items-center gap-1 mt-1">
                                            <span class="material-icons-round text-[12px] text-slate-400">inventory_2</span>
                                            ความจุ: <span class="font-medium text-slate-700">${bill.storageCapacity || 0} ชิ้น</span>
                                        </div>
                                        <span class="text-xs font-bold text-brand-orange bg-brand-orange/10 px-2 py-1 rounded-lg">ส่ง ${bill.receiveQty} ชิ้น</span>
                                    </div>
                                </div>
                            `).join('')}
                            ${dispatchedItems.length > 20 ? `<div class="p-3 text-center text-[10px] text-slate-400 bg-slate-50 border-t border-slate-100">แสดงข้อมูล 20 รายการล่าสุด</div>` : ''}
                        </div>
                    `}
                </div>
            `;
        }

        function renderDashboardTrend() {
            const filter = state.dashboardFilter;
            const actMap = buildActivityMap();
            const TH_MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

            let navLabel;
            if (filter === 'month') {
                navLabel = `${TH_MONTHS[state.calendarMonth]} ${state.calendarYear + 543}`;
            } else {
                const ws = getDisplayedWeekStart();
                const we = new Date(ws);
                we.setDate(ws.getDate() + 6);
                const fmt = d => `${d.getDate()} ${TH_MONTHS[d.getMonth()]}`;
                navLabel = `${fmt(ws)} – ${fmt(we)}`;
            }

            return `
                <div class="flex items-center justify-between bg-white p-3 rounded-2xl shadow-[0_2px_8px_rgb(0,0,0,0.04)] border border-slate-100">
                    <button onclick="setCalendarNav(-1)" class="p-2 rounded-xl hover:bg-slate-100 active:bg-slate-200 transition-colors">
                        <span class="material-icons-round text-brand-blue text-[20px]">chevron_left</span>
                    </button>
                    <span class="text-sm font-bold text-brand-blue">${navLabel}</span>
                    <button onclick="setCalendarNav(1)" class="p-2 rounded-xl hover:bg-slate-100 active:bg-slate-200 transition-colors">
                        <span class="material-icons-round text-brand-blue text-[20px]">chevron_right</span>
                    </button>
                </div>

                ${filter === 'month' ? renderCalendarMonth(actMap) : renderCalendarWeek(actMap)}

                ${state.calendarSelectedDate ? renderDayDetail(state.calendarSelectedDate) : ''}
            `;
        }

        function renderCalendarMonth(actMap) {
            const year = state.calendarYear;
            const month = state.calendarMonth;
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startDow = firstDay.getDay();
            const startOffset = startDow === 0 ? 6 : startDow - 1;

            const today = new Date();
            const todayKey = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
            const DAY_HEADERS = ['จ','อ','พ','พฤ','ศ','ส','อา'];

            const cells = [];
            for (let i = 0; i < startOffset; i++) cells.push(null);
            for (let d = 1; d <= lastDay.getDate(); d++) cells.push(new Date(year, month, d));
            while (cells.length % 7 !== 0) cells.push(null);

            return `
                <div class="bg-white rounded-[1.5rem] shadow-[0_4px_16px_rgb(0,0,0,0.03)] border border-slate-100 p-3">
                    <div class="grid grid-cols-7 mb-1">
                        ${DAY_HEADERS.map(h => `<div class="text-center text-[10px] font-bold text-slate-400 py-1">${h}</div>`).join('')}
                    </div>
                    <div class="grid grid-cols-7 gap-1">
                        ${cells.map(d => {
                            if (!d) return `<div></div>`;
                            const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
                            const act = actMap[key] || { billCount: 0, hasStockout: false };
                            const isToday = key === todayKey;
                            const isSelected = key === state.calendarSelectedDate;

                            let bg = 'bg-slate-50 text-slate-400';
                            if (act.billCount >= 6) bg = 'bg-brand-blue text-white';
                            else if (act.billCount >= 3) bg = 'bg-blue-300 text-blue-900';
                            else if (act.billCount >= 1) bg = 'bg-blue-100 text-blue-700';

                            return `
                                <div onclick="selectCalendarDate('${key}')"
                                     class="relative rounded-xl p-1.5 text-center cursor-pointer transition-all active:scale-95
                                            ${bg}
                                            ${isToday ? 'ring-2 ring-brand-orange ring-offset-1' : ''}
                                            ${isSelected ? 'ring-2 ring-brand-orange shadow-md' : ''}">
                                    <span class="text-[12px] font-bold leading-none">${d.getDate()}</span>
                                    ${act.billCount > 0 ? `<div class="text-[8px] font-semibold opacity-80 mt-0.5">${act.billCount}บ</div>` : ''}
                                    ${act.hasStockout ? `<div class="absolute top-0.5 right-0.5 w-1.5 h-1.5 bg-rose-500 rounded-full"></div>` : ''}
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function renderCalendarWeek(actMap) {
            const ws = getDisplayedWeekStart();
            const DAYS = ['จ','อ','พ','พฤ','ศ','ส','อา'];
            const days = Array.from({length: 7}, (_, i) => {
                const d = new Date(ws);
                d.setDate(ws.getDate() + i);
                return d;
            });

            const maxBills = Math.max(1, ...days.map(d => {
                const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
                return (actMap[key] || {}).billCount || 0;
            }));

            const today = new Date();

            return `
                <div class="bg-white rounded-[1.5rem] shadow-[0_4px_16px_rgb(0,0,0,0.03)] border border-slate-100 p-4">
                    <div class="grid grid-cols-7 gap-1 items-end" style="height:120px">
                        ${days.map((d, i) => {
                            const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
                            const act = actMap[key] || { billCount: 0, hasStockout: false };
                            const barH = Math.max(4, Math.round((act.billCount / maxBills) * 80));
                            const isToday = d.toDateString() === today.toDateString();
                            const isSelected = key === state.calendarSelectedDate;
                            const barColor = isSelected ? 'bg-brand-orange' : isToday ? 'bg-brand-blue' : 'bg-blue-300';

                            return `
                                <div onclick="selectCalendarDate('${key}')"
                                     class="flex flex-col items-center justify-end h-full cursor-pointer gap-0.5">
                                    <span class="text-[9px] font-bold text-slate-500">${act.billCount > 0 ? act.billCount : ''}</span>
                                    <div class="w-full rounded-t-lg ${barColor} ${isSelected ? 'ring-1 ring-brand-orange ring-offset-1' : ''} transition-all"
                                         style="height:${barH}px"></div>
                                    <span class="text-[9px] font-semibold ${isToday ? 'text-brand-blue' : 'text-slate-400'}">${DAYS[i]}</span>
                                    <span class="text-[10px] font-bold ${isToday ? 'text-brand-blue' : 'text-slate-600'}">${d.getDate()}</span>
